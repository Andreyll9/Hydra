name: Hydra Security & Code Audit

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Автопроверка каждый понедельник

permissions:
  contents: read
  security-events: write

jobs:
  go-audit:
    name: Go Security Audit (govulncheck & gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run govulncheck (Known CVEs)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          $(go env GOPATH)/bin/govulncheck ./... || true

      - name: Run gosec (Static Security Analysis)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          $(go env GOPATH)/bin/gosec -fmt=text ./... || true

  frontend-audit:
    name: Frontend Audit (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=moderate || true

  repo-scan:
    name: Full Repo Scan (Trivy - Secrets, Android, Misconfigs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'HIGH,CRITICAL'
