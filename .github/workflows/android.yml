                              <span>🟢 Сеть Wi-Fi: <b>{myWifiSubnetIp}</b></span>
                              <button type="button" on:click={scanNearbyWifiPeers} style="background: #1E3A8A; color: #fff; border: none; border-radius: 100px; padding: 4px 10px; font-size: 11px; cursor: pointer;">🔄 Поиск</button>
                          </div>

