name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Full Audit Fixes (v3.1.0)
        run: |
          cat << 'PYEOF' > audit_v310.py
          import os, re

          # 1. mobile/mobile.go: закрываем CORS строго на localhost
          mob_path = "mobile/mobile.go"
          if os.path.exists(mob_path):
              with open(mob_path, "r", encoding="utf-8") as f:
                  mb = f.read()
              mb = mb.replace('w.Header().Set("Access-Control-Allow-Origin", "*")', 'w.Header().Set("Access-Control-Allow-Origin", "http://127.0.0.1:8080")')
              with open(mob_path, "w", encoding="utf-8") as f:
                  f.write(mb)
              print("[OK] 1. mobile.go: CORS ограничен до 127.0.0.1:8080")

          # 2. MainActivity.kt: защита от сбоя таймера при BiometricPrompt + выбор фото с камеры
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()
              if "private var isBiometricPromptOpen = false" not in kt:
                  kt = kt.replace(
                      "private var isCallActive = false",
                      "private var isCallActive = false\n    private var isBiometricPromptOpen = false"
                  )
                  kt = kt.replace(
                      'pushNativeLog("BIO-HW", "Запрос аппаратного сканера отпечатка для ВХОДА',
                      'isBiometricPromptOpen = true\n                pushNativeLog("BIO-HW", "Запрос аппаратного сканера отпечатка для ВХОДА'
                  )
                  kt = kt.replace(
                      'pushNativeLog("BIO-OK", "Отпечаток пальца подтверждён аппаратно!',
                      'isBiometricPromptOpen = false\n                            pushNativeLog("BIO-OK", "Отпечаток пальца подтверждён аппаратно!'
                  )
                  kt = kt.replace(
                      'pushNativeLog("BIO-ERR", "Отмена/ошибка биометрии при входе',
                      'isBiometricPromptOpen = false\n                            pushNativeLog("BIO-ERR", "Отмена/ошибка биометрии при входе'
                  )
                  kt = kt.replace(
                      "if (!isOpeningSystemPicker && !isCallActive) {",
                      "if (!isOpeningSystemPicker && !isCallActive && !isBiometricPromptOpen) {"
                  )
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 2. MainActivity.kt: защищён таймер 30с при вызове BiometricPrompt")

          # 3. App.svelte:
          # - сбрасываем showContactProfile = false при выборе любого чата
          # - добавляем пункты "Выбрать несколько" и "Выделить отрывок" в messageContextMenu
          # - чистим версию до 3.1.0-hydra
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              ap = ap.replace(
                  "selectedContact = contact;\n      showSettings = false;",
                  "selectedContact = contact;\n      showSettings = false;\n      showContactProfile = false;"
              )

              extra_menu_items = """            {#if messageContextMenu.message?.Content && !messageContextMenu.message.Content.startsWith('[HYDRA_')}
                          <div class="context-item" on:click={() => {
                              if (window.__openHydraQuoteModal) window.__openHydraQuoteModal(messageContextMenu.message);
                              messageContextMenu.show = false;
                          }}>✂️ Выделить / цитировать отрывок</div>
                      {/if}
                      <div class="context-item" on:click={() => {
                          if (window.__toggleHydraSelectMode) window.__toggleHydraSelectMode(messageContextMenu.message);
                          messageContextMenu.show = false;
                      }}>☑️ Выбрать несколько</div>"""

              if "__openHydraQuoteModal" not in ap:
                  ap = ap.replace(
                      ">Копировать текст</div>\n            {/if}",
                      ">Копировать текст</div>\n            {/if}\n" + extra_menu_items,
                      1
                  )

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 3. App.svelte: сброс профиля группы и пункты выделения/цитирования добавлены")

          # 4. Chat.svelte:
          # - выносим <audio bind:this={remoteAudioEl}> НАРУЖУ из {#if activeCallModal && !callMinimized}
          # - чиним вкладки стикерпаков (visibleStickers + кнопки паков)
          # - сохраняем статус прочтения (синий круг) в localStorage
          # - чиним наезд кнопки ↓ на крестик ✕
          # - добавляем камеру (фото), мультивыбор сообщений и окно выделения отрывка
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              # A. Выносим <audio> наружу, чтобы звук не умирал при сворачивании звонка
              ch = ch.replace('<audio bind:this={remoteAudioEl} autoplay></audio>', '')
              if 'bind:this={remoteAudioEl}' not in ch:
                  ch = ch.replace(
                      '<div class="chat-area animate-fade-in" class:mobile={isMobile}>',
                      '<div class="chat-area animate-fade-in" class:mobile={isMobile}>\n    <audio bind:this={remoteAudioEl} autoplay playsinline style="display:none;"></audio>',
                      1
                  )

              # B. Персистентный статус прочтения (сплошной синий круг)
              read_persist_js = """
              let peerReadTimestamps = {};
              try { peerReadTimestamps = JSON.parse(localStorage.getItem('hydra_peer_read_ts') || '{}'); } catch (e) { peerReadTimestamps = {}; }
              $: currentPeerReadTs = selectedContact ? (peerReadTimestamps[selectedContact.ChatID] || peerReadTimestamps[selectedContact.ID] || 0) : 0;

              let isSelectMode = false;
              let selectedMsgIds = [];
              let quoteModalMsg = null;

              function toggleMsgSelect(msgId) {
                  if (selectedMsgIds.includes(msgId)) {
                      selectedMsgIds = selectedMsgIds.filter(id => id !== msgId);
                  } else {
                      selectedMsgIds = [...selectedMsgIds, msgId];
                  }
                  if (selectedMsgIds.length === 0) isSelectMode = false;
              }

              function copySelectedMessages() {
                  const texts = (messages || [])
                      .filter(m => selectedMsgIds.includes(m.ID) && m.Content && !m.Content.startsWith('[HYDRA_'))
                      .map(m => m.Content);
                  if (texts.length > 0) {
                      AppActions.ClipboardSet(texts.join('\\n\\n'));
                      alert('✅ Скопировано сообщений: ' + texts.length);
                  }
                  isSelectMode = false;
                  selectedMsgIds = [];
              }

              function handleQuickCameraPhoto(e) {
                  const file = e.target.files?.[0];
                  if (!file || !selectedContact) return;
                  const reader = new FileReader();
                  reader.onload = async () => {
                      try {
                          const tmpPath = await AppActions.SaveTempImage(reader.result, 'camera_' + Date.now() + '.jpg');
                          if (tmpPath) {
                              await AppActions.SendFileMessage(selectedContact.ID, '', '', [tmpPath], false);
                              dispatch('refresh');
                          }
                      } catch (err) {
                          alert('Ошибка отправки фото: ' + err);
                      }
                  };
                  reader.readAsDataURL(file);
                  e.target.value = '';
              }

              if (typeof window !== 'undefined') {
                  window.__toggleHydraSelectMode = (msg) => {
                      isSelectMode = true;
                      if (msg && msg.ID && !selectedMsgIds.includes(msg.ID)) {
                          selectedMsgIds = [...selectedMsgIds, msg.ID];
                      }
                  };
                  window.__openHydraQuoteModal = (msg) => {
                      quoteModalMsg = msg;
                  };
              }
              """
              if "let peerReadTimestamps =" not in ch:
                  ch = ch.replace("let callMinimized = false;", "let callMinimized = false;\n" + read_persist_js, 1)

              ch = ch.replace(
                  "EventsOn('remote_chat_read', (chatId) => {\n        if (selectedContact && (selectedContact.ChatID === chatId || selectedContact.ID === chatId)) {\n            messages = (messages || []).map(m => m.IsOutgoing ? { ...m, Status: 'read' } : m);\n        }\n    });",
                  """EventsOn('remote_chat_read', (chatId) => {
                  peerReadTimestamps[chatId] = Date.now();
                  peerReadTimestamps = { ...peerReadTimestamps };
                  localStorage.setItem('hydra_peer_read_ts', JSON.stringify(peerReadTimestamps));
                  if (selectedContact && (selectedContact.ChatID === chatId || selectedContact.ID === chatId)) {
                      messages = (messages || []).map(m => m.IsOutgoing ? { ...m, Status: 'read' } : m);
                  }
              });"""
              )

              ch = ch.replace(
                  "{#if msg.Status === 'read'}",
                  "{#if msg.Status === 'read' || (currentPeerReadTs > 0 && msg.Timestamp <= currentPeerReadTs)}"
              )

              # C. Клик по сообщению в режиме мультивыбора + чекбокс
              ch = ch.replace(
                  "if (isMobile) {\n                        onShowMessageMenu(e, msg);\n                    }",
                  "if (isSelectMode) {\n                        toggleMsgSelect(msg.ID);\n                        return;\n                    }\n                    if (isMobile) {\n                        onShowMessageMenu(e, msg);\n                    }"
              )

              # Панель мультивыбора сверху чата
              select_bar = """{#if isSelectMode}
              <div style="background: #1E3A8A; color: #fff; padding: 8px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; flex-shrink: 0;">
                  <span>☑️ Выбрано: {selectedMsgIds.length}</span>
                  <div style="display: flex; gap: 8px;">
                      <button type="button" on:click={copySelectedMessages} style="background: #10B981; color: #fff; border: none; border-radius: 100px; padding: 5px 12px; font-size: 12px; font-weight: 800;">📋 Копировать</button>
                      <button type="button" on:click={() => { isSelectMode = false; selectedMsgIds = []; }} style="background: rgba(255,255,255,0.18); color: #fff; border: none; border-radius: 100px; padding: 5px 10px; font-size: 12px;">✕</button>
                  </div>
              </div>
          {/if}"""
              if "{#if isSelectMode}" not in ch:
                  ch = ch.replace("{#if pinnedChatMsg}", select_bar + "\n    {#if pinnedChatMsg}", 1)

              # Подсветка выбранных сообщений
              ch = ch.replace(
                  'class:outgoing={msg.IsOutgoing}\n                on:touchstart',
                  'class:outgoing={msg.IsOutgoing}\n                style={selectedMsgIds.includes(msg.ID) ? "background: rgba(59,130,246,0.18); border-radius: 14px;" : ""}\n                on:touchstart'
              )

              # D. Вкладки стикерпаков над сеткой (чиним отступы!)
              old_sticker_grid = """<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 180px; overflow-y: auto;">
                            {#each customStickers as stUrl}"""
              new_sticker_grid = """{#if stickerPacks.length > 0}
                            <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px;">
                                {#each stickerPacks as pack, pIdx}
                                    <button type="button" on:click={() => activeStickerPackIdx = pIdx} style="padding: 4px 10px; border-radius: 100px; border: none; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; background: {activeStickerPackIdx === pIdx ? '#2563EB' : '#28292D'}; color: #fff;">
                                        {pack.title} ({pack.stickers.length})
                                    </button>
                                {/each}
                            </div>
                        {/if}
                        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 180px; overflow-y: auto;">
                            {#each visibleStickers as stUrl}"""
              ch = ch.replace(old_sticker_grid, new_sticker_grid)

              # E. Кнопка камеры (сделать фото) рядом со скрепкой
              cam_btn = """        <label class="btn-icon" title="Сделать фото с камеры" style="padding: 6px; color: #9CA3AF; cursor: pointer;">
                      <span style="font-size: 19px;">📸</span>
                      <input type="file" accept="image/*" capture="environment" style="display: none;" on:change={handleQuickCameraPhoto} />
                  </label>
                  <button type="button" class="btn-icon" on:click={onSelectFiles}"""
              if 'capture="environment"' not in ch:
                  ch = ch.replace('<button type="button" class="btn-icon" on:click={onSelectFiles}', cam_btn, 1)

              # F. Фикс перекрытия кнопки ↓ и крестика ✕ ответа
              ch = ch.replace(
                  'class="btn-scroll-bottom"',
                  'class="btn-scroll-bottom" style="bottom: {replyingTo ? \'145px\' : \'92px\'}; z-index: 35;"'
              )

              # G. Модалка для выделения и цитирования отрывка текста
              quote_modal_html = """
          {#if quoteModalMsg}
              <div style="position: fixed; inset: 0; background: rgba(10,11,16,0.92); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px;">
                  <div style="background: #1A1C20; border: 1px solid rgba(59,130,246,0.35); border-radius: 24px; padding: 20px; width: 100%; max-width: 380px;">
                      <h3 style="margin: 0 0 8px; color: #60A5FA; font-size: 16px;">✂️ Выделите нужный отрывок</h3>
                      <p style="font-size: 12px; color: #9CA3AF; margin: 0 0 10px;">Выделите часть текста пальцем, чтобы скопировать или вставить цитатой:</p>
                      <textarea id="hydra-quote-ta" readonly rows="5" style="width: 100%; padding: 12px; border-radius: 14px; background: #121316; color: #E5E7EB; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; box-sizing: border-box; user-select: text; -webkit-user-select: text;">{quoteModalMsg.Content}</textarea>
                      <div style="display: flex; gap: 8px; margin-top: 12px;">
                          <button type="button" on:click={() => quoteModalMsg = null} style="flex: 1; padding: 10px; border-radius: 100px; background: #28292D; color: #fff; border: none;">Закрыть</button>
                          <button type="button" on:click={() => {
                              const ta = document.getElementById('hydra-quote-ta');
                              const sel = ta ? ta.value.substring(ta.selectionStart, ta.selectionEnd).trim() : '';
                              const textToUse = sel || quoteModalMsg.Content;
                              newMessage = (newMessage ? newMessage + '\\n' : '') + '> ' + textToUse + '\\n';
                              quoteModalMsg = null;
                              if (textarea) textarea.focus();
                          }} style="flex: 1; padding: 10px; border-radius: 100px; background: #1D4ED8; color: #fff; border: none; font-weight: 800;">💬 Вставить цитатой</button>
                      </div>
                  </div>
              </div>
          {/if}
          """
              if "quoteModalMsg" in ch and "hydra-quote-ta" not in ch:
                  ch = ch.replace("<style>", quote_modal_html + "\n<style>", 1)

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 4. Chat.svelte: звук звонка, вкладки стикеров, синий круг, камера, мультивыбор и цитирование готовы!")
          PYEOF
          python3 audit_v310.py
          rm -f audit_v310.py
          gofmt -w mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.1.0 Audit Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.1.0: fix call audio on minimize, sticker pack tabs, persistent read blue dot, camera photo, multi-select, quote snippet & CORS hardening [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.1.0-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
