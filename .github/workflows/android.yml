name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Add Telegram Sticker Pack Import by Link in Chat.svelte
        run: |
          cat << 'PYEOF' > add_tg_stickers_ui.py
          import os, re

          ch_path = "frontend/src/components/Chat.svelte"
          if not os.path.exists(ch_path):
              raise SystemExit("Chat.svelte not found")

          with open(ch_path, "r", encoding="utf-8") as f:
              ch = f.read()

          # 1. Добавляем логику загрузки стикерпака по ссылке с VPS
          tg_sticker_js = """
              let tgStickerUrl = '';
              let isImportingTgStickers = false;
              let tgStickerStatus = '';

              async function importTgStickerPack() {
                  const u = (tgStickerUrl || '').trim();
                  if (!u) return;
                  isImportingTgStickers = true;
                  tgStickerStatus = '⏳ Загрузка пака из Telegram...';
                  try {
                      const resp = await fetch('https://rtbeta.duckdns.org/stickers/tg?url=' + encodeURIComponent(u));
                      const data = await resp.json().catch(() => ({}));
                      if (!resp.ok || !data.stickers || data.stickers.length === 0) {
                          tgStickerStatus = '❌ ' + (data.error || 'Стикерпак не найден');
                          return;
                      }
                      const merged = [...data.stickers, ...customStickers.filter(s => !data.stickers.includes(s))].slice(0, 80);
                      customStickers = merged;
                      try {
                          localStorage.setItem('hydra_stickers_v1', JSON.stringify(customStickers));
                      } catch (storageErr) {
                          customStickers = data.stickers.slice(0, 30);
                          localStorage.setItem('hydra_stickers_v1', JSON.stringify(customStickers));
                      }
                      tgStickerUrl = '';
                      tgStickerStatus = `✅ Загружен «${data.title || 'Пак'}» (+${data.stickers.length} шт.)`;
                  } catch (e) {
                      tgStickerStatus = '❌ Ошибка сети: ' + e;
                  } finally {
                      isImportingTgStickers = false;
                  }
              }
          """

          if "async function importTgStickerPack()" not in ch:
              ch = ch.replace(
                  "async function sendHydraSticker(dataUrl) {",
                  tg_sticker_js + "\n    async function sendHydraSticker(dataUrl) {",
                  1
              )

          # 2. Делаем пузырь стикера прозрачным (как у видео-кружков)
          ch = ch.replace(
              'class:circle-only-bubble={msg.Content && msg.Content.startsWith("[HYDRA_CIRCLE]:")}',
              'class:circle-only-bubble={msg.Content && (msg.Content.startsWith("[HYDRA_CIRCLE]:") || msg.Content.startsWith("[HYDRA_STICKER]:"))}'
          )

          # 3. Рендер стикеров в чате (поддержка и картинок .webp/.png, и видео-стикеров .webm)
          old_render = """{:else if msg.Content && msg.Content.startsWith('[HYDRA_STICKER]:')}
                              <div style="padding: 4px;">
                                  <img src={msg.Content.slice('[HYDRA_STICKER]:'.length)} alt="sticker" style="width: 150px; height: 150px; object-fit: contain; background: transparent;" />
                              </div>"""
          new_render = """{:else if msg.Content && msg.Content.startsWith('[HYDRA_STICKER]:')}
                              <div style="padding: 4px;">
                                  {#if msg.Content.slice('[HYDRA_STICKER]:'.length).startsWith('data:video/')}
                                      <video autoplay loop muted playsinline src={msg.Content.slice('[HYDRA_STICKER]:'.length)} style="width: 150px; height: 150px; object-fit: contain; background: transparent; border-radius: 12px;"></video>
                                  {:else}
                                      <img src={msg.Content.slice('[HYDRA_STICKER]:'.length)} alt="sticker" style="width: 150px; height: 150px; object-fit: contain; background: transparent;" />
                                  {/if}
                              </div>"""
          ch = ch.replace(old_render, new_render)

          # 4. Обновляем вкладку стикеров: поле ввода ссылки t.me/addstickers/... + кнопка + поддержка видео в сетке
          old_grid_block = """                    {:else}
                                  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 180px; overflow-y: auto;">
                                      {#each customStickers as stUrl}
                                          <button type="button" on:click={() => sendHydraSticker(stUrl)} style="background: rgba(255,255,255,0.04); border: none; border-radius: 12px; padding: 4px; cursor: pointer;">
                                              <img src={stUrl} alt="st" style="width: 100%; height: 64px; object-fit: contain;" />
                                          </button>
                                      {/each}
                                  </div>
                              {/if}"""

          new_grid_block = """                    {:else}
                                  <div style="display: flex; gap: 6px; margin-bottom: 8px;">
                                      <input type="text" placeholder="Ссылка t.me/addstickers/..." bind:value={tgStickerUrl} on:keydown={(e) => e.key === 'Enter' && importTgStickerPack()} style="flex: 1; padding: 8px 12px; border-radius: 100px; background: #121316; color: #fff; border: 1px solid rgba(59,130,246,0.35); font-size: 12px; outline: none;" />
                                      <button type="button" disabled={isImportingTgStickers} on:click={importTgStickerPack} style="padding: 8px 14px; border-radius: 100px; background: #1D4ED8; color: #fff; border: none; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap;">
                                          {isImportingTgStickers ? '⏳' : '⬇️ Загрузить'}
                                      </button>
                                  </div>
                                  {#if tgStickerStatus}
                                      <div style="font-size: 11px; color: #93C5FD; margin-bottom: 8px;">{tgStickerStatus}</div>
                                  {/if}
                                  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 180px; overflow-y: auto;">
                                      {#each customStickers as stUrl}
                                          <button type="button" on:click={() => sendHydraSticker(stUrl)} style="background: rgba(255,255,255,0.04); border: none; border-radius: 12px; padding: 4px; cursor: pointer;">
                                              {#if stUrl.startsWith('data:video/')}
                                                  <video autoplay loop muted playsinline src={stUrl} style="width: 100%; height: 64px; object-fit: contain;"></video>
                                              {:else}
                                                  <img src={stUrl} alt="st" style="width: 100%; height: 64px; object-fit: contain;" />
                                              {/if}
                                          </button>
                                      {/each}
                                  </div>
                              {/if}"""

          if "importTgStickerPack" in ch and "t.me/addstickers/..." not in ch:
              ch = re.sub(
                  r'\{:else\}\s*<div style="display: grid; grid-template-columns: repeat\(4, 1fr\);[\s\S]*?\{/each\}\s*</div>\s*\{/if\}',
                  new_grid_block.strip(),
                  ch,
                  count=1
              )

          with open(ch_path, "w", encoding="utf-8") as f:
              f.write(ch)
          print("[OK] Chat.svelte: добавлен импорт стикерпаков Telegram по ссылке и поддержка видео-стикеров!")
          PYEOF
          python3 add_tg_stickers_ui.py
          rm -f add_tg_stickers_ui.py

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Telegram Sticker Pack Import UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Add Telegram sticker pack import by t.me/addstickers/ link & video sticker support [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.0.1-Stickers-APK
          path: android/app/build/outputs/apk/release/*.apk
