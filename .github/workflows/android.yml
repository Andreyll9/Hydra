name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Hydra v3.3.0 (Real Profile Media, In-Chat Search, Creative E2EE Loader, Telegram Attach Sheet)
        run: |
          cat << 'PYEOF' > fix_v330.py
          import os, re

          # 0. Обновляем версию до 3.3.0-hydra
          gr_path = "android/app/build.gradle"
          if os.path.exists(gr_path):
              with open(gr_path, "r", encoding="utf-8") as f:
                  gr = f.read()
              gr = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.3.0-hydra"', gr)
              gr = re.sub(r'versionCode\s+\d+', 'versionCode 330', gr)
              with open(gr_path, "w", encoding="utf-8") as f:
                  f.write(gr)

          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          txt = f.read()
                      if "AppVersion:" in txt:
                          txt = re.sub(r'AppVersion:\s*"[^"]+"', 'AppVersion: "3.3.0-hydra"', txt)
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(txt)

          # 1. App.svelte: передаём {messages}, onPreviewImage и onSaveFile в <Modals>
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()
              if "messages={messages}" not in ap:
                  ap = ap.replace(
                      "contact={selectedContact}",
                      "contact={selectedContact}\n        messages={messages}\n        onPreviewImage={chatHandlers.onPreviewImage}\n        onSaveFile={chatHandlers.onSaveFile}",
                      1
                  )
              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 1. App.svelte: сообщения и обработчики медиа переданы в Modals")

          # 2. Modals.svelte: реальные вкладки Фото и медиа / Файлы / Голосовые
          md_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(md_path):
              with open(md_path, "r", encoding="utf-8") as f:
                  md = f.read()

              if "export let messages =" not in md:
                  md = md.replace(
                      "export let contact = null;",
                      "export let contact = null;\n    export let messages = [];\n    export let onPreviewImage = null;\n    export let onSaveFile = null;",
                      1
                  )

              media_computed_js = """
              $: profileMediaItems = (messages || []).flatMap(m => {
                  const items = [];
                  if (m.Attachments && m.Attachments.length > 0) {
                      for (const att of m.Attachments) {
                          if (att.MimeType && att.MimeType.startsWith('image/')) {
                              const fname = String(att.LocalPath || '').split('/').pop();
                              items.push({ type: 'image', src: '/media/' + fname, path: att.LocalPath, ts: m.Timestamp });
                          }
                      }
                  }
                  const c = String(m.Content || '');
                  if (c.startsWith('[HYDRA_CIRCLE]:')) {
                      items.push({ type: 'circle', src: c.slice('[HYDRA_CIRCLE]:'.length), ts: m.Timestamp });
                  } else if (c.startsWith('[HYDRA_VIDEO]:')) {
                      items.push({ type: 'video', src: c.slice('[HYDRA_VIDEO]:'.length), ts: m.Timestamp });
                  }
                  return items;
              }).reverse();

              $: profileFileItems = (messages || []).flatMap(m => {
                  const items = [];
                  if (m.Attachments && m.Attachments.length > 0) {
                      for (const att of m.Attachments) {
                          if (!att.MimeType || !att.MimeType.startsWith('image/')) {
                              items.push({ name: att.Filename || 'Файл', size: att.Size || 0, path: att.LocalPath, ts: m.Timestamp });
                          }
                      }
                  }
                  return items;
              }).reverse();

              $: profileVoiceItems = (messages || [])
                  .filter(m => String(m.Content || '').startsWith('[HYDRA_VOICE]:'))
                  .map(m => ({ id: m.ID, src: String(m.Content).slice('[HYDRA_VOICE]:'.length), ts: m.Timestamp, outgoing: m.IsOutgoing }))
                  .reverse();
              """
              if "profileMediaItems" not in md:
                  md = md.replace("let profileActiveTab = 'media';", "let profileActiveTab = 'media';\n" + media_computed_js, 1)

              old_placeholder = """    <div style="padding: 16px; text-align: center; color: #6B7280; font-size: 13px;">
                  🔒 Все {profileActiveTab === 'media' ? 'фото и видео-кружки' : (profileActiveTab === 'files' ? 'переданные файлы' : 'голосовые сообщения')} этого чата хранятся в зашифрованном контейнере E2EE.
              </div>"""

              new_tabs_content = """    <div style="padding: 0 16px 32px;">
                  {#if profileActiveTab === 'media'}
                      {#if profileMediaItems.length === 0}
                          <div style="text-align: center; color: #6B7280; font-size: 13px; padding: 24px 0;">Пока нет фото, видео или кружков в этом чате</div>
                      {:else}
                          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
                              {#each profileMediaItems as item}
                                  <div style="aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #1A1C20; position: relative; cursor: pointer;" on:click={() => { if (item.type === 'image' && onPreviewImage) { onCloseContactProfile(); onPreviewImage(item.path); } }}>
                                      {#if item.type === 'image'}
                                          <img src={item.src} alt="media" style="width: 100%; height: 100%; object-fit: cover;" />
                                      {:else}
                                          <video muted playsinline src={item.src} style="width: 100%; height: 100%; object-fit: cover;"></video>
                                          <span style="position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.65); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 8px;">{item.type === 'circle' ? '📹' : '🎬'}</span>
                                      {/if}
                                  </div>
                              {/each}
                          </div>
                      {/if}
                  {:else if profileActiveTab === 'files'}
                      {#if profileFileItems.length === 0}
                          <div style="text-align: center; color: #6B7280; font-size: 13px; padding: 24px 0;">В этом чате пока нет переданных файлов</div>
                      {:else}
                          <div style="display: flex; flex-direction: column; gap: 8px;">
                              {#each profileFileItems as f}
                                  <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; background: #1A1C20; border-radius: 14px;">
                                      <div style="min-width: 0; flex: 1;">
                                          <div style="font-size: 13px; font-weight: 700; color: #E5E7EB; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">📄 {f.name}</div>
                                          <div style="font-size: 11px; color: #9CA3AF; margin-top: 2px;">{f.size ? (f.size / 1024).toFixed(1) + ' КБ' : 'Файл'}</div>
                                      </div>
                                      {#if onSaveFile && f.path}
                                          <button type="button" on:click={() => onSaveFile(f.path, f.name)} style="background: #1D4ED8; color: #fff; border: none; border-radius: 100px; padding: 6px 12px; font-size: 11px; font-weight: 700; cursor: pointer;">⬇️</button>
                                      {/if}
                                  </div>
                              {/each}
                          </div>
                      {/if}
                  {:else}
                      {#if profileVoiceItems.length === 0}
                          <div style="text-align: center; color: #6B7280; font-size: 13px; padding: 24px 0;">В этом чате пока нет голосовых сообщений</div>
                      {:else}
                          <div style="display: flex; flex-direction: column; gap: 8px;">
                              {#each profileVoiceItems as v}
                                  <div style="padding: 10px 12px; background: #1A1C20; border-radius: 14px; display: flex; flex-direction: column; gap: 6px;">
                                      <div style="font-size: 11px; color: #9CA3AF;">🎤 {v.outgoing ? 'Вы' : contact.Nickname} • {new Date(v.ts).toLocaleString().slice(0, 16)}</div>
                                      <audio controls src={v.src} style="width: 100%; height: 34px;"></audio>
                                  </div>
                              {/each}
                          </div>
                      {/if}
                  {/if}
              </div>"""

              if old_placeholder in md:
                  md = md.replace(old_placeholder, new_tabs_content, 1)
              else:
                  md = re.sub(
                      r'<div style="padding: 16px; text-align: center; color: #6B7280; font-size: 13px;">[\s\S]*?контейнере E2EE\.\s*</div>',
                      new_tabs_content.strip(),
                      md,
                      count=1
                  )

              with open(md_path, "w", encoding="utf-8") as f:
                  f.write(md)
              print("[OK] 2. Modals.svelte: вкладки Фото и медиа / Файлы / Голосовые показывают реальные данные")

          # 3. Chat.svelte:
          # - Поиск по сообщениям внутри чата
          # - Уникальный анимированный индикатор отправки медиа (Hydra E2EE Pulse)
          # - Шторка вложений как в Telegram с живым квадратом камеры по нажатию на скрепку
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              new_chat_logic = """
              // === ПОИСК ВНУТРИ ЧАТА ===
              let showChatSearch = false;
              let chatSearchQuery = '';
              let chatSearchMatches = [];
              let chatSearchIdx = 0;

              $: {
                  const q = (chatSearchQuery || '').trim().toLowerCase();
                  if (showChatSearch && q.length > 0) {
                      chatSearchMatches = (messages || [])
                          .filter(m => m.Content && !String(m.Content).startsWith('[HYDRA_') && String(m.Content).toLowerCase().includes(q))
                          .map(m => m.ID)
                          .reverse();
                      if (chatSearchIdx >= chatSearchMatches.length) chatSearchIdx = 0;
                  } else {
                      chatSearchMatches = [];
                      chatSearchIdx = 0;
                  }
              }

              function jumpToSearchMatch(idx) {
                  if (!chatSearchMatches.length) return;
                  chatSearchIdx = (idx + chatSearchMatches.length) % chatSearchMatches.length;
                  const targetId = chatSearchMatches[chatSearchIdx];
                  const el = document.getElementById('msg-' + targetId);
                  if (el) {
                      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                      el.classList.add('highlight-scroll');
                      setTimeout(() => el.classList.remove('highlight-scroll'), 1800);
                  }
              }

              // === ШТОРКА ВЛОЖЕНИЙ (КАК В TELEGRAM) С ЖИВЫМ КВАДРАТОМ КАМЕРЫ ===
              let showAttachSheet = false;
              let attachCamStream = null;
              let attachCamVideoEl = null;
              let isUploadingMedia = false;
              let uploadingLabel = 'Шифрование E2EE...';

              async function openAttachSheet() {
                  showAttachSheet = true;
                  try {
                      attachCamStream = await navigator.mediaDevices.getUserMedia({
                          video: { facingMode: 'environment', width: { ideal: 480 }, height: { ideal: 480 } },
                          audio: false
                      });
                      setTimeout(() => {
                          if (attachCamVideoEl && attachCamStream) {
                              attachCamVideoEl.srcObject = attachCamStream;
                              attachCamVideoEl.play().catch(() => {});
                          }
                      }, 80);
                  } catch (e) {}
              }

              function closeAttachSheet() {
                  if (attachCamStream) {
                      attachCamStream.getTracks().forEach(t => t.stop());
                      attachCamStream = null;
                  }
                  showAttachSheet = false;
              }
              """
              if "let showChatSearch =" not in ch:
                  ch = ch.replace("let showPhotoCamModal = false;", new_chat_logic + "\n    let showPhotoCamModal = false;", 1)

              # Оборачиваем отправку фото с камеры и кружков в креативный индикатор isUploadingMedia
              ch = ch.replace(
                  "const tmpPath = await AppActions.SaveTempImage(dataUrl, 'cam_' + Date.now() + '.jpg');",
                  "isUploadingMedia = true; uploadingLabel = 'Шифрование фото E2EE...';\n                  const tmpPath = await AppActions.SaveTempImage(dataUrl, 'cam_' + Date.now() + '.jpg');"
              )
              ch = ch.replace(
                  "alert('Ошибка отправки фото: ' + e);\n                  }",
                  "alert('Ошибка отправки фото: ' + e);\n                  } finally { isUploadingMedia = false; }"
              )

              # Добавляем кнопку 🔍 в шапку чата рядом с меню ⋮
              if "showChatSearch = !showChatSearch" not in ch:
                  ch = ch.replace(
                      '<div style="position: relative;">\n                <button type="button" on:click|stopPropagation={() => showChatHeaderMenu = !showChatHeaderMenu}',
                      '<button type="button" on:click={() => { showChatSearch = !showChatSearch; chatSearchQuery = ""; }} style="background: {showChatSearch ? \'#1D4ED8\' : \'#22252A\'}; color: #E5E7EB; border: 1px solid rgba(59,130,246,0.25); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; flex-shrink: 0;" title="Поиск в чате">🔍</button>\n            <div style="position: relative;">\n                <button type="button" on:click|stopPropagation={() => showChatHeaderMenu = !showChatHeaderMenu}',
                      1
                  )

              # Панель поиска + креативный индикатор загрузки под шапкой чата
              search_and_loader_ui = """{#if showChatSearch}
              <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: #16181F; border-bottom: 1px solid rgba(59,130,246,0.25); flex-shrink: 0;">
                  <input type="text" placeholder="Поиск по сообщениям..." bind:value={chatSearchQuery} on:keydown={(e) => e.key === 'Enter' && jumpToSearchMatch(chatSearchIdx)} style="flex: 1; padding: 8px 12px; border-radius: 100px; background: #0E1015; color: #fff; border: 1px solid rgba(255,255,255,0.1); font-size: 13px; outline: none;" />
                  {#if chatSearchMatches.length > 0}
                      <span style="font-size: 11px; color: #93C5FD; font-weight: 700; white-space: nowrap;">{chatSearchIdx + 1}/{chatSearchMatches.length}</span>
                      <button type="button" on:click={() => jumpToSearchMatch(chatSearchIdx + 1)} style="background: #22252A; color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 11px;">▲</button>
                      <button type="button" on:click={() => jumpToSearchMatch(chatSearchIdx - 1)} style="background: #22252A; color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 11px;">▼</button>
                  {/if}
                  <button type="button" on:click={() => { showChatSearch = false; chatSearchQuery = ''; }} style="background: transparent; color: #9CA3AF; border: none; font-size: 16px; padding: 4px;">✕</button>
              </div>
          {/if}
          {#if isUploadingMedia}
              <div style="display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: linear-gradient(90deg, rgba(29,78,216,0.22), rgba(16,185,129,0.16)); border-bottom: 1px solid rgba(96,165,250,0.35); flex-shrink: 0;">
                  <div class="hydra-orbit-loader"><span>🔐</span></div>
                  <div style="flex: 1; min-width: 0;">
                      <div style="font-size: 12px; font-weight: 800; color: #93C5FD;">{uploadingLabel}</div>
                      <div class="hydra-crypto-wave"><span></span><span></span><span></span><span></span><span></span></div>
                  </div>
              </div>
          {/if}"""

              if "hydra-orbit-loader" not in ch:
                  ch = ch.replace("{#if activeCallModal && callMinimized}", search_and_loader_ui + "\n{#if activeCallModal && callMinimized}", 1)

              # Убираем отдельную кнопку камеры из инпута и привязываем скрепку к Telegram-шторке
              ch = re.sub(
                  r'<button type="button" class="btn-icon" on:click=\{\(\) => openInAppPhotoCamera\(false\)\}[^>]*>[\s\S]*?</button>',
                  '',
                  ch,
                  count=1
              )
              ch = ch.replace(
                  'on:click={onSelectFiles} title="Прикрепить фото или файл"',
                  'on:click={openAttachSheet} title="Прикрепить фото, камеру или файл"'
              )

              # Добавляем Telegram-шторку вложений и стили креативного лоадера
              attach_sheet_html = """
          {#if showAttachSheet}
              <div on:click={closeAttachSheet} style="position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); z-index: 99990; display: flex; flex-direction: column; justify-content: flex-end;">
                  <div on:click|stopPropagation style="background: #181A20; border-top: 1px solid rgba(59,130,246,0.3); border-radius: 24px 24px 0 0; padding: 14px 16px calc(18px + env(safe-area-inset-bottom, 10px)); box-shadow: 0 -12px 36px rgba(0,0,0,0.6);">
                      <div style="width: 40px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 100px; margin: 0 auto 14px;"></div>
                      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;">
                          <!-- Живой квадрат камеры как в Telegram -->
                          <div on:click={() => { closeAttachSheet(); openInAppPhotoCamera(false); }} style="aspect-ratio: 1; border-radius: 18px; overflow: hidden; background: #0B0D12; border: 2px solid #3B82F6; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                              <video bind:this={attachCamVideoEl} autoplay muted playsinline style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.78;"></video>
                              <div style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; text-shadow: 0 2px 8px rgba(0,0,0,0.9);">
                                  <span style="font-size: 28px;">📸</span>
                                  <span style="font-size: 11px; font-weight: 800; color: #fff;">Камера</span>
                              </div>
                          </div>
                          <!-- Галерея -->
                          <div on:click={() => { closeAttachSheet(); if (onSelectFiles) onSelectFiles(); }} style="aspect-ratio: 1; border-radius: 18px; background: linear-gradient(135deg, #1E3A8A, #2563EB); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
                              <span style="font-size: 28px;">🖼️</span>
                              <span style="font-size: 12px; font-weight: 800; color: #fff;">Галерея</span>
                          </div>
                          <!-- Файлы -->
                          <div on:click={() => { closeAttachSheet(); if (onSelectFiles) onSelectFiles(); }} style="aspect-ratio: 1; border-radius: 18px; background: linear-gradient(135deg, #065F46, #059669); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; cursor: pointer;">
                              <span style="font-size: 28px;">📄</span>
                              <span style="font-size: 12px; font-weight: 800; color: #fff;">Файлы</span>
                          </div>
                      </div>
                  </div>
              </div>
          {/if}
          """
              loader_css = """
              .hydra-orbit-loader {
                  width: 34px; height: 34px; border-radius: 50%;
                  border: 2.5px solid rgba(59,130,246,0.2);
                  border-top-color: #60A5FA; border-right-color: #34D399;
                  display: flex; align-items: center; justify-content: center;
                  font-size: 14px; animation: hydraOrbitSpin 1.1s linear infinite;
                  flex-shrink: 0;
              }
              .hydra-orbit-loader span { animation: hydraOrbitSpin 1.1s linear infinite reverse; }
              @keyframes hydraOrbitSpin { to { transform: rotate(360deg); } }
              .hydra-crypto-wave { display: flex; gap: 4px; margin-top: 5px; height: 8px; align-items: center; }
              .hydra-crypto-wave span {
                  width: 14px; height: 4px; border-radius: 4px; background: #60A5FA;
                  animation: hydraWavePulse 1.2s ease-in-out infinite;
              }
              .hydra-crypto-wave span:nth-child(2) { animation-delay: 0.15s; background: #3B82F6; }
              .hydra-crypto-wave span:nth-child(3) { animation-delay: 0.3s; background: #34D399; }
              .hydra-crypto-wave span:nth-child(4) { animation-delay: 0.45s; background: #3B82F6; }
              .hydra-crypto-wave span:nth-child(5) { animation-delay: 0.6s; background: #60A5FA; }
              @keyframes hydraWavePulse { 0%, 100% { transform: scaleY(0.6); opacity: 0.4; } 50% { transform: scaleY(1.8); opacity: 1; } }
          """

              if "showAttachSheet" in ch and "hydra-orbit-loader" in ch:
                  ch = ch.replace("<style>", attach_sheet_html + "\n<style>\n" + loader_css, 1)

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 3. Chat.svelte: поиск по чату, Hydra E2EE Pulse и шторка вложений с живой камерой готовы!")
          PYEOF
          python3 fix_v330.py
          rm -f fix_v330.py

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.3.0 Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.3.0: real profile media/files/voice tabs, in-chat search, Hydra E2EE Pulse loader & Telegram attach sheet with live camera tile [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.3.0-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
