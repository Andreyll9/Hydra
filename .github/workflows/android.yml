                      {/if}
                  </div>
              </div>
          {/if}
          """
              if "showNearbyWifiModal" not in sb.split("</script>")[-1]:
                  sb = sb.replace("<style>", nearby_modal_html + "\n<style>", 1)

              with open(sb_path, "w", encoding="utf-8") as f:
                  f.write(sb)
              print("[OK] 5. Sidebar.svelte: добавлен Wi-Fi радар '📡 Люди рядом' (строго по Wi-Fi, показывает только ник)")

          # 6. frontend/src/components/Chat.svelte:
          #    - Добавляем меню "3 точки (⋮)" в шапку чата: 🧹 Очистить чат, 👥 Настройки Группы/Канала (если это группа/канал), 🗑️ Удалить чат!
          #    - Добавляем кнопку "📥 В Галерею" для сохранения фото и видео-кружков в память телефона!
          #    - Добавляем умный статус "Был(а) в сети": точное время ИЛИ "Был(а) недавно (за последние 24ч по разблокировке)", если время скрыто в Приватности!
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
