name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Hydra v3.4.1 Hardening (Anti-Tamper, R8, WebView Lock & Clean Legacy URLs)
        run: |
          cat << 'PYEOF' > harden_v341.py
          import os, re, subprocess

          # 0. Обновляем версию до 3.4.1-hydra
          gr_path = "android/app/build.gradle"
          store_pass = ""
          if os.path.exists(gr_path):
              with open(gr_path, "r", encoding="utf-8") as f:
                  gr = f.read()
              gr = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.4.1-hydra"', gr)
              gr = re.sub(r'versionCode\s+\d+', 'versionCode 341', gr)

              # Достаём пароль keystore для извлечения SHA-256
              m_pass = re.search(r'storePassword\s+["\']([^"\']+)["\']', gr)
              if m_pass:
                  store_pass = m_pass.group(1)

              # Включаем R8 обфускацию и сжатие ресурсов в release
              if "minifyEnabled false" in gr:
                  gr = gr.replace("minifyEnabled false", "minifyEnabled true\n            shrinkResources true")
              elif "minifyEnabled true" not in gr:
                  gr = re.sub(
                      r'(release\s*\{)',
                      r'\1\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
                      gr,
                      count=1
                  )
              with open(gr_path, "w", encoding="utf-8") as f:
                  f.write(gr)
              print("[OK] 0. build.gradle: версия 3.4.1-hydra и R8 (minifyEnabled + shrinkResources) включены")

          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          txt = f.read()
                      if "AppVersion:" in txt:
                          txt = re.sub(r'AppVersion:\s*"[^"]+"', 'AppVersion: "3.4.1-hydra"', txt)
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(txt)

          # 1. Извлекаем SHA-256 подписи из hydra-release-key.jks
          cert_sha256 = ""
          jks_path = "android/app/hydra-release-key.jks"
          if os.path.exists(jks_path) and store_pass:
              try:
                  out = subprocess.check_output(
                      ["keytool", "-list", "-v", "-keystore", jks_path, "-storepass", store_pass],
                      stderr=subprocess.STDOUT, text=True
                  )
                  m_sha = re.search(r'SHA256:\s*([0-9A-Fa-f:]+)', out)
                  if m_sha:
                      cert_sha256 = m_sha.group(1).replace(":", "").upper()
                      print(f"[OK] 1. Извлечён SHA-256 сертификата: {cert_sha256[:12]}...")
              except Exception as e:
                  print(f"[WARN] Не удалось извлечь SHA-256 из keystore: {e}")

          # 2. Создаём/обновляем proguard-rules.pro для R8 (чтобы не сломать JNI Go и JS Bridge)
          pg_path = "android/app/proguard-rules.pro"
          pg_rules = """# Hydra R8 / ProGuard Rules
          -keep class mobile.** { *; }
          -keep class go.** { *; }
          -keep class com.teleghost.app.MainActivity$HydraNativeBridge { *; }
          -keep class com.teleghost.app.TeleGhostService { *; }
          -keep class com.teleghost.app.DirectReplyReceiver { *; }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes *Annotation*,JavascriptInterface
          -dontwarn mobile.**
          -dontwarn go.**
          """
          with open(pg_path, "w", encoding="utf-8") as f:
              f.write(pg_rules)
          print("[OK] 2. proguard-rules.pro обновлён")

          # 3. MainActivity.kt: проверка подписи APK (Anti-Tamper) + запрет отладки WebView
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              if "WebView.setWebContentsDebuggingEnabled(false)" not in kt:
                  kt = kt.replace(
                      "private fun setupWebView() {",
                      "private fun setupWebView() {\n        WebView.setWebContentsDebuggingEnabled(false)",
                      1
                  )

              if cert_sha256 and "private fun verifyApkSignature()" not in kt:
                  verify_fn = f"""    private fun verifyApkSignature(): Boolean {{
                  return try {{
                      val expected = "{cert_sha256}"
                      val sigs = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {{
                          val pi = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNING_CERTIFICATES)
                          pi.signingInfo?.apkContentsSigners ?: emptyArray()
                      }} else {{
                          @Suppress("DEPRECATION")
                          val pi = packageManager.getPackageInfo(packageName, PackageManager.GET_SIGNATURES)
                          @Suppress("DEPRECATION")
                          pi.signatures ?: emptyArray()
                      }}
                      val md = java.security.MessageDigest.getInstance("SHA-256")
                      sigs.any {{ sig ->
                          val hash = md.digest(sig.toByteArray()).joinToString("") {{ "%02X".format(it) }}
                          hash.equals(expected, ignoreCase = true)
                      }}
                  }} catch (_: Exception) {{
                      true
                  }}
              }}

              override fun onCreate("""
                  kt = kt.replace("override fun onCreate(", verify_fn, 1)
                  kt = kt.replace(
                      "super.onCreate(savedInstanceState)\n        currentInstance = this",
                      "super.onCreate(savedInstanceState)\n        if (!verifyApkSignature()) { finishAffinity(); return }\n        currentInstance = this",
                      1
                  )
                  print("[OK] 3. MainActivity.kt: Anti-Tamper проверка подписи и запрет отладки WebView добавлены")

              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)

          # 4. Чистка старых URL и голого IP из Go-кода (191.223.137.164:8085, ya.ru, 127.0.0.1:7070/7657)
          cleaned_files = 0
          for root, _, files in os.walk("internal"):
              for fn in files:
                  if not fn.endswith(".go"):
                      continue
                  fp = os.path.join(root, fn)
                  with open(fp, "r", encoding="utf-8") as f:
                      txt = f.read()
                  orig = txt
                  txt = txt.replace("http://191.223.137.164:8085", "https://rtbeta.duckdns.org")
                  txt = txt.replace("191.223.137.164:8085", "rtbeta.duckdns.org")
                  txt = txt.replace("https://ya.ru", "https://rtbeta.duckdns.org/health")
                  txt = txt.replace("http://127.0.0.1:7070", "http://127.0.0.1:8080")
                  txt = txt.replace("http://127.0.0.1:7657", "http://127.0.0.1:8080")
                  if txt != orig:
                      with open(fp, "w", encoding="utf-8") as f:
                          f.write(txt)
                      cleaned_files += 1
          print(f"[OK] 4. Очищены старые URL/IP в Go-файлах: {cleaned_files}")
          PYEOF
          python3 harden_v341.py
          rm -f harden_v341.py
          gofmt -w internal/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.4.1 Hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.4.1: anti-tamper signature check, R8 obfuscation, strip Go symbols, disable WebView debug & clean legacy URLs [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR (Stripped)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -ldflags="-s -w" -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.4.1-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
