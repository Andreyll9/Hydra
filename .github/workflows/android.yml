              </div>
          {/if}
          """
              if "showRoomSettingsModal" not in ch.split("</script>")[-1]:
                  ch = ch.replace("<style>", room_modal_html + "\n<style>", 1)

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 6. Chat.svelte: добавлено меню 3 точки (Очистить/Удалить/Настройки группы), статус присутствия 24ч и сохранение медиа в Галерею")

          # 7. frontend/src/components/Settings.svelte:
          #    - Убираем обёртку {#if selectedProfile} вокруг настроек Приватности (чтобы они НЕ пропадали при входе через Seed-ключ!)
          #    - Добавляем в Приватность тумблеры:
          #      1) "🕒 Скрывать точное время визита (показывать только 'Был(а) за последние 24ч')"
          #      2) "📡 Скрывать меня в радаре 'Люди рядом' по Wi-Fi"
          #    - Чиним разъехавшуюся кнопку "Скопировать ключ" на скриншоте 3 (делаем вертикальную колонку в destination-box)
          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()

              privacy_extra_js = """
              let hideLastSeenEnabled = localStorage.getItem('hydra_hide_last_seen') === '1';
              let hideNearbyWifiEnabled = localStorage.getItem('hydra_hide_nearby_wifi') === '1';

              function toggleHideLastSeen() {
                  hideLastSeenEnabled = !hideLastSeenEnabled;
                  localStorage.setItem('hydra_hide_last_seen', hideLastSeenEnabled ? '1' : '0');
              }
              function toggleHideNearbyWifi() {
                  hideNearbyWifiEnabled = !hideNearbyWifiEnabled;
                  localStorage.setItem('hydra_hide_nearby_wifi', hideNearbyWifiEnabled ? '1' : '0');
              }
              """
              if "let hideLastSeenEnabled =" not in st:
                  st = st.replace("let anonStoriesEnabled =", privacy_extra_js + "\n    let anonStoriesEnabled =", 1)

              # Делаем так, чтобы в Приватности блок настроек рендерился ВСЕГДА (даже если вход выполнен через Seed-фразу!), заменяя {#if selectedProfile} на {#if true}
              st = st.replace("{#if selectedProfile}", "{#if true}")
              st = st.replace("{#if selectedProfile.use_pin}", "{#if true}")
              st = st.replace("selectedProfile.use_pin", "selectedProfile?.use_pin")

              # Добавляем 2 новых тумблера Приватности (Скрытие точного времени входа и Скрытие в Люди рядом по Wi-Fi)
              extra_privacy_cards = """
                  <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">🕒 Скрывать точное время входа</div>
                              <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">Показывать собеседникам только статус «Был(а) за последние 24ч» (подтверждается разблокировкой приложения)</div>
                          </div>
                          <input type="checkbox" checked={hideLastSeenEnabled} on:change={toggleHideLastSeen} style="width: 22px; height: 22px; accent-color: #1D4ED8; flex-shrink: 0;" />
                      </div>
                  </div>

                  <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">📡 Невидимка в «Люди рядом» (Wi-Fi)</div>
                              <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">Запретить другим пользователям видеть ваш @ник в локальной сети Wi-Fi</div>
                          </div>
                          <input type="checkbox" checked={hideNearbyWifiEnabled} on:change={toggleHideNearbyWifi} style="width: 22px; height: 22px; accent-color: #1D4ED8; flex-shrink: 0;" />
                      </div>
                  </div>
              """
              if "Скрывать точное время входа" not in st:
                  st = st.replace("🕵️ Анонимный просмотр историй (24ч)", extra_privacy_cards + "\n                🕵️ Анонимный просмотр историй (24ч)", 1)

              # Чиним разъехавшуюся кнопку "Скопировать ключ" на скриншоте 3 (делаем flex-direction: column в .destination-box)
              st = st.replace(
                  '.destination-box { \n        display: flex; align-items: flex-start; gap: 10px; padding: 20px;',
                  '.destination-box { \n        display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding: 16px;'
              )

              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] 7. Settings.svelte: Приватность больше не пропадает при Seed-входе, добавлены тумблеры 24ч и Wi-Fi, выровнена кнопка копирования ключа")
          PYEOF
          python3 apply_stage5_master.py
          rm -f apply_stage5_master.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Stage 5 Master Upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix Seed privacy view, Favorites black screen, unified Crypto ID, real Groups/Channels, Wi-Fi Nearby radar, 3-dots chat menu & Hydra icons [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
