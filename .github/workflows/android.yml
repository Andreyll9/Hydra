          circle_blue_svg = '''<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.2"/></svg>'''

