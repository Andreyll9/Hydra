name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Exact Fixes for App.svelte, Settings.svelte, index.html & appcore.go
        run: |
          cat << 'PYEOF' > exact_5files_fix.py
          import os

          # 1. frontend/src/App.svelte:
          #    - Чиним блокировку при сворачивании: переключаем реальную переменную screen = 'login'!
          #    - При разворачивании приложения на экране входа автоматически вызываем проверку отпечатка пальца и убираем блюр только после входа!
          #    - В мобильной ветке <Settings> добавляем bind:profileNickname, bind:profileBio, bind:profileAvatar!
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              old_lock_block = """    if (typeof window !== 'undefined') {
                  window.__lockHydraNow = () => {
                      if (typeof isLoggedIn !== 'undefined' && isLoggedIn) {
                          isLoggedIn = false;
                          showSettings = false;
                          if (window.__addHydraLog) window.__addHydraLog('SECURITY-LOCK', '🔒 Приложение свёрнуто — сессия мгновенно заблокирована!');
                      }
                  };
                  document.addEventListener('visibilitychange', () => {
                      if (document.visibilityState === 'hidden') {
                          window.__lockHydraNow();
                      }
                  });
              }"""

              new_lock_block = """    if (typeof window !== 'undefined') {
                  window.__lockHydraNow = () => {
                      if (screen === 'main') {
                          screen = 'login';
                          showSettings = false;
                          if (window.__setHydraBlur) window.__setHydraBlur(true);
                          if (window.__addHydraLog) window.__addHydraLog('SECURITY-LOCK', '🔒 Приложение свёрнуто — включён экран блокировки и матовый фильтр!');
                      }
                  };
              }"""

              ap = ap.replace(old_lock_block, new_lock_block)

              # Когда пользователь успешно вошёл (onLoginSuccess), снимаем матовый блюр!
              ap = ap.replace(
                  "screen = 'main';",
                  "screen = 'main';\n          if (typeof window !== 'undefined' && window.__setHydraBlur) window.__setHydraBlur(false);"
              )

              # Чиним отсутствие bind: на мобильном экране настроек!
              ap = ap.replace(
                  "<Settings \n                            {profileNickname} {profileBio} {profileAvatar} {routerSettings}",
                  "<Settings \n                            bind:profileNickname={profileNickname} bind:profileBio={profileBio} bind:profileAvatar={profileAvatar} {routerSettings}"
              )

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 1. App.svelte: блокировка теперь переключает screen = 'login', добавлен bind: для мобильных настроек")

          # 2. frontend/index.html:
          #    Убираем авто-снятие блюра через 350 мс при возврате? Нет: когда приложение сворачивается (hidden) — включаем плотный матовый блюр поверх всего,
          #    а когда разворачивается (visible) — так как App.svelte уже переключил screen = 'login', снимаем верхний слой #hydra-blur-curtain,
          #    чтобы пользователь увидел окно ввода ПИН-кода / сканера отпечатка пальца (а сами чаты уже закрыты экраном входа)!
          idx_path = "frontend/index.html"
          if os.path.exists(idx_path):
              with open(idx_path, "r", encoding="utf-8") as f:
                  ih = f.read()

              ih = ih.replace(
                  """    document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                  window.__setHydraBlur(true);
                } else {
                  setTimeout(function() { window.__setHydraBlur(false); }, 350);
                }
              });""",
                  """    document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'hidden') {
                  if (window.__lockHydraNow) window.__lockHydraNow();
                  window.__setHydraBlur(true);
                } else {
                  setTimeout(function() {
                    window.__setHydraBlur(false);
                    if (window.__onHydraAppResume) window.__onHydraAppResume();
                  }, 250);
                }
              });"""
              )
              with open(idx_path, "w", encoding="utf-8") as f:
                  f.write(ih)
              print("[OK] 2. index.html: при сворачивании мгновенно включается блюр и блокируется сессия до ввода отпечатка/ПИН")

          # 3. frontend/src/components/Settings.svelte:
          #    - Чиним ВСЕ 4 неопределённые переменные во вкладке 'network' (isMobile, identity -> myDestination, onCopyDestination, isCheckingPing -> isPingingServer)!
          #    - Вешаем on:click={handleLicenseTap} прямо на карточку "Лицензия" во вкладке 'about' и добавляем кнопку открытия Меню разработчика!
          #    - Улучшаем проверку и закрепление @ника (сначала проверяем через быстрый /nick/resolve, затем сохраняем)!
          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()

              # 3.1. Заменяем неопределённые переменные во вкладке 'network', из-за которых она не открывалась!
              st = st.replace("{#if !isMobile}", "{#if false}")
              st = st.replace("<p class=\"dest-text\">{identity}</p>", "<p class=\"dest-text\">{myDestination}</p>")
              st = st.replace(
                  '<button type="button" class="btn-small btn-primary" on:click={onCopyDestination}>Скопировать ключ</button>',
                  '<button type="button" class="btn-small btn-primary" on:click={() => { AppActions.CopyToClipboard(myDestination); alert("✅ Ключ скопирован"); }}>Скопировать ключ</button>'
              )
              st = st.replace("disabled={isCheckingPing}", "disabled={isPingingServer}")
              st = st.replace("{isCheckingPing ? '⏳ Проверка связи...' : '⚡ Проверить соединение с сервером'}", "{isPingingServer ? '⏳ Проверка связи...' : '⚡ Проверить соединение с сервером'}")

              # 3.2. Делаем verifyHydraConnection быстрым и надёжным через прямой HTTP-запрос к VPS (плюс резервный GetAppAboutInfo)
              old_verify = """    let pingStatusText = '';
              let isPingingServer = false;
              async function verifyHydraConnection() {
                  isPingingServer = true;
                  pingStatusText = '⏳ Проверка канала через ядро Go...';
                  try {
                      const info = await AppActions.GetAppAboutInfo();
                      if (info && info.i2p_version && info.i2p_version.includes('✅')) {
                          pingStatusText = info.i2p_version;
                      } else {
                          pingStatusText = '❌ VPS 191.223.137.164:8085 не откликнулся. Проверьте на VPS: ufw allow 8085/tcp';
                      }
                  } catch (e) {
                      pingStatusText = '❌ Ошибка проверки сокета: ' + String(e);
                  } finally {
                      isPingingServer = false;
                  }
              }"""

              new_verify = """    let pingStatusText = '';
              let isPingingServer = false;
              async function verifyHydraConnection() {
                  isPingingServer = true;
                  pingStatusText = '⏳ Пинг сервера 191.223.137.164:8085...';
                  const t0 = Date.now();
                  try {
                      const r = await fetch('http://191.223.137.164:8085/health?pub=' + encodeURIComponent(myDestination || 'ping'), { cache: 'no-store' });
                      const d = await r.json();
                      const rtt = Date.now() - t0;
                      if (d && d.status === 'ok') {
                          pingStatusText = `✅ Канал E2EE активен! Отклик: ${rtt} мс (онлайн: ${d.online_peers ?? 1})`;
                          return;
                      }
                  } catch (e) {}
                  try {
                      const info = await AppActions.GetAppAboutInfo();
                      if (info && info.i2p_version) {
                          pingStatusText = info.i2p_version;
                      } else {
                          pingStatusText = '❌ Узел 191.223.137.164:8085 не ответил';
                      }
                  } catch (e) {
                      pingStatusText = '❌ Ошибка проверки: ' + String(e);
                  } finally {
                      isPingingServer = false;
                  }
              }"""
              st = st.replace(old_verify, new_verify)

              # 3.3. Вешаем on:click={handleLicenseTap} прямо на блок Лицензии в разделе "О программе" (строки 477-483 Settings.svelte)
              old_lic_html = """                            <div class="info-item-fancy">
                                          <div class="info-icon">{@html Icons.File}</div>
                                          <div class="info-content">
                                              <span class="info-label-fancy">Лицензия</span>
                                              <span class="info-value-fancy">{aboutInfo.license || 'MIT / Open Source'}</span>
                                          </div>
                                      </div>"""

              new_lic_html = """                            <div class="info-item-fancy" role="button" tabindex="0" on:click={handleLicenseTap} on:keydown={(e) => e.key === 'Enter' && handleLicenseTap()} style="cursor: pointer; user-select: none; border: 1px solid rgba(138,180,248,0.25);">
                                          <div class="info-icon">{@html Icons.File}</div>
                                          <div class="info-content">
                                              <span class="info-label-fancy">Лицензия {licenseTapCount > 0 ? `(ещё ${6 - licenseTapCount} наж. до меню разработчика)` : ''}</span>
                                              <span class="info-value-fancy">{aboutInfo.license || 'MIT / Open Source'}</span>
                                          </div>
                                      </div>

                                      {#if devMenuUnlocked}
                                          <div class="update-action-row" role="button" tabindex="0" on:click={() => { refreshSettingsLogs(); refreshLanWifiInfo(); showSecretDevModal = true; }} on:keydown={(e) => e.key === 'Enter' && (showSecretDevModal = true)} style="background: rgba(138,180,248,0.14); border: 1.5px solid #8AB4F8;">
                                              <div class="info-icon accent">🛠️</div>
                                              <div class="info-content">
                                                  <span class="info-value-fancy accent">Меню разработчика (Логи и Тест потоков)</span>
                                              </div>
                                              <div class="chevron">{@html Icons.ChevronRight}</div>
                                          </div>
                                      {/if}"""

              st = st.replace(old_lic_html, new_lic_html)

              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] 3. Settings.svelte: вкладка 'Сеть и Сервер' и 6 нажатий на 'Лицензия' полностью исправлены!")

          # 4. internal/appcore/appcore.go:
          #    Чиним UpdateMyProfile:
          #    - Сначала проверяем через GET /nick/resolve: если этот ник УЖЕ принадлежит нашему ключу pub, не требуем повторной регистрации!
          #    - Увеличиваем таймаут HTTP-клиента до 12 секунд и если VPS временно не ответил — не блокируем сохранение локального профиля в SQLite!
          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              old_nick_go = """	if strings.TrimSpace(nickname) != "" && a.Identity != nil && a.Identity.Keys != nil {
          		cleanNick := strings.ToLower(strings.TrimPrefix(strings.TrimSpace(nickname), "@"))
          		pub := a.Identity.Keys.PublicKeyBase64
          		router.SetGlobalPrivateKey(a.Identity.Keys.SigningPrivateKey)
          		sig := ed25519.Sign(a.Identity.Keys.SigningPrivateKey, []byte("HYDRA-NICK:"+cleanNick+":"+pub))
          		reqBody, _ := json.Marshal(map[string]string{
          			"nickname":  cleanNick,
          			"pub_key":   pub,
          			"signature": base64.StdEncoding.EncodeToString(sig),
          		})
          		client := &http.Client{Timeout: 6 * time.Second}
          		resp, err := client.Post("http://191.223.137.164:8085/nick/register", "application/json", bytes.NewReader(reqBody))
          		if err != nil {
          			return fmt.Errorf("нет связи с сервером никнеймов (191.223.137.164:8085): %v", err)
          		}
          		bodyBytes, _ := io.ReadAll(resp.Body)
          		resp.Body.Close()
          		if resp.StatusCode == http.StatusConflict {
          			return fmt.Errorf("никнейм @%s уже занят другим аккаунтом (ответ VPS: %s)", cleanNick, strings.TrimSpace(string(bodyBytes)))
          		}
          		if resp.StatusCode != http.StatusOK {
          			return fmt.Errorf("сервер отклонил никнейм @%s (код %d: %s)", cleanNick, resp.StatusCode, strings.TrimSpace(string(bodyBytes)))
          		}
          	}"""

              new_nick_go = """	if strings.TrimSpace(nickname) != "" && a.Identity != nil && a.Identity.Keys != nil {
          		cleanNick := strings.ToLower(strings.TrimPrefix(strings.TrimSpace(nickname), "@"))
          		pub := a.Identity.Keys.PublicKeyBase64
          		router.SetGlobalPrivateKey(a.Identity.Keys.SigningPrivateKey)
          		sig := ed25519.Sign(a.Identity.Keys.SigningPrivateKey, []byte("HYDRA-NICK:"+cleanNick+":"+pub))
          		reqBody, _ := json.Marshal(map[string]string{
          			"nickname":  cleanNick,
          			"pub_key":   pub,
          			"signature": base64.StdEncoding.EncodeToString(sig),
          		})
          		client := &http.Client{Timeout: 12 * time.Second}
          		resp, err := client.Post("http://191.223.137.164:8085/nick/register", "application/json", bytes.NewReader(reqBody))
          		if err != nil {
          			log.Printf("[AppCore] Warning: nickname server unreachable (%v), saving locally", err)
          		} else {
          			bodyBytes, _ := io.ReadAll(resp.Body)
          			resp.Body.Close()
          			if resp.StatusCode == http.StatusConflict {
          				// Проверяем, не принадлежит ли этот ник уже нашему собственному ключу
          				chkResp, chkErr := client.Get("http://191.223.137.164:8085/nick/resolve?nick=" + cleanNick)
          				alreadyOurs := false
          				if chkErr == nil && chkResp != nil {
          					var resolved map[string]string
          					_ = json.NewDecoder(chkResp.Body).Decode(&resolved)
          					chkResp.Body.Close()
          					if resolved["pub_key"] == pub {
          						alreadyOurs = true
          					}
          				}
          				if !alreadyOurs {
          					return fmt.Errorf("никнейм @%s уже закреплён за другим пользователем", cleanNick)
          				}
          			} else if resp.StatusCode != http.StatusOK {
          				return fmt.Errorf("сервер отклонил никнейм @%s (код %d: %s)", cleanNick, resp.StatusCode, strings.TrimSpace(string(bodyBytes)))
          			}
          		}
          	}"""

              ac = ac.replace(old_nick_go, new_nick_go)
              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] 4. appcore.go: служба никнеймов теперь распознаёт собственный ник и не рвёт сохранение при таймауте")
          PYEOF
          python3 exact_5files_fix.py
          rm -f exact_5files_fix.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Exact Fixes to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix Settings network tab undefined vars, 6-tap License Dev Menu, screen='login' lock on pause & nickname resolve [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
