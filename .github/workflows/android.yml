name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix MainActivity.kt handleCallNotificationAction Reference & Verify v2.7.0 Build
        run: |
          cat << 'PYEOF' > fix_kotlin_ref.py
          import os, shutil

          # 0. Гарантируем, что фирменная иконка щита Гидры (logo.png) на месте
          real_hydra_logo = "frontend/src/assets/images/logo.png"
          if os.path.exists(real_hydra_logo):
              for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = f"android/app/src/main/res/{mip}/{fname}"
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copyfile(real_hydra_logo, dst)

          # 1. Чиним Unresolved reference 'handleCallNotificationAction' в MainActivity.kt!
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              # Если currentInstance уже есть, но handleCallNotificationAction ещё не добавлена в companion object — добавляем её!
              if "fun handleCallNotificationAction(" not in kt:
                  if "fun handleDirectReplyFromNotification(" in kt:
                      kt = kt.replace(
                          "fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {",
                          """fun handleCallNotificationAction(senderNick: String, action: String) {
              currentInstance?.runOnUiThread {
                  val sNick = JSONObject.quote(senderNick)
                  val sAct = JSONObject.quote(action)
                  currentInstance?.webView?.evaluateJavascript(
                      "if(window.__onHydraCallNotifAction) window.__onHydraCallNotifAction($sNick, $sAct);",
                      null
                  )
              }
          }
          fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {"""
                      )
                  else:
                      kt = kt.replace(
                          'private const val PREFS_NAME = "hydra_biometric_prefs"',
                          '''private const val PREFS_NAME = "hydra_biometric_prefs"
          var currentInstance: MainActivity? = null
          fun handleCallNotificationAction(senderNick: String, action: String) {
              currentInstance?.runOnUiThread {
                  val sNick = JSONObject.quote(senderNick)
                  val sAct = JSONObject.quote(action)
                  currentInstance?.webView?.evaluateJavascript(
                      "if(window.__onHydraCallNotifAction) window.__onHydraCallNotifAction($sNick, $sAct);",
                      null
                  )
              }
          }
          fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {
              currentInstance?.runOnUiThread {
                  val sNick = JSONObject.quote(senderNick)
                  val sText = JSONObject.quote(replyText)
                  currentInstance?.webView?.evaluateJavascript(
                      "if(window.__onHydraDirectReply) window.__onHydraDirectReply($sNick, $sText);",
                      null
                  )
              }
          }'''
                      )

              if "fun setScreenshotProtection(" not in kt:
                  kt = kt.replace(
                      "inner class HydraNativeBridge {",
                      """inner class HydraNativeBridge {
          @JavascriptInterface
          fun setScreenshotProtection(enabled: Boolean) {
              runOnUiThread {
                  if (enabled) {
                      window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  }
              }
          }"""
                  )

              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] MainActivity.kt: функция handleCallNotificationAction успешно добавлена в companion object!")
          PYEOF
          python3 fix_kotlin_ref.py
          rm -f fix_kotlin_ref.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit MainActivity Kotlin Fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix handleCallNotificationAction in MainActivity.kt companion object for v2.7.0 [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
