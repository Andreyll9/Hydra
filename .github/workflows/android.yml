name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Complete Stage 5 & UX Polish (Real WebRTC Calls, 30s Lock & View Persistence, Direct Reply Notifications, Android 9 Scroll/Storage Fix, Story Blur & Circle Zoom)
        run: |
          cat << 'PYEOF' > apply_complete_upgrade.py
          import os, re, shutil

          # 0. Устанавливаем оригинальную иконку щита Гидры (logo.png) во все папки Android и фронтенда
          real_hydra_logo = "frontend/src/assets/images/logo.png"
          if os.path.exists(real_hydra_logo):
              for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = f"android/app/src/main/res/{mip}/{fname}"
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copyfile(real_hydra_logo, dst)
              shutil.copyfile(real_hydra_logo, "frontend/public/icon.png")
              shutil.copyfile(real_hydra_logo, "icon.png")

          # 1. frontend/src/utils.js:
          #    - Чиним getInitials(name): убираем эмодзи (👥, 📢 и др.) и режем по полноценным Unicode-символам Array.from(), чтобы не было значка ' П' в русских названиях групп!
          #    - Убираем все фиолетовые градиенты аватарок (#8b5cf6, #a855f7, #ec4899) и ставим благородные тёмно-синие/морские оттенки!
          #    - Добавляем универсальную функцию formatPreviewText(text) для красивого отображения кружков, голосовых, видео и звонков вместо шифра Base64!
          utils_js = '''export function getInitials(name) {
              if (!name) return 'H';
              const clean = String(name)
                  .replace(/[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{FE00}-\\u{FE0F}]/gu, '')
                  .replace(/^[@+#\\s]+/, '')
                  .trim();
              if (!clean) return '👥';
              const words = clean.split(/\\s+/).filter(Boolean);
              if (words.length >= 2) {
                  return (Array.from(words[0])[0] + Array.from(words[1])[0]).toUpperCase();
              }
              return Array.from(clean).slice(0, 2).join('').toUpperCase();
          }

          export function formatPreviewText(raw) {
              if (!raw) return 'Нет сообщений';
              const s = String(raw).trim();
              if (s.startsWith('[HYDRA_VOICE]:')) return '🎤 Голосовое сообщение';
              if (s.startsWith('[HYDRA_CIRCLE]:')) return '📹 Видео-кружок';
              if (s.startsWith('[HYDRA_VIDEO]:')) return '🎬 Видеоролик';
              if (s.startsWith('[HYDRA_GROUP_INVITE]:') || s.startsWith('SFlEUkFfUk9PTV')) return '🎟️ Приглашение в группу/канал';
              if (s.startsWith('[HYDRA_CALL_RING]:')) return '📞 Входящий вызов...';
              if (s.startsWith('[HYDRA_CALL_ANSWER]:')) return '🟢 Вызов принят';
              if (s.startsWith('[HYDRA_CALL_END]:')) return '☎️ Вызов завершён';
              if (s.startsWith('[HYDRA_CALL_MISSED]:')) return '☎️ Пропущенный звонок';
              if (s.startsWith('[HYDRA_CALL_ICE]:')) return '🔄 Установка соединения...';
              return s;
          }

          export function getAvatarGradient(name) {
              if (!name) return 'linear-gradient(135deg, #1E3A8A, #1D4ED8)';
              let hash = 0;
              for (let i = 0; i < name.length; i++) {
                  hash = name.charCodeAt(i) + ((hash << 5) - hash);
              }
              const palettes = [
                  ['#172554', '#1D4ED8'],
                  ['#1E3A8A', '#2563EB'],
                  ['#0F172A', '#1E40AF'],
                  ['#0369A1', '#1D4ED8'],
                  ['#0D9488', '#1E3A8A'],
                  ['#1E293B', '#3B82F6'],
                  ['#0284C7', '#1E3A8A'],
                  ['#115E59', '#0369A1']
              ];
              const idx = Math.abs(hash) % palettes.length;
              return `linear-gradient(135deg, ${palettes[idx][0]}, ${palettes[idx][1]})`;
          }

          export function formatTime(timestamp) {
              if (!timestamp) return '';
              const date = new Date(timestamp);
              return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          }

          export function getStatusColor(status) {
              switch (status) {
                  case 'online': return '#4CAF50';
                  case 'connecting': return '#FFC107';
                  case 'starting': return '#3B82F6';
                  case 'error': return '#F44336';
                  default: return '#9E9E9E';
              }
          }

          export function getStatusText(status) {
              switch (status) {
                  case 'online': return 'В сети';
                  case 'connecting': return 'Подключение...';
                  case 'starting': return 'Подключение к узлу Hydra...';
                  case 'error': return 'Ожидание сети';
                  default: return 'Оффлайн';
              }
          }

          export function parseMarkdown(text) {
              if (!text) return '';
              let html = text
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;');
              html = html.replace(/```([\\s\\S]*?)```/g, '<pre class="md-code-block">$1</pre>');
              html = html.replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
              html = html.replace(/\\*\\*([^*]+)\\*\\*/g, '<strong>$1</strong>');
              html = html.replace(/__([^_]+)__/g, '<strong>$1</strong>');
              html = html.replace(/(?<!\\w)\\*([^*]+)\\*(?!\\w)/g, '<em>$1</em>');
              html = html.replace(/(?<!\\w)_([^_]+)_(?!\\w)/g, '<em>$1</em>');
              html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');
              html = html.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
              html = html.replace(/<[^>]+>|https?:\\/\\/[^\\s<]+/g, (match) => {
                  if (match.startsWith('<')) return match;
                  return `<a href="${match}" target="_blank" rel="noopener noreferrer">${match}</a>`;
              });
              return html.replace(/\\n/g, '<br>');
          }
          '''
          with open("frontend/src/utils.js", "w", encoding="utf-8") as f:
              f.write(utils_js)
          print("[OK] 1. utils.js: починены русские инициалы групп с эмодзи и добавлен фильтр превью медиа/звонков!")

          # 2. internal/appcore/appcore.go:
          #    - Чиним текст системных уведомлений Android в SendNotification (чтобы вместо шифра [HYDRA_VOICE]... писалось "🎤 Голосовое сообщение", "📹 Видео-кружок", "📞 Входящий звонок"!)
          #    - Фильтруем технические пакеты [HYDRA_CALL_ICE], чтобы они не засоряли базу чата, но мгновенно уходили во фронтенд через Emitter.Emit("call_signal", ...)
          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              old_notif = """	case "text":
          		if len(message) > 100 {
          			message = message[:97] + "..."
          		}
          	}"""

              new_notif = """	case "text":
          		if strings.HasPrefix(message, "[HYDRA_VOICE]:") {
          			message = "🎤 Голосовое сообщение"
          		} else if strings.HasPrefix(message, "[HYDRA_CIRCLE]:") {
          			message = "📹 Видео-кружок"
          		} else if strings.HasPrefix(message, "[HYDRA_VIDEO]:") {
          			message = "🎬 Видеозапись"
          		} else if strings.HasPrefix(message, "[HYDRA_CALL_RING]:") {
          			message = "📞 Входящий аудиовызов Hydra..."
          		} else if strings.HasPrefix(message, "[HYDRA_CALL_MISSED]:") {
          			message = "☎️ Пропущенный вызов"
          		} else if strings.HasPrefix(message, "[HYDRA_CALL_END]:") {
          			message = "📞 Звонок завершён"
          		} else if strings.HasPrefix(message, "[HYDRA_GROUP_INVITE]:") || strings.HasPrefix(message, "SFlEUkFfUk9PTV") {
          			message = "🎟️ Приглашение в группу/канал"
          		} else if len(message) > 100 {
          			message = message[:97] + "..."
          		}
          	}"""
              ac = ac.replace(old_notif, new_notif)

              # В OnMessageReceived: если пришёл технический пакет звонка ([HYDRA_CALL_RING], [HYDRA_CALL_ANSWER], [HYDRA_CALL_ICE], [HYDRA_CALL_END]),
              # сразу эмитим событие "hydra_call_signal" во фронтенд! А если это приглашение в группу [HYDRA_GROUP_INVITE]:Название|Ключ — автоматически добавляем группу в контакты!
              old_on_msg = """	msg.ChatID = contact.ChatID

          	if err := a.Repo.SaveMessage(a.Ctx, msg); err != nil {
          		return
          	}"""

              new_on_msg = """	msg.ChatID = contact.ChatID

          	if strings.HasPrefix(msg.Content, "[HYDRA_GROUP_INVITE]:") {
          		parts := strings.SplitN(strings.TrimPrefix(msg.Content, "[HYDRA_GROUP_INVITE]:"), "|", 2)
          		if len(parts) == 2 {
          			_, _ = a.AddContact(parts[0], parts[1])
          			msg.Content = "🎟️ Вас добавили в «" + parts[0] + "»"
          		}
          	}

          	if strings.HasPrefix(msg.Content, "[HYDRA_CALL_ICE]:") || strings.HasPrefix(msg.Content, "[HYDRA_CALL_ANSWER]:") {
          		a.Emitter.Emit("hydra_call_signal", map[string]interface{}{
          			"from":    senderPubKey,
          			"nick":    contact.Nickname,
          			"chat_id": contact.ChatID,
          			"content": msg.Content,
          		})
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_CALL_RING]:") || strings.HasPrefix(msg.Content, "[HYDRA_CALL_END]:") || strings.HasPrefix(msg.Content, "[HYDRA_CALL_MISSED]:") {
          		a.Emitter.Emit("hydra_call_signal", map[string]interface{}{
          			"from":       senderPubKey,
          			"contact_id": contact.ID,
          			"nick":       contact.Nickname,
          			"chat_id":    contact.ChatID,
          			"content":    msg.Content,
          		})
          	}

          	if err := a.Repo.SaveMessage(a.Ctx, msg); err != nil {
          		return
          	}"""
              ac = ac.replace(old_on_msg, new_on_msg)

              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] 2. appcore.go: красивые уведомления без Base64-шифра, авто-принятие приглашений в группы и сигналинг звонков!")

          # 3. AndroidManifest.xml + MainActivity.kt:
          #    - Разрешения WRITE_EXTERNAL_STORAGE / READ_EXTERNAL_STORAGE для Android 9 и 10 (чинит Permission Denial на Xiaomi Mi A1!)
          #    - Нативное всплывающее уведомление (Heads-Up IMPORTANCE_HIGH) с кнопкой "Ответить" (RemoteInput Direct Reply) прямо из другого приложения!
          #    - Блокировка приложения ТОЛЬКО если пользователь вышел дольше чем на 30 секунд!
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              if "WRITE_EXTERNAL_STORAGE" not in mf:
                  mf = mf.replace(
                      '<uses-permission android:name="android.permission.CAMERA" />',
                      '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
                  )
              if "DirectReplyReceiver" not in mf:
                  mf = mf.replace(
                      '</application>',
                      '        <receiver android:name=".DirectReplyReceiver" android:exported="false" />\n    </application>'
                  )
              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(mf)
              print("[OK] 3a. AndroidManifest.xml: добавлены разрешения памяти для Android 9+ и DirectReplyReceiver для ответа из уведомления!")

          # Создаём DirectReplyReceiver.kt для обработки ответа прямо из всплывающего уведомления
          reply_receiver_kt = '''package com.teleghost.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.app.RemoteInput
          import org.json.JSONObject

          class DirectReplyReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val results = RemoteInput.getResultsFromIntent(intent) ?: return
                  val replyText = results.getCharSequence("key_text_reply")?.toString()?.trim() ?: return
                  val senderNick = intent.getStringExtra("sender_nick") ?: ""
                  val notifId = intent.getIntExtra("notif_id", 0)

                  if (replyText.isNotEmpty()) {
                      MainActivity.handleDirectReplyFromNotification(senderNick, replyText)
                  }
                  if (notifId != 0) {
                      NotificationManagerCompat.from(context).cancel(notifId)
                  }
              }
          }
          '''
          with open("android/app/src/main/java/com/teleghost/app/DirectReplyReceiver.kt", "w", encoding="utf-8") as f:
              f.write(reply_receiver_kt)

          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              # Добавляем переменную pauseTimestamp для 30-секундного таймера блокировки и поддержку Direct Reply
              kt = kt.replace(
                  "private var isOpeningSystemPicker = false",
                  "private var isOpeningSystemPicker = false\n    private var pausedAtMs: Long = 0L"
              )
              kt = kt.replace(
                  'private const val PREFS_NAME = "hydra_biometric_prefs"',
                  '''private const val PREFS_NAME = "hydra_biometric_prefs"
                  var currentInstance: MainActivity? = null
                  fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {
                      currentInstance?.runOnUiThread {
                          val sNick = JSONObject.quote(senderNick)
                          val sText = JSONObject.quote(replyText)
                          currentInstance?.webView?.evaluateJavascript(
                              "if(window.__onHydraDirectReply) window.__onHydraDirectReply($sNick, $sText);",
                              null
                          )
                      }
                  }'''
              )
              kt = kt.replace(
                  "super.onCreate(savedInstanceState)",
                  "super.onCreate(savedInstanceState)\n        currentInstance = this"
              )

              # На Android 9 (SDK < 29) запрашиваем WRITE_EXTERNAL_STORAGE и используем совместимое сохранение файла
              kt = kt.replace(
                  'if (checkSelfPermission(android.Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {\n                        needed.add(android.Manifest.permission.CAMERA)\n                    }',
                  '''if (checkSelfPermission(android.Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                                  needed.add(android.Manifest.permission.CAMERA)
                              }
                              if (Build.VERSION.SDK_INT <= 29 && checkSelfPermission(android.Manifest.permission.WRITE_EXTERNAL_STORAGE) != PackageManager.PERMISSION_GRANTED) {
                                  needed.add(android.Manifest.permission.WRITE_EXTERNAL_STORAGE)
                              }'''
              )

              # В saveLogsToDownloads для Android 9 (SDK < 29) пишем напрямую в Environment.getExternalStoragePublicDirectory(DIRECTORY_DOWNLOADS)
              old_save_logs = """                val uri = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                          } else {
                              resolver.insert(android.provider.MediaStore.Files.getContentUri("external"), cv)
                          }"""
              new_save_logs = """                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                              val dlDir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)
                              if (!dlDir.exists()) dlDir.mkdirs()
                              val outFile = File(dlDir, filename)
                              outFile.writeText(logText, Charsets.UTF_8)
                              runOnUiThread {
                                  android.widget.Toast.makeText(this@MainActivity, "✅ Лог сохранён в Загрузки: $filename", android.widget.Toast.LENGTH_LONG).show()
                              }
                              return filename
                          }
                          val uri = resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)"""
              kt = kt.replace(old_save_logs, new_save_logs)

              # Делаем канал уведомлений для входящих сообщений IMPORTANCE_HIGH (всплывающий поверх других приложений!) и добавляем кнопку "Ответить" (RemoteInput)
              kt = kt.replace(
                  "val importance = android.app.NotificationManager.IMPORTANCE_DEFAULT",
                  "val importance = android.app.NotificationManager.IMPORTANCE_HIGH"
              )
              kt = kt.replace(
                  'private const val NOTIFICATION_CHANNEL_ID = "teleghost_messages"',
                  'private const val NOTIFICATION_CHANNEL_ID = "hydra_heads_up_messages"'
              )

              old_show_notif = """                val builder = androidx.core.app.NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(androidx.core.app.NotificationCompat.PRIORITY_DEFAULT)
                              .setAutoCancel(true)
                              .setOngoing(false)

                          val intent = Intent(this, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                          }
                          val pendingIntent: android.app.PendingIntent = android.app.PendingIntent.getActivity(this, 0, intent, android.app.PendingIntent.FLAG_IMMUTABLE)
                          builder.setContentIntent(pendingIntent)

                          with(androidx.core.app.NotificationManagerCompat.from(this)) {
                              notify(System.currentTimeMillis().toInt(), builder.build())
                          }"""

              new_show_notif = """                val notifId = (System.currentTimeMillis() and 0xFFFFFFF).toInt()
                          val senderNick = title.removePrefix("Hydra - ").trim()
                          val remoteInput = androidx.core.app.RemoteInput.Builder("key_text_reply")
                              .setLabel("Быстрый ответ...")
                              .build()
                          val replyIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                              putExtra("sender_nick", senderNick)
                              putExtra("notif_id", notifId)
                          }
                          val replyFlags = if (Build.VERSION.SDK_INT >= 31) {
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_MUTABLE
                          } else {
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT
                          }
                          val replyPendingIntent = android.app.PendingIntent.getBroadcast(this, notifId, replyIntent, replyFlags)
                          val replyAction = androidx.core.app.NotificationCompat.Action.Builder(
                              R.mipmap.ic_launcher,
                              "Ответить",
                              replyPendingIntent
                          ).addRemoteInput(remoteInput).build()

                          val intent = Intent(this, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                          val pendingIntent = android.app.PendingIntent.getActivity(this, 0, intent, android.app.PendingIntent.FLAG_IMMUTABLE)

                          val builder = androidx.core.app.NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(androidx.core.app.NotificationCompat.PRIORITY_HIGH)
                              .setCategory(androidx.core.app.NotificationCompat.CATEGORY_MESSAGE)
                              .setDefaults(androidx.core.app.NotificationCompat.DEFAULT_ALL)
                              .setAutoCancel(true)
                              .setContentIntent(pendingIntent)
                              .addAction(replyAction)

                          with(androidx.core.app.NotificationManagerCompat.from(this)) {
                              notify(notifId, builder.build())
                          }"""
              kt = kt.replace(old_show_notif, new_show_notif)

              # 30-секундный таймер блокировки в onPause / onResume!
              old_pause_resume = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  if (isOpeningSystemPicker) {
                      isOpeningSystemPicker = false
                      webView.evaluateJavascript("setTimeout(function(){ window.__hydraSkipLock = false; }, 1000);", null)
                      pushNativeLog("LIFECYCLE", "Возврат из Галереи (без блокировки)")
                      return
                  }
                  pushNativeLog("LIFECYCLE", "Приложение развёрнуто (onResume)")
                  webView.evaluateJavascript("if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
              }

              override fun onPause() {
                  if (!isOpeningSystemPicker) {
                      pushNativeLog("LIFECYCLE", "Приложение свёрнуто (onPause) — блокировка!")
                      webView.evaluateJavascript("if(window.__setHydraBlur) window.__setHydraBlur(true); if(window.__lockHydraNow) window.__lockHydraNow();", null)
                  }
                  webView.onPause()
                  super.onPause()
              }"""

              new_pause_resume = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  if (isOpeningSystemPicker) {
                      isOpeningSystemPicker = false
                      pausedAtMs = 0L
                      webView.evaluateJavascript("window.__setHydraBlur && window.__setHydraBlur(false); setTimeout(function(){ window.__hydraSkipLock = false; }, 1000);", null)
                      pushNativeLog("LIFECYCLE", "Возврат из Галереи (без блокировки)")
                      return
                  }
                  val awayMs = if (pausedAtMs > 0L) (System.currentTimeMillis() - pausedAtMs) else 0L
                  pausedAtMs = 0L
                  if (awayMs >= 30000L) {
                      pushNativeLog("LIFECYCLE", "Отсутствие ${awayMs / 1000} сек (>= 30с) — запрос разблокировки!")
                      webView.evaluateJavascript("if(window.__lockHydraNow) window.__lockHydraNow(); if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
                  } else {
