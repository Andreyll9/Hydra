name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Play Protect Clean-up, Centered Menus, 2-Profile Limit, Circle Studio (Play/Stop/Trim 2m) & /Hydra/ Folders
        run: |
          cat << 'PYEOF' > apply_v28_fixes.py
          import os, re, shutil

          # 0. Гарантируем, что фирменная иконка щита Гидры (logo.png) на месте
          real_hydra_logo = "frontend/src/assets/images/logo.png"
          if os.path.exists(real_hydra_logo):
              for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = f"android/app/src/main/res/{mip}/{fname}"
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copyfile(real_hydra_logo, dst)

          # 1. ЧИНИМ ПРЕДУПРЕЖДЕНИЕ GOOGLE PLAY ЗАЩИТЫ (AndroidManifest.xml):
          #    - Удаляем BootReceiver, RECEIVE_BOOT_COMPLETED и WAKE_LOCK
          #    - Меняем stopWithTask="false" на stopWithTask="true"
          mf_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf_path):
              with open(mf_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              mf = mf.replace('<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />', '')
              mf = mf.replace('<uses-permission android:name="android.permission.WAKE_LOCK" />', '')
              mf = mf.replace('android:stopWithTask="false"', 'android:stopWithTask="true"')
              mf = re.sub(r'<receiver\s+android:name="\.BootReceiver"[\s\S]*?</receiver>', '', mf)
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)
              print("[OK] 1. AndroidManifest.xml: удалены триггеры Google Play Защиты (BootReceiver, WAKE_LOCK, stopWithTask=false)!")

          # 2. MainActivity.kt:
          #    - Создание собственной структуры папок приложения в памяти телефона: /Download/Hydra/Photos, /Videos, /Voice, /Files, /Logs
          #    - Расширенное определение модели и бренда телефона (с расшифровкой кодов RMX3472, M2010J19SY и др.)
          #    - Проверка наличия handleCallNotificationAction и setScreenshotProtection
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              if "fun handleCallNotificationAction(" not in kt:
                  if "fun handleDirectReplyFromNotification(" in kt:
                      kt = kt.replace(
                          "fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {",
                          """fun handleCallNotificationAction(senderNick: String, action: String) {
              currentInstance?.runOnUiThread {
                  val sNick = JSONObject.quote(senderNick)
                  val sAct = JSONObject.quote(action)
                  currentInstance?.webView?.evaluateJavascript(
                      "if(window.__onHydraCallNotifAction) window.__onHydraCallNotifAction($sNick, $sAct);",
                      null
                  )
              }
          }
          fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {"""
                      )

              if "fun setScreenshotProtection(" not in kt:
                  kt = kt.replace(
                      "inner class HydraNativeBridge {",
                      """inner class HydraNativeBridge {
          @JavascriptInterface
          fun setScreenshotProtection(enabled: Boolean) {
              runOnUiThread {
                  if (enabled) {
                      window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                  }
              }
          }"""
                  )

              old_dev_str = 'obj.put("device", "${Build.MANUFACTURER} ${Build.MODEL}")'
              new_dev_str = '''val rawModel = Build.MODEL ?: ""
                  val brand = (Build.BRAND ?: Build.MANUFACTURER ?: "Android").replaceFirstChar { it.uppercase() }
                  val marketMap = mapOf(
                      "RMX3472" to "Realme 9i / 8i (RMX3472)",
                      "M2010J19SY" to "Xiaomi Redmi 9T / POCO M3"
                  )
                  val prettyDevice = marketMap[rawModel] ?: if (rawModel.startsWith(brand, ignoreCase = true)) rawModel else "$brand $rawModel"
                  obj.put("device", "$prettyDevice • Android ${Build.VERSION.RELEASE}")'''
              kt = kt.replace(old_dev_str, new_dev_str)

              old_save_file = """                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS)
                              put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)
                          }"""
              new_save_file = """                    val subFolder = when {
                              filename.endsWith(".jpg", true) || filename.endsWith(".png", true) -> "Hydra/Photos"
                              filename.endsWith(".mp4", true) || filename.endsWith(".webm", true) -> "Hydra/Videos"
                              filename.endsWith(".ogg", true) || filename.endsWith(".mp3", true) -> "Hydra/Voice"
                              else -> "Hydra/Files"
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/" + subFolder)
                              put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)
                          }"""
              kt = kt.replace(old_save_file, new_save_file)
              kt = kt.replace(
                  'put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS)',
                  'put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Hydra/Logs")'
              )
              kt = kt.replace(
                  'android.widget.Toast.makeText(this, "Сохранено в Загрузки", android.widget.Toast.LENGTH_SHORT).show()',
                  'android.widget.Toast.makeText(this, "✅ Сохранено в папку Download/Hydra!", android.widget.Toast.LENGTH_SHORT).show()'
              )
              kt = kt.replace(
                  'val dlDir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)',
                  'val dlDir = File(android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS), "Hydra")'
              )

              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 2. MainActivity.kt: добавлены папки /Download/Hydra/, модель смартфона и функции уведомлений!")

          # 3. ЛИМИТ 2 ПРОФИЛЯ НА УСТРОЙСТВО + СКРЫТИЕ КНОПКИ "+ СОЗДАТЬ" С ЭКРАНА БЛОКИРОВКИ, КОГДА ЕСТЬ ХОТЯ БЫ 1 ПРОФИЛЬ (Auth.svelte + Settings.svelte):
          au_path = "frontend/src/components/Auth.svelte"
          if os.path.exists(au_path):
              with open(au_path, "r", encoding="utf-8") as f:
                  au = f.read()

              old_add_prof_btn = """            <div 
                      class="profile-item add-profile" 
                      role="button"
                      tabindex="0"
                      on:click={startCreateProfile}
                      on:keydown={(e) => (e.key === 'Enter' || e.key === ' ') && startCreateProfile()}
                  >
                    <div class="plus-icon">+</div>
                    <div class="add-text">Создать</div>
                  </div>"""

              new_add_prof_btn = """            {#if allProfiles.length === 0}
                  <div 
                      class="profile-item add-profile" 
                      role="button"
                      tabindex="0"
                      on:click={startCreateProfile}
                      on:keydown={(e) => (e.key === 'Enter' || e.key === ' ') && startCreateProfile()}
                  >
                    <div class="plus-icon">+</div>
                    <div class="add-text">Создать</div>
                  </div>
                  {/if}"""
              if "{#if allProfiles.length === 0}" not in au:
                  au = au.replace(old_add_prof_btn, new_add_prof_btn)

              if "allProfiles.length >= 2" not in au:
                  au = au.replace(
                      "function startCreateProfile() {",
                      """function startCreateProfile() {
                  if (allProfiles.length >= 2) {
                      showToast('На одном устройстве можно создать максимум 2 профиля', 'error');
                      return;
                  }"""
                  )

              if "hydra_open_create_second" not in au:
                  au = au.replace(
                      "if (allProfiles.length === 0) {\n                authScreen = 'profiles';\n            }",
                      """if (localStorage.getItem('hydra_open_create_second') === '1' && allProfiles.length < 2) {
                      localStorage.removeItem('hydra_open_create_second');
                      startCreateProfile();
                  } else if (allProfiles.length === 0) {
                      authScreen = 'profiles';
                  }"""
                  )

              with open(au_path, "w", encoding="utf-8") as f:
                  f.write(au)
              print("[OK] 3a. Auth.svelte: лимит 2 профиля и скрытие кнопки '+ Создать' при наличии профиля готовы!")

          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()

              prof_switcher_js = """
              let deviceProfiles = [];
              let switchPinValue = '';
              let switchingTargetProf = null;

              async function loadDeviceProfilesForSwitch() {
                  try {
                      deviceProfiles = (await AppActions.ListProfiles()) || [];
                  } catch (e) { deviceProfiles = []; }
              }
              loadDeviceProfilesForSwitch();

              async function quickSwitchToProfile(prof) {
                  if (!prof) return;
                  if (!prof.use_pin) {
                      alert('Для быстрого переключения включите ПИН-код на профиле');
                      return;
                  }
                  switchingTargetProf = prof;
                  switchPinValue = '';
              }

              async function confirmQuickSwitchProfile() {
                  if (!switchingTargetProf || !switchPinValue.trim()) return;
                  try {
                      const mnem = await AppActions.UnlockProfile(switchingTargetProf.id, switchPinValue.trim());
                      await AppActions.Logout();
                      await AppActions.Login(mnem);
                      switchingTargetProf = null;
                      switchPinValue = '';
                      location.reload();
                  } catch (e) {
                      alert('❌ Неверный ПИН-код от второго профиля');
                  }
              }

              async function createSecondProfileFromSettings() {
                  if (deviceProfiles.length >= 2) {
                      alert('Достигнут лимит: максимум 2 профиля на 1 устройстве');
                      return;
                  }
                  localStorage.setItem('hydra_open_create_second', '1');
                  await onLogout();
              }
              """
              if "function loadDeviceProfilesForSwitch()" not in st:
                  st = st.replace("let nickCheckStatus = '';", "let nickCheckStatus = '';\n" + prof_switcher_js, 1)

              prof_switcher_html = """
                              <!-- Управление профилями на устройстве (Лимит: максимум 2 профиля) -->
                              <div style="background: #14161A; border: 1px solid rgba(59,130,246,0.25); border-radius: 20px; padding: 14px; margin-top: 8px;">
                                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                                      <span style="font-size: 13px; font-weight: 800; color: #60A5FA;">👥 Аккаунты на устройстве ({deviceProfiles.length} / 2)</span>
                                      {#if deviceProfiles.length < 2}
                                          <button type="button" on:click={createSecondProfileFromSettings} style="background: #1D4ED8; color: #fff; border: none; border-radius: 100px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer;">
                                              + Создать 2-й профиль
                                          </button>
                                      {:else}
                                          <span style="font-size: 11px; color: #9CA3AF;">Лимит 2/2</span>
                                      {/if}
                                  </div>
                                  <div style="display: flex; flex-direction: column; gap: 8px;">
                                      {#each deviceProfiles as dp}
                                          <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #1A1C20; border-radius: 14px; border: 1px solid {selectedProfile?.id === dp.id ? '#3B82F6' : 'transparent'};">
                                              <div style="display: flex; align-items: center; gap: 10px;">
                                                  <div style="width: 32px; height: 32px; border-radius: 50%; background: #1E3A8A; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px;">
                                                      {getInitials(dp.display_name)}
                                                  </div>
                                                  <div>
                                                      <div style="font-size: 14px; font-weight: 700; color: #E5E7EB;">{dp.display_name}</div>
                                                      <div style="font-size: 11px; color: {selectedProfile?.id === dp.id ? '#10B981' : '#9CA3AF'};">{selectedProfile?.id === dp.id ? '● Текущий профиль' : 'Нажмите для входа'}</div>
                                                  </div>
                                              </div>
                                              {#if selectedProfile?.id !== dp.id}
                                                  <button type="button" on:click={() => quickSwitchToProfile(dp)} style="background: #2563EB; color: #fff; border: none; border-radius: 100px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
                                                      Переключить
                                                  </button>
                                              {/if}
                                          </div>
                                      {/each}
                                  </div>
                                  {#if switchingTargetProf}
                                      <div style="margin-top: 10px; padding: 10px; background: #0E1015; border-radius: 14px; display: flex; gap: 8px; align-items: center;">
                                          <input type="password" placeholder="ПИН от {switchingTargetProf.display_name}..." bind:value={switchPinValue} style="flex: 1; background: #1A1C20; color: #fff; border: 1px solid rgba(59,130,246,0.3); border-radius: 10px; padding: 8px 10px; font-size: 13px;" />
                                          <button type="button" on:click={confirmQuickSwitchProfile} style="background: #10B981; color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 800;">Войти</button>
                                          <button type="button" on:click={() => switchingTargetProf = null} style="background: transparent; color: #9CA3AF; border: none; font-size: 14px;">✕</button>
                                      </div>
                                  {/if}
                              </div>
              """
              if "Аккаунты на устройстве" not in st:
                  st = st.replace(
                      '<button class="btn-secondary logout-btn" on:click={onLogout}>🚪 Выйти из аккаунта</button>',
                      prof_switcher_html + '\n                            <button class="btn-secondary logout-btn" on:click={onLogout}>🚪 Выйти из аккаунта</button>'
                  )
              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] 3b. Settings.svelte: блок переключения профилей проверен")

          # 4. ЦЕНТРИРОВАНИЕ КОНТЕКСТНЫХ МЕНЮ ЭКРАНА + СКРЫТИЕ "УДАЛИТЬ У ВСЕХ" И "РЕДАКТИРОВАТЬ" ДЛЯ КРУЖКОВ/ИЗБРАННОГО В App.svelte:
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              ap = ap.replace(
                  'style="top: {contextMenu.y}px; left: {contextMenu.x}px"',
                  'style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 260px; max-width: 88vw;"'
              )
              ap = ap.replace(
                  'style="top: {folderContextMenu.y}px; left: {folderContextMenu.x}px"',
                  'style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 240px; max-width: 88vw;"'
              )
              ap = ap.replace(
                  'style="top: {messageContextMenu.y}px; left: {messageContextMenu.x}px; min-width: 210px; border-radius: 18px; padding: 8px;"',
                  'style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 265px; max-width: 90vw; border-radius: 22px; padding: 10px;"'
              )
              ap = ap.replace(
                  'style="top: {messageContextMenu.y}px; left: {messageContextMenu.x}px"',
                  'style="top: 50%; left: 50%; transform: translate(-50%, -50%); width: 265px; max-width: 90vw; border-radius: 22px; padding: 10px;"'
              )

              old_edit_and_del = """            {#if messageContextMenu.message?.IsOutgoing}
                  <div class="context-item" on:click={() => {
                      editingMessageId = messageContextMenu.message.ID;
                      editMessageContent = messageContextMenu.message.Content;
                      messageContextMenu.show = false;
                  }}>Редактировать</div>
              {/if}
              <div class="context-item danger" on:click={() => {
                  AppActions.DeleteMessage(messageContextMenu.message.ID);
                  loadMessages(selectedContact.ID);
                  messageContextMenu.show = false;
              }}>🗑️ Удалить у меня</div>
              <div class="context-item danger" style="font-weight: 700;" on:click={async () => {
                  const mId = messageContextMenu.message.ID;
                  messageContextMenu.show = false;
                  await AppActions.DeleteMessage(mId);
                  if (selectedContact && !selectedContact.IsFavorites) {
                      await AppActions.SendText(selectedContact.ID, '[HYDRA_DEL_MSG]:' + mId, '').catch(() => {});
                  }
                  loadMessages(selectedContact.ID);
              }}>🔥 Удалить у всех</div>"""

              new_edit_and_del = """            {#if messageContextMenu.message?.Content?.startsWith('[HYDRA_CIRCLE]:')}
                  <div class="context-item" style="color: #60A5FA; font-weight: 700;" on:click={() => {
                      const msgObj = messageContextMenu.message;
                      messageContextMenu.show = false;
                      if (window.__openExistingCircleTrimmer) window.__openExistingCircleTrimmer(msgObj);
                  }}>✂️ Обрезать кружок</div>
              {:else if messageContextMenu.message?.IsOutgoing && !messageContextMenu.message?.Content?.startsWith('[HYDRA_')}
                  <div class="context-item" on:click={() => {
                      editingMessageId = messageContextMenu.message.ID;
                      editMessageContent = messageContextMenu.message.Content;
                      messageContextMenu.show = false;
                  }}>✏️ Редактировать текст</div>
              {/if}
              <div class="context-item danger" on:click={() => {
                  AppActions.DeleteMessage(messageContextMenu.message.ID);
                  loadMessages(selectedContact.ID);
                  messageContextMenu.show = false;
              }}>🗑️ {selectedContact?.IsFavorites || selectedContact?.Nickname === 'Избранное' ? 'Удалить' : 'Удалить у меня'}</div>
              {#if !selectedContact?.IsFavorites && selectedContact?.Nickname !== 'Избранное'}
                  <div class="context-item danger" style="font-weight: 700;" on:click={async () => {
                      const mId = messageContextMenu.message.ID;
                      messageContextMenu.show = false;
                      await AppActions.DeleteMessage(mId);
                      if (selectedContact) {
                          await AppActions.SendText(selectedContact.ID, '[HYDRA_DEL_MSG]:' + mId, '').catch(() => {});
                      }
                      loadMessages(selectedContact.ID);
                  }}>🔥 Удалить у всех</div>
              {/if}"""
              ap = ap.replace(old_edit_and_del, new_edit_and_del)
              ap = ap.replace(
                  "{#if messageContextMenu.message?.Content}",
                  "{#if messageContextMenu.message?.Content && !messageContextMenu.message.Content.startsWith('[HYDRA_')}"
              )

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 4. App.svelte обновлён")

          # 5. Chat.svelte:
          #    ГАРАНТИРОВАННО объявляем все переменные и функции Студии Кружка (showCircleStudio, circleTrimStart, circleTrimEnd, circleTotalDuration, openCircleStudio, startCircleStudioRecording, stopCircleStudioRecording, sendEditedCircle, closeCircleStudio) сразу после `let showEmojiPanel = false;`!
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              circle_studio_full_js = """
              // === СТУДИЯ ВИДЕО-КРУЖКА (ДО 2 МИНУТ + ВЫБОР КАМЕРЫ + КРУГЛЫЕ КНОПКИ ПУСК/СТОП + ОБРЕЗКА) ===
              let showCircleStudio = false;
              let circleFacingMode = 'user';
              let circleFilterMode = 'none';
              let circleDraftDataUrl = '';
              let circleTrimStart = 0;
              let circleTrimEnd = 120;
              let circleTotalDuration = 15;
              let editingExistingCircleId = null;

              async function openCircleStudio(switchCam = false) {
                  if (switchCam) {
                      circleFacingMode = circleFacingMode === 'user' ? 'environment' : 'user';
                  } else {
                      showCircleStudio = true;
                      circleDraftDataUrl = '';
                      editingExistingCircleId = null;
                      isRecordingMedia = false;
                  }
                  try {
                      const stream = await navigator.mediaDevices.getUserMedia({
                          audio: { echoCancellation: true, noiseSuppression: true },
                          video: { facingMode: circleFacingMode, width: { ideal: 640 }, height: { ideal: 640 }, frameRate: { ideal: 24 } }
                      });
                      activeMediaStream = stream;
                      setTimeout(() => {
                          if (liveCirclePreviewEl && activeMediaStream) {
                              liveCirclePreviewEl.srcObject = activeMediaStream;
                              liveCirclePreviewEl.play().catch(() => {});
                          }
                      }, 80);
                  } catch (e) {
                      alert('Не удалось открыть камеру: ' + e);
                  }
              }

              function startCircleStudioRecording() {
                  if (!activeMediaStream) return;
                  recordedChunks = [];
                  recordMode = 'video';
                  try {
                      mediaRecorderInstance = new MediaRecorder(activeMediaStream, { videoBitsPerSecond: 650000, audioBitsPerSecond: 32000 });
                  } catch (e) {
                      mediaRecorderInstance = new MediaRecorder(activeMediaStream);
                  }
                  mediaRecorderInstance.ondataavailable = e => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
                  mediaRecorderInstance.onstop = () => {
                      const blob = new Blob(recordedChunks, { type: 'video/webm' });
                      const reader = new FileReader();
                      reader.onloadend = () => {
                          circleDraftDataUrl = reader.result;
                          circleTotalDuration = Math.max(2, recordingSeconds || 10);
                          circleTrimStart = 0;
                          circleTrimEnd = circleTotalDuration;
                      };
                      reader.readAsDataURL(blob);
                  };
                  recordingSeconds = 0;
                  clearInterval(recordingInterval);
                  recordingInterval = setInterval(() => {
                      recordingSeconds++;
                      if (recordingSeconds >= 120 && isRecordingMedia) stopCircleStudioRecording();
                  }, 1000);
                  mediaRecorderInstance.start(200);
                  isRecordingMedia = true;
              }

              function stopCircleStudioRecording() {
                  clearInterval(recordingInterval);
                  if (mediaRecorderInstance && isRecordingMedia) {
                      mediaRecorderInstance.stop();
                  }
                  isRecordingMedia = false;
                  if (activeMediaStream) {
                      activeMediaStream.getTracks().forEach(t => t.stop());
                      activeMediaStream = null;
                  }
              }

              async function sendEditedCircle() {
                  if (!circleDraftDataUrl || !selectedContact) return;
                  const cleanBase = circleDraftDataUrl.split('#t=')[0];
                  const trimSuffix = (circleTrimStart > 0 || circleTrimEnd < circleTotalDuration)
                      ? `#t=${circleTrimStart},${Math.max(circleTrimStart + 1, circleTrimEnd)}`
                      : '#t=0.1';
                  const finalPayload = `[HYDRA_CIRCLE]:${cleanBase}${trimSuffix}`;
                  if (editingExistingCircleId) {
                      await AppActions.EditMessage(editingExistingCircleId, finalPayload);
