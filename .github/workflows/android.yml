          # 3. Иконки статусов сообщений (Пустой круг / Круг в круге / Синий круг) в Icons.js + utils.js
          circle_empty_svg = '''<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.8"/></svg>'''
