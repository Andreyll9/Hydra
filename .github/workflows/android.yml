name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Android 7-15 UI Stability & Compatibility Fixes (v3.4.2)
        run: |
          cat << 'PYEOF' > fix_compat_v342.py
          import os, re

          # 1. Версия 3.4.2-hydra и minSdk 24 (Android 7.0+)
          gr_path = "android/app/build.gradle"
          if os.path.exists(gr_path):
              with open(gr_path, "r", encoding="utf-8") as f:
                  gr = f.read()
              gr = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.4.2-hydra"', gr)
              gr = re.sub(r'versionCode\s+\d+', 'versionCode 342', gr)
              gr = re.sub(r'minSdk(?:Version)?\s+\d+', 'minSdk 24', gr)
              with open(gr_path, "w", encoding="utf-8") as f:
                  f.write(gr)
              print("[OK] 1. build.gradle: minSdk 24, version 3.4.2-hydra")

          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          txt = f.read()
                      if "AppVersion:" in txt:
                          txt = re.sub(r'AppVersion:\s*"[^"]+"', 'AppVersion: "3.4.2-hydra"', txt)
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(txt)

          # 2. MainActivity.kt: textZoom = 100, fitsSystemWindows = true, OVER_SCROLL_NEVER
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()
              if "textZoom = 100" not in kt:
                  kt = kt.replace(
                      "displayZoomControls = false",
                      "displayZoomControls = false\n            textZoom = 100",
                      1
                  )
              if "fitsSystemWindows = true" not in kt:
                  kt = kt.replace(
                      'setBackgroundColor(android.graphics.Color.parseColor("#121212"))',
                      'setBackgroundColor(android.graphics.Color.parseColor("#121212"))\n            fitsSystemWindows = true\n            overScrollMode = View.OVER_SCROLL_NEVER',
                      1
                  )
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 2. MainActivity.kt: зафиксирован textZoom=100 и fitsSystemWindows")

          # 3. Замена inset: 0 на top/right/bottom/left и 100dvh на var(--app-height, 100vh) во всех .svelte
          patched_svelte = 0
          for root, _, files in os.walk("frontend/src"):
              for fn in files:
                  if not fn.endswith(".svelte"):
                      continue
                  fp = os.path.join(root, fn)
                  with open(fp, "r", encoding="utf-8") as f:
                      txt = f.read()
                  orig = txt
                  txt = re.sub(r'\binset:\s*0\s*;', 'top: 0; right: 0; bottom: 0; left: 0;', txt)
                  txt = txt.replace("100dvh", "var(--app-height, 100vh)")
                  if txt != orig:
                      with open(fp, "w", encoding="utf-8") as f:
                          f.write(txt)
                      patched_svelte += 1
          print(f"[OK] 3. Заменены inset: 0 и 100dvh в {patched_svelte} Svelte-файлах")

          # 4. App.svelte: динамический расчёт --app-height + блокировка растягивания html/body
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              height_js = """
              // Фиксация реальной высоты экрана для Android 7-15 (исключает скачки и растягивание)
              if (typeof window !== 'undefined' && !window.__hydraHeightSync) {
                  window.__hydraHeightSync = true;
                  const syncAppHeight = () => {
                      const h = (window.visualViewport && window.visualViewport.height) ? window.visualViewport.height : window.innerHeight;
                      document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px');
                  };
                  syncAppHeight();
                  window.addEventListener('resize', syncAppHeight);
                  if (window.visualViewport) {
                      window.visualViewport.addEventListener('resize', syncAppHeight);
                  }
              }
              """
              if "__hydraHeightSync" not in ap:
                  ap = ap.replace("function updateIsMobile() {", height_js + "\n  function updateIsMobile() {", 1)

              lock_css = """
              :global(html), :global(body) {
                  height: var(--app-height, 100vh) !important;
                  max-height: var(--app-height, 100vh) !important;
                  overflow: hidden !important;
                  overscroll-behavior: none !important;
                  position: fixed !important;
                  top: 0; right: 0; bottom: 0; left: 0;
                  width: 100% !important;
              }
              main {
                  height: var(--app-height, 100vh) !important;
                  max-height: var(--app-height, 100vh) !important;
                  overflow: hidden !important;
              }
              """
              if "overscroll-behavior: none !important;" not in ap:
                  ap = ap.replace(":global(body) {", lock_css + "\n    :global(body) {", 1)

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 4. App.svelte: добавлена жёсткая синхронизация --app-height и блокировка скролла body")

          # 5. vite.config.js: транспиляция под Chrome 61+ (Android 7-9 WebView)
          for vc_name in ["frontend/vite.config.js", "frontend/vite.config.ts"]:
              if os.path.exists(vc_name):
                  with open(vc_name, "r", encoding="utf-8") as f:
                      vc = f.read()
                  if "target:" not in vc:
                      if "build:" in vc:
                          vc = vc.replace("build: {", "build: {\n    target: 'chrome61',", 1)
                      else:
                          vc = vc.replace("plugins:", "build: { target: 'chrome61' },\n  plugins:", 1)
                      with open(vc_name, "w", encoding="utf-8") as f:
                          f.write(vc)
                      print(f"[OK] 5. {vc_name}: установлена цель сборки target: 'chrome61'")
                  break
          PYEOF
          python3 fix_compat_v342.py
          rm -f fix_compat_v342.py

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.4.2 Android 7-15 Compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.4.2: Android 7-15 UI stability (--app-height, inset fallback, textZoom=100, chrome61 target) [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR (Stripped)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -ldflags="-s -w" -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.4.2-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
