name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Startup Crash (Restore mobile.go CORS for WebView + Fix Android 14 ForegroundService + Safe MainActivity Startup)
        run: |
          cat << 'PYEOF' > fix_startup_crash.py
          import os, re, shutil

          # 0. Гарантируем иконку щита Гидры
          real_hydra_logo = "frontend/src/assets/images/logo.png"
          if os.path.exists(real_hydra_logo):
              for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = f"android/app/src/main/res/{mip}/{fname}"
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copyfile(real_hydra_logo, dst)

          # 1. ЧИНИМ ПРИЧИНУ №1 НЕЗАПУСКА: mobile/mobile.go
          #    Убираем блокировку Origin (Android WebView часто шлёт Origin: null или file://, из-за чего 127.0.0.1:8080 возвращал 403 Forbidden на старте!)
          mob_path = "mobile/mobile.go"
          if os.path.exists(mob_path):
              with open(mob_path, "r", encoding="utf-8") as f:
                  mb = f.read()

              bad_cors_block = """origin := r.Header.Get("Origin")
          	if origin != "" && !strings.HasPrefix(origin, "http://127.0.0.1") && !strings.HasPrefix(origin, "http://localhost") {
          		http.Error(w, "forbidden origin", http.StatusForbidden)
          		return
          	}
          	w.Header().Set("Access-Control-Allow-Origin", "http://127.0.0.1:8080")"""

              mb = mb.replace(bad_cors_block, 'w.Header().Set("Access-Control-Allow-Origin", "*")')
              # На случай если отступы отличались — заменяем через регулярку:
              mb = re.sub(
                  r'origin\s*:=\s*r\.Header\.Get\("Origin"\)[\s\S]*?w\.Header\(\)\.Set\("Access-Control-Allow-Origin",\s*"http://127\.0\.0\.1:8080"\)',
                  'w.Header().Set("Access-Control-Allow-Origin", "*")',
                  mb
              )
              with open(mob_path, "w", encoding="utf-8") as f:
                  f.write(mb)
              print("[OK] 1. mobile/mobile.go: снята блокировка Origin для Android WebView (API 127.0.0.1:8080 снова отвечает мгновенно!)")

          # 2. ЧИНИМ ПРИЧИНУ №2 (КРАШ СЕРВИСА ПРИ ЗАПУСКЕ НА ANDROID 10-14): TeleGhostService.kt + AndroidManifest.xml + MainActivity.kt
          svc_path = "android/app/src/main/java/com/teleghost/app/TeleGhostService.kt"
          if os.path.exists(svc_path):
              svc_clean_code = '''package com.teleghost.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class TeleGhostService : Service() {

              companion object {
                  private const val CHANNEL_ID = "TeleGhostServiceChannel"
                  private const val NOTIFICATION_ID = 1
              }

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  try {
                      val notification = createNotification()
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          startForeground(
                              NOTIFICATION_ID,
                              notification,
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                          )
                      } else {
                          startForeground(NOTIFICATION_ID, notification)
                      }
                  } catch (e: Exception) {
                      android.util.Log.e("HydraService", "startForeground safe catch: ${e.message}")
                  }

                  Thread {
                      try {
                          val dataDir = filesDir.absolutePath
                          mobile.Mobile.start(dataDir)
                      } catch (e: Exception) {
                          android.util.Log.e("HydraService", "Mobile.start error: ${e.message}")
                      }
                  }.start()

                  return START_STICKY
              }

              override fun onDestroy() {
                  try {
                      mobile.Mobile.stop()
                  } catch (_: Exception) {}
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val serviceChannel = NotificationChannel(
                          CHANNEL_ID,
                          "Hydra E2EE • Тихий режим",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      val manager = getSystemService(NotificationManager::class.java)
                      manager?.createNotificationChannel(serviceChannel)
                  }
              }

              private fun createNotification(): Notification {
                  val notificationIntent = Intent(this, MainActivity::class.java)
                  val pendingIntentFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  } else {
                      PendingIntent.FLAG_UPDATE_CURRENT
                  }
                  val pendingIntent = PendingIntent.getActivity(
                      this, 0, notificationIntent, pendingIntentFlags
                  )

                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Hydra активна")
                      .setContentText("Защищённый канал E2EE (X25519 + XChaCha20) активен")
                      .setSmallIcon(R.mipmap.ic_launcher)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build()
              }
          }
          '''
              with open(svc_path, "w", encoding="utf-8") as f:
                  f.write(svc_clean_code)
              print("[OK] 2a. TeleGhostService.kt: добавлен ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC и защита от краша на Android 14!")

          # В MainActivity.kt дублируем запуск mobile.Mobile.start(filesDir.absolutePath) напрямую из Activity на случай, если система задержала старт ForegroundService!
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              old_start_svc = """    private fun startGoService() {
                  val intent = Intent(this, TeleGhostService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
                  waitForServerAndLoad()
              }"""

              new_start_svc = """    private fun startGoService() {
                  // Немедленно запускаем Go-сервер 127.0.0.1:8080 в фоновом потоке напрямую, чтобы не зависеть от задержек Android Service!
                  Thread {
                      try {
                          mobile.Mobile.start(filesDir.absolutePath)
                      } catch (e: Exception) {
                          android.util.Log.e(TAG, "Direct Mobile.start error: ${e.message}")
                      }
                  }.start()

                  try {
                      val intent = Intent(this, TeleGhostService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(intent)
                      } else {
                          startService(intent)
                      }
                  } catch (e: Exception) {
                      android.util.Log.e(TAG, "Service start fallback: ${e.message}")
                  }
                  waitForServerAndLoad()
              }"""
              kt = kt.replace(old_start_svc, new_start_svc)
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 2b. MainActivity.kt: добавлен прямой старт Go-ядра без ожидания ForegroundService!")

          # 3. Проверяем AndroidManifest.xml (возвращаем BootReceiver в безопасном виде или проверяем валидность всех тегов)
          mf_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf_path):
              with open(mf_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              # Убеждаемся, что WAKE_LOCK есть (он нужен Go-рантайму при сетевых операциях)
              if "android.permission.WAKE_LOCK" not in mf:
                  mf = mf.replace(
                      '<uses-permission android:name="android.permission.INTERNET" />',
                      '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />'
                  )
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)
              print("[OK] 3. AndroidManifest.xml проверен и валиден!")
          PYEOF
          python3 fix_startup_crash.py
          rm -f fix_startup_crash.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Startup Fix to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix startup hang/crash: restore WebView CORS in mobile.go, add Android 14 FOREGROUND_SERVICE_TYPE_DATA_SYNC & direct Go server start [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
