name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Clean Android-Only Fixes (Call Notif, PIN Update, Video Picker, Disable Desktop Mode, Clean Duplicates)
        run: |
          cat << 'PYEOF' > apply_android_cleanup.py
          import os, re

          # 1. MainActivity.kt: кнопки звонка (Принять/Отклонить без RemoteInput), папка Download/Hydra, выбор видео+фото
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              new_show_notif = '''    override fun showNotification(title: String, message: String) {
                  runOnUiThread {
                      try {
                          val notifId = (System.currentTimeMillis() and 0xFFFFFFF).toInt()
                          val senderNick = title.removePrefix("Hydra - ").trim()
                          val replyFlags = if (Build.VERSION.SDK_INT >= 31) {
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_MUTABLE
                          } else {
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT
                          }
                          val intent = Intent(this, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                          val pendingIntent = android.app.PendingIntent.getActivity(
                              this, 0, intent, android.app.PendingIntent.FLAG_IMMUTABLE
                          )

                          val isCallNotif = message.contains("вызов", ignoreCase = true) ||
                              message.contains("звонок", ignoreCase = true)

                          val builder = androidx.core.app.NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(androidx.core.app.NotificationCompat.PRIORITY_HIGH)
                              .setCategory(
                                  if (isCallNotif) androidx.core.app.NotificationCompat.CATEGORY_CALL
                                  else androidx.core.app.NotificationCompat.CATEGORY_MESSAGE
                              )
                              .setDefaults(androidx.core.app.NotificationCompat.DEFAULT_ALL)
                              .setAutoCancel(true)
                              .setContentIntent(pendingIntent)

                          if (isCallNotif) {
                              val accIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                                  putExtra("sender_nick", senderNick)
                                  putExtra("notif_id", notifId)
                                  putExtra("call_action", "accept_call")
                              }
                              val decIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                                  putExtra("sender_nick", senderNick)
                                  putExtra("notif_id", notifId)
                                  putExtra("call_action", "decline_call")
                              }
                              val accPending = android.app.PendingIntent.getBroadcast(this, notifId + 1, accIntent, replyFlags)
                              val decPending = android.app.PendingIntent.getBroadcast(this, notifId + 2, decIntent, replyFlags)
                              builder.addAction(R.mipmap.ic_launcher, "🟢 Принять", accPending)
                              builder.addAction(R.mipmap.ic_launcher, "🔴 Отклонить", decPending)
                          } else {
                              val remoteInput = androidx.core.app.RemoteInput.Builder("key_text_reply")
                                  .setLabel("Быстрый ответ...")
                                  .build()
                              val replyIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                                  putExtra("sender_nick", senderNick)
                                  putExtra("notif_id", notifId)
                              }
                              val replyPendingIntent = android.app.PendingIntent.getBroadcast(this, notifId, replyIntent, replyFlags)
                              val replyAction = androidx.core.app.NotificationCompat.Action.Builder(
                                  R.mipmap.ic_launcher,
                                  "Ответить",
                                  replyPendingIntent
                              ).addRemoteInput(remoteInput).build()
                              builder.addAction(replyAction)
                          }

                          with(androidx.core.app.NotificationManagerCompat.from(this)) {
                              notify(notifId, builder.build())
                          }
                      } catch (e: Exception) {
                          android.util.Log.e(TAG, "Notification failed", e)
                      }
                  }
              }

          '''
              kt = re.sub(
                  r'    override fun showNotification\(title: String, message: String\) \{[\s\S]*?(?=    override fun saveFile\()',
                  new_show_notif,
                  kt,
                  count=1
              )

              # Сохранение файлов из чатов в Download/Hydra (а не в /Logs)
              kt = kt.replace(
                  'put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Hydra/Logs")\n                        put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)',
                  'put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS + "/Hydra")\n                        put(android.provider.MediaStore.MediaColumns.IS_PENDING, 1)'
              )

              # Выбор фото и видео в Галерее (для Сторис и QR)
              kt = kt.replace(
                  'type = "image/*"',
                  'type = "*/*"\n                        putExtra(Intent.EXTRA_MIME_TYPES, arrayOf("image/*", "video/*"))'
              )

              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 1. MainActivity.kt обновлён (звонки без RemoteInput, Download/Hydra, фото+видео)")

          # 2. mobile/mobile.go: добавляем UpdateProfile (для смены PIN) и алиас CopyToClipboard
          mob_path = "mobile/mobile.go"
          if os.path.exists(mob_path):
              with open(mob_path, "r", encoding="utf-8") as f:
                  mb = f.read()

              if 'case "UpdateProfile":' not in mb:
                  mb = mb.replace(
                      'case "DeleteProfile":',
                      '''case "UpdateProfile":
          		var profileID, name, avatarPath, newPin, mnemonic string
          		var deleteAvatar, usePin bool
          		parseArgs(args, &profileID, &name, &avatarPath, &deleteAvatar, &usePin, &newPin, &mnemonic)
          		return nil, app.UpdateProfile(profileID, name, avatarPath, deleteAvatar, usePin, newPin, mnemonic)

          	case "DeleteProfile":'''
                  )

              mb = mb.replace('case "ClipboardSet":', 'case "ClipboardSet", "CopyToClipboard":')

              with open(mob_path, "w", encoding="utf-8") as f:
                  f.write(mb)
              print("[OK] 2. mobile.go: добавлен UpdateProfile и алиас CopyToClipboard")

          # 3. frontend/src/lib/api_bridge.js: отключаем ПК-режим (Wails)
          ab_path = "frontend/src/lib/api_bridge.js"
          if os.path.exists(ab_path):
              with open(ab_path, "r", encoding="utf-8") as f:
                  ab = f.read()
              ab = re.sub(
                  r'function isDesktop\(\) \{[\s\S]*?\}',
                  'function isDesktop() {\n    return false; // Android-only mode\n}',
                  ab,
                  count=1
              )
              with open(ab_path, "w", encoding="utf-8") as f:
                  f.write(ab)
              print("[OK] 3. api_bridge.js: ПК-режим отключён")

          # 4. frontend/src/components/Chat.svelte: подключаем кнопки уведомления звонка
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()
              if "window.__onHydraCallNotifAction" not in ch:
                  ch = ch.replace(
                      "window.__triggerHydraCallFromProfile = () => startHydraCall();",
                      """window.__triggerHydraCallFromProfile = () => startHydraCall();
                  window.__onHydraCallNotifAction = (senderNick, action) => {
                      if (action === 'accept_call') {
                          acceptIncomingHydraCall();
                      } else if (action === 'decline_call') {
                          endHydraCall(true);
                      }
                  };"""
                  )
                  with open(ch_path, "w", encoding="utf-8") as f:
                      f.write(ch)
                  print("[OK] 4. Chat.svelte: подключён __onHydraCallNotifAction")

          # 5. frontend/src/App.svelte: фиксируем мобильный режим и вычищаем дубли
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              ap = ap.replace("let isMobile = false;", "let isMobile = true;")
              ap = ap.replace("isMobile = window.innerWidth < 768;", "isMobile = true; // Android-only")

              # Убираем тройные дубли __setHydraBlur(false)
              ap = re.sub(
                  r'(\s*if \(typeof window !== \'undefined\' && window\.__setHydraBlur\) window\.__setHydraBlur\(false\);){2,}',
                  "\n            if (typeof window !== 'undefined' && window.__setHydraBlur) window.__setHydraBlur(false);",
                  ap
              )

              # Убираем дублирующийся старый блок темы #121212 перед новой темой #121316
              old_theme_dup = """    :global(:root) {
                  --bg-primary: #121212 !important;
                  --bg-secondary: #1E1F22 !important;
                  --bg-tertiary: #28292D !important;
                  --accent: #8AB4F8 !important;
                  --text-primary: #E3E3E3 !important;
                  --text-secondary: #9AA0A6 !important;
              }
              :global(body), :global(.app-container), :global(.login-screen), :global(.content-area) {
                  background: #121212 !important;
                  color: #E3E3E3 !important;
              }
              :global(.sidebar), :global(.glass-panel), :global(.settings-card), :global(.modal-content) {
                  background: #1E1F22 !important;
                  backdrop-filter: none !important;
                  border: 1px solid rgba(255,255,255,0.05) !important;
                  border-radius: 24px !important;
                  box-shadow: none !important;
              }
              :global(.btn-primary), :global(.btn-primary-premium) {
                  background: #8AB4F8 !important;
                  color: #062E6F !important;
                  border-radius: 100px !important;
                  font-weight: 700 !important;
                  box-shadow: none !important;
              }"""
              ap = ap.replace(old_theme_dup, "")

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 5. App.svelte: закреплён Android-режим и очищены дубли")

          # 6. frontend/index.html: убираем дубль проверки 30-секундной блокировки
          idx_path = "frontend/index.html"
          if os.path.exists(idx_path):
              with open(idx_path, "r", encoding="utf-8") as f:
                  ix = f.read()
              dup_lock = """            if (window.__hiddenSince && (Date.now() - window.__hiddenSince >= 30000) && window.__lockHydraNow) { window.__lockHydraNow(); }
                      window.__hiddenSince = 0;
                      if (window.__hiddenSince && (Date.now() - window.__hiddenSince >= 30000) && window.__lockHydraNow) { window.__lockHydraNow(); }
                      window.__hiddenSince = 0;"""
              one_lock = """            if (window.__hiddenSince && (Date.now() - window.__hiddenSince >= 30000) && window.__lockHydraNow) { window.__lockHydraNow(); }
                      window.__hiddenSince = 0;"""
              ix = ix.replace(dup_lock, one_lock)
              with open(idx_path, "w", encoding="utf-8") as f:
                  f.write(ix)
              print("[OK] 6. index.html: убран дубль таймера блокировки")
          PYEOF
          python3 apply_android_cleanup.py
          rm -f apply_android_cleanup.py
          gofmt -w mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Android-Only Cleanup & Call Notification Fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Android cleanup: fix call notification buttons, PIN UpdateProfile in mobile.go, video picker & disable desktop mode [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
