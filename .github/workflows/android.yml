name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Complete Hydra v2.7.0 Redesign (Waveform Voice, Bottom Mic/Cam Toggle, Full Profile Media Tabs, Circle Read Status, Reactions, Pin Message, FLAG_SECURE & Authors @RTbeta / @nullcoredev)
        run: |
          cat << 'PYEOF' > apply_hydra_v27_master.py
          import os, re, shutil

          # 0. Устанавливаем фирменную иконку щита Гидры (logo.png)
          real_hydra_logo = "frontend/src/assets/images/logo.png"
          if os.path.exists(real_hydra_logo):
              for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = f"android/app/src/main/res/{mip}/{fname}"
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copyfile(real_hydra_logo, dst)
              shutil.copyfile(real_hydra_logo, "frontend/public/icon.png")
              shutil.copyfile(real_hydra_logo, "icon.png")

          # 1. AndroidManifest.xml + MainActivity.kt + DirectReplyReceiver.kt:
          #    - Защита от ADB backup (allowBackup=false)
          #    - Нативный тумблер защиты от скриншотов и записи экрана (FLAG_SECURE) через HydraNative.setScreenshotProtection(enabled)
          #    - 30-секундный таймер блокировки при сворачивании
          #    - Кнопки "🟢 Ответить" / "🔴 Отклонить" в уведомлении при звонке и быстрый ответ текстом для обычных сообщений
          mf_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf_path):
              with open(mf_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              mf = mf.replace('android:allowBackup="true"', 'android:allowBackup="false"')
              if "WRITE_EXTERNAL_STORAGE" not in mf:
                  mf = mf.replace(
                      '<uses-permission android:name="android.permission.CAMERA" />',
                      '<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />'
                  )
              if "DirectReplyReceiver" not in mf:
                  mf = mf.replace(
                      '</application>',
                      '        <receiver android:name=".DirectReplyReceiver" android:exported="false" />\n    </application>'
                  )
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)

          dr_code = '''package com.teleghost.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import androidx.core.app.NotificationManagerCompat
          import androidx.core.app.RemoteInput

          class DirectReplyReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val notifId = intent.getIntExtra("notif_id", 0)
                  val senderNick = intent.getStringExtra("sender_nick") ?: ""
                  val callAction = intent.getStringExtra("call_action") ?: ""

                  if (callAction == "accept_call" || callAction == "decline_call") {
                      if (notifId != 0) NotificationManagerCompat.from(context).cancel(notifId)
                      if (callAction == "accept_call") {
                          val actIntent = Intent(context, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                          context.startActivity(actIntent)
                      }
                      MainActivity.handleCallNotificationAction(senderNick, callAction)
                      return
                  }

                  val results = RemoteInput.getResultsFromIntent(intent) ?: return
                  val replyText = results.getCharSequence("key_text_reply")?.toString()?.trim() ?: return
                  if (replyText.isNotEmpty()) {
                      MainActivity.handleDirectReplyFromNotification(senderNick, replyText)
                  }
                  if (notifId != 0) {
                      NotificationManagerCompat.from(context).cancel(notifId)
                  }
              }
          }
          '''
          with open("android/app/src/main/java/com/teleghost/app/DirectReplyReceiver.kt", "w", encoding="utf-8") as f:
              f.write(dr_code)

          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              if "pausedAtMs" not in kt:
                  kt = kt.replace(
                      "private var isOpeningSystemPicker = false",
                      "private var isOpeningSystemPicker = false\n    private var pausedAtMs: Long = 0L"
                  )
              if "currentInstance" not in kt:
                  kt = kt.replace(
                      'private const val PREFS_NAME = "hydra_biometric_prefs"',
                      '''private const val PREFS_NAME = "hydra_biometric_prefs"
                      var currentInstance: MainActivity? = null
                      fun handleCallNotificationAction(senderNick: String, action: String) {
                          currentInstance?.runOnUiThread {
                              val sNick = JSONObject.quote(senderNick)
                              val sAct = JSONObject.quote(action)
                              currentInstance?.webView?.evaluateJavascript(
                                  "if(window.__onHydraCallNotifAction) window.__onHydraCallNotifAction($sNick, $sAct);",
                                  null
                              )
                          }
                      }
                      fun handleDirectReplyFromNotification(senderNick: String, replyText: String) {
                          currentInstance?.runOnUiThread {
                              val sNick = JSONObject.quote(senderNick)
                              val sText = JSONObject.quote(replyText)
                              currentInstance?.webView?.evaluateJavascript(
                                  "if(window.__onHydraDirectReply) window.__onHydraDirectReply($sNick, $sText);",
                                  null
                              )
                          }
                      }'''
                  )
                  kt = kt.replace("super.onCreate(savedInstanceState)", "super.onCreate(savedInstanceState)\n        currentInstance = this")

              # Добавляем @JavascriptInterface setScreenshotProtection(enabled: Boolean) для защиты от скриншотов FLAG_SECURE
              if "fun setScreenshotProtection(" not in kt:
                  kt = kt.replace(
                      "inner class HydraNativeBridge {",
                      """inner class HydraNativeBridge {
                      @JavascriptInterface
                      fun setScreenshotProtection(enabled: Boolean) {
                          runOnUiThread {
                              if (enabled) {
                                  window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)
                              } else {
                                  window.clearFlags(WindowManager.LayoutParams.FLAG_SECURE)
                              }
                          }
                      }"""
                  )

              # Поддержка сохранения логов на Android 9 (SDK < 29)
              old_save_logs = """                val uri = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                          } else {
                              resolver.insert(android.provider.MediaStore.Files.getContentUri("external"), cv)
                          }"""
              new_save_logs = """                if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                              val dlDir = android.os.Environment.getExternalStoragePublicDirectory(android.os.Environment.DIRECTORY_DOWNLOADS)
                              if (!dlDir.exists()) dlDir.mkdirs()
                              val outFile = File(dlDir, filename)
                              outFile.writeText(logText, Charsets.UTF_8)
                              runOnUiThread {
                                  android.widget.Toast.makeText(this@MainActivity, "✅ Лог сохранён в Загрузки: $filename", android.widget.Toast.LENGTH_LONG).show()
                              }
                              return filename
                          }
                          val uri = resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)"""
              kt = kt.replace(old_save_logs, new_save_logs)

              # Всплывающие уведомления с кнопками Ответить/Отклонить для звонка и быстрым ответом для сообщений
              kt = kt.replace("val importance = android.app.NotificationManager.IMPORTANCE_DEFAULT", "val importance = android.app.NotificationManager.IMPORTANCE_HIGH")
              kt = kt.replace('private const val NOTIFICATION_CHANNEL_ID = "teleghost_messages"', 'private const val NOTIFICATION_CHANNEL_ID = "hydra_heads_up_v2"')

              old_show_notif = """                val builder = androidx.core.app.NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(androidx.core.app.NotificationCompat.PRIORITY_DEFAULT)
                              .setAutoCancel(true)
                              .setOngoing(false)

                          val intent = Intent(this, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                          }
                          val pendingIntent: android.app.PendingIntent = android.app.PendingIntent.getActivity(this, 0, intent, android.app.PendingIntent.FLAG_IMMUTABLE)
                          builder.setContentIntent(pendingIntent)

                          with(androidx.core.app.NotificationManagerCompat.from(this)) {
                              notify(System.currentTimeMillis().toInt(), builder.build())
                          }"""

              new_show_notif = """                val notifId = (System.currentTimeMillis() and 0xFFFFFFF).toInt()
                          val senderNick = title.removePrefix("Hydra - ").trim()
                          val replyFlags = if (Build.VERSION.SDK_INT >= 31) {
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT or android.app.PendingIntent.FLAG_MUTABLE
                          } else {
                              android.app.PendingIntent.FLAG_UPDATE_CURRENT
                          }
                          val intent = Intent(this, MainActivity::class.java).apply {
                              flags = Intent.FLAG_ACTIVITY_SINGLE_TOP or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                          val pendingIntent = android.app.PendingIntent.getActivity(this, 0, intent, android.app.PendingIntent.FLAG_IMMUTABLE)
                          val isCallNotif = message.contains("вызов") || message.contains("Звонок")

                          val builder = androidx.core.app.NotificationCompat.Builder(this, NOTIFICATION_CHANNEL_ID)
                              .setSmallIcon(R.mipmap.ic_launcher)
                              .setContentTitle(title)
                              .setContentText(message)
                              .setPriority(androidx.core.app.NotificationCompat.PRIORITY_HIGH)
                              .setCategory(if (isCallNotif) androidx.core.app.NotificationCompat.CATEGORY_CALL else androidx.core.app.NotificationCompat.CATEGORY_MESSAGE)
                              .setDefaults(androidx.core.app.NotificationCompat.DEFAULT_ALL)
                              .setAutoCancel(true)
                              .setContentIntent(pendingIntent)

                          if (isCallNotif) {
                              val accIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                                  putExtra("sender_nick", senderNick)
                                  putExtra("notif_id", notifId)
                                  putExtra("call_action", "accept_call")
                              }
                              val decIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                                  putExtra("sender_nick", senderNick)
                                  putExtra("notif_id", notifId)
                                  putExtra("call_action", "decline_call")
                              }
                              val accPending = android.app.PendingIntent.getBroadcast(this, notifId + 1, accIntent, replyFlags)
                              val decPending = android.app.PendingIntent.getBroadcast(this, notifId + 2, decIntent, replyFlags)
                              builder.addAction(R.mipmap.ic_launcher, "🟢 Ответить", accPending)
                              builder.addAction(R.mipmap.ic_launcher, "🔴 Отклонить", decPending)
                          } else {
                              val remoteInput = androidx.core.app.RemoteInput.Builder("key_text_reply")
                                  .setLabel("Быстрый ответ...")
                                  .build()
                              val replyIntent = Intent(this, DirectReplyReceiver::class.java).apply {
                                  putExtra("sender_nick", senderNick)
                                  putExtra("notif_id", notifId)
                              }
                              val replyPendingIntent = android.app.PendingIntent.getBroadcast(this, notifId, replyIntent, replyFlags)
                              val replyAction = androidx.core.app.NotificationCompat.Action.Builder(
                                  R.mipmap.ic_launcher,
                                  "Ответить",
                                  replyPendingIntent
                              ).addRemoteInput(remoteInput).build()
                              builder.addAction(replyAction)
                          }

                          with(androidx.core.app.NotificationManagerCompat.from(this)) {
                              notify(notifId, builder.build())
                          }"""
              kt = kt.replace(old_show_notif, new_show_notif)

              # 30-секундный таймер блокировки + сброс AudioManager.MODE_NORMAL после звонка
              old_pause_resume = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  if (isOpeningSystemPicker) {
                      isOpeningSystemPicker = false
                      webView.evaluateJavascript("setTimeout(function(){ window.__hydraSkipLock = false; }, 1000);", null)
                      pushNativeLog("LIFECYCLE", "Возврат из Галереи (без блокировки)")
                      return
                  }
                  pushNativeLog("LIFECYCLE", "Приложение развёрнуто (onResume)")
                  webView.evaluateJavascript("if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
              }

              override fun onPause() {
                  if (!isOpeningSystemPicker) {
                      pushNativeLog("LIFECYCLE", "Приложение свёрнуто (onPause) — блокировка!")
                      webView.evaluateJavascript("if(window.__setHydraBlur) window.__setHydraBlur(true); if(window.__lockHydraNow) window.__lockHydraNow();", null)
                  }
                  webView.onPause()
                  super.onPause()
              }"""

              new_pause_resume = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  if (isOpeningSystemPicker) {
                      isOpeningSystemPicker = false
                      pausedAtMs = 0L
                      webView.evaluateJavascript("window.__setHydraBlur && window.__setHydraBlur(false); setTimeout(function(){ window.__hydraSkipLock = false; }, 1000);", null)
                      pushNativeLog("LIFECYCLE", "Возврат из Галереи (без блокировки)")
                      return
                  }
                  val awayMs = if (pausedAtMs > 0L) (System.currentTimeMillis() - pausedAtMs) else 0L
                  pausedAtMs = 0L
                  if (awayMs >= 30000L) {
                      pushNativeLog("LIFECYCLE", "Отсутствие ${awayMs / 1000} сек (>= 30с) — запрос разблокировки!")
                      webView.evaluateJavascript("if(window.__lockHydraNow) window.__lockHydraNow(); if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
                  } else {
                      pushNativeLog("LIFECYCLE", "Быстрый возврат (${awayMs / 1000} сек < 30с) — сессия сохранена")
                      webView.evaluateJavascript("if(window.__setHydraBlur) window.__setHydraBlur(false);", null)
                  }
              }

              override fun onPause() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                      if (am.mode != android.media.AudioManager.MODE_NORMAL) {
                          am.mode = android.media.AudioManager.MODE_NORMAL
                      }
                  } catch (_: Exception) {}
                  if (!isOpeningSystemPicker) {
                      pausedAtMs = System.currentTimeMillis()
                      webView.evaluateJavascript("if(window.__setHydraBlur) window.__setHydraBlur(true);", null)
                  }
                  webView.onPause()
                  super.onPause()
              }"""
              kt = kt.replace(old_pause_resume, new_pause_resume)
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 1. MainActivity.kt & DirectReplyReceiver.kt: FLAG_SECURE, кнопки звонка в уведомлении и 30с таймер блокировки!")

          # 2. Go-ядро (mobile.go, settings.go, appcore.go, messages.go, auth.go):
          #    - Авторы: @RTbeta (Hydra) и @nullcoredev (TeleGhost Core)
          #    - Пинг Яндекс (ya.ru) и Google (generate_204) при отсутствии связи с VPS
          #    - Защита CORS (127.0.0.1:8080)
          #    - Фильтрация технических пакетов [HYDRA_CALL_ANSWER], [HYDRA_DEL_MSG], [HYDRA_READ_ACK], [HYDRA_REACT], [HYDRA_STORY_SYNC]
          mob_path = "mobile/mobile.go"
          if os.path.exists(mob_path):
              with open(mob_path, "r", encoding="utf-8") as f:
                  mb = f.read()
              mb = mb.replace(
                  'w.Header().Set("Access-Control-Allow-Origin", "*")',
                  '''origin := r.Header.Get("Origin")
          	if origin != "" && !strings.HasPrefix(origin, "http://127.0.0.1") && !strings.HasPrefix(origin, "http://localhost") {
          		http.Error(w, "forbidden origin", http.StatusForbidden)
          		return
          	}
          	w.Header().Set("Access-Control-Allow-Origin", "http://127.0.0.1:8080")'''
              )
              with open(mob_path, "w", encoding="utf-8") as f:
                  f.write(mb)

          set_go_path = "internal/appcore/settings.go"
          if os.path.exists(set_go_path):
              with open(set_go_path, "r", encoding="utf-8") as f:
                  sg = f.read()
              old_about_fn = """	if err == nil {
          		defer resp.Body.Close()
          		body, _ := io.ReadAll(resp.Body)
          		var h map[string]interface{}
          		_ = json.Unmarshal(body, &h)
          		rtt := time.Since(start).Milliseconds()
          		a.SetNetworkStatus(StatusOnline)
          		netInfo = fmt.Sprintf("✅ Канал E2EE активен! Отклик: %d мс (онлайн: %v)", rtt, h["online_peers"])
          	} else {
          		a.SetNetworkStatus(StatusOffline)
          		log.Printf("[HydraNet] VPS ping failed: %v", err)
          	}

          	return &AppAboutInfo{
          		AppVersion: "2.5.0-hydra",
          		I2PVersion: netInfo,
          		I2PPath:    "Локальная зашифрованная БД (SQLite E2EE)",
          		Author:     "Andreyll9 (Hydra) | Core: TeleGhost (MIT)",
          		License:    "MIT / Open Source",
          	}"""

              new_about_fn = """	if err == nil {
          		defer resp.Body.Close()
          		body, _ := io.ReadAll(resp.Body)
          		var h map[string]interface{}
          		_ = json.Unmarshal(body, &h)
          		rtt := time.Since(start).Milliseconds()
          		a.SetNetworkStatus(StatusOnline)
          		netInfo = fmt.Sprintf("✅ Канал E2EE активен! Отклик: %d мс (онлайн: %v)", rtt, h["online_peers"])
          	} else {
          		yaOk, gOk := false, false
          		probe := &http.Client{Timeout: 3 * time.Second}
          		if r1, e1 := probe.Get("https://ya.ru"); e1 == nil && r1 != nil {
          			yaOk = true
          			r1.Body.Close()
          		}
          		if r2, e2 := probe.Get("https://www.google.com/generate_204"); e2 == nil && r2 != nil {
          			gOk = true
          			r2.Body.Close()
          		}
          		if yaOk || gOk {
          			a.SetNetworkStatus(StatusConnecting)
          			netInfo = fmt.Sprintf("⚠️ Интернет работает (Яндекс: %v, Google: %v), переподключение к VPS...", yaOk, gOk)
          		} else {
          			a.SetNetworkStatus(StatusOffline)
          			netInfo = "❌ Нет интернета (Яндекс и Google недоступны)"
          		}
          	}

          	return &AppAboutInfo{
          		AppVersion: "2.7.0-hydra",
          		I2PVersion: netInfo,
          		I2PPath:    "Локальная зашифрованная БД (SQLite E2EE)",
          		Author:     "@RTbeta (Hydra) | Оригинал ядра: @nullcoredev (TeleGhost)",
          		License:    "MIT / Open Source",
          	}"""
              sg = sg.replace(old_about_fn, new_about_fn)
              with open(set_go_path, "w", encoding="utf-8") as f:
                  f.write(sg)
              print("[OK] 2a. settings.go: указаны @RTbeta и @nullcoredev, добавлен пинг Яндекс и Google!")

          msg_path = "internal/appcore/messages.go"
          if os.path.exists(msg_path):
              with open(msg_path, "r", encoding="utf-8") as f:
                  mc = f.read()
              old_save_out = """	if err := a.Repo.SaveMessage(a.Ctx, msg); err != nil {
          		log.Printf("[AppCore] Failed to save message: %v", err)
          	}"""
              new_save_out = """	if strings.HasPrefix(text, "[HYDRA_CALL_ANSWER]:") || strings.HasPrefix(text, "[HYDRA_CALL_ICE]:") || strings.HasPrefix(text, "[HYDRA_GROUP_INVITE]:") || strings.HasPrefix(text, "[HYDRA_DEL_MSG]:") || strings.HasPrefix(text, "[HYDRA_READ_ACK]:") || strings.HasPrefix(text, "[HYDRA_STORY_SYNC]:") || strings.HasPrefix(text, "[HYDRA_REACT]:") {
          		return nil
          	}
          	if err := a.Repo.SaveMessage(a.Ctx, msg); err != nil {
          		log.Printf("[AppCore] Failed to save message: %v", err)
          	}"""
              mc = mc.replace(old_save_out, new_save_out, 1)
              with open(msg_path, "w", encoding="utf-8") as f:
                  f.write(mc)

          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              old_notif = """	case "text":
          		if len(message) > 100 {
          			message = message[:97] + "..."
          		}
          	}"""
              new_notif = """	case "text":
          		if strings.HasPrefix(message, "[HYDRA_VOICE]:") {
          			message = "🎤 Голосовое сообщение"
          		} else if strings.HasPrefix(message, "[HYDRA_CIRCLE]:") {
          			message = "📹 Видео-кружок"
          		} else if strings.HasPrefix(message, "[HYDRA_VIDEO]:") {
          			message = "🎬 Видеозапись"
          		} else if strings.HasPrefix(message, "[HYDRA_CALL_RING]:") {
          			message = "📞 Входящий аудиовызов Hydra..."
          		} else if strings.HasPrefix(message, "[HYDRA_CALL_MISSED]:") {
          			message = "☎️ Пропущенный вызов"
          		} else if strings.HasPrefix(message, "[HYDRA_CALL_END]:") {
          			message = "📞 Звонок завершён"
          		} else if strings.HasPrefix(message, "[HYDRA_GROUP_INVITE]:") || strings.HasPrefix(message, "SFlEUkFfUk9PTV") {
          			message = "🎟️ Приглашение в группу/канал"
          		} else if len(message) > 100 {
          			message = message[:97] + "..."
          		}
          	}"""
              ac = ac.replace(old_notif, new_notif)

              old_relay_send = """	client := &http.Client{Timeout: 8 * time.Second}
          	resp, err := client.Post("http://191.223.137.164:8085/relay/send", "application/json", bytes.NewReader(raw))
          	if err != nil {
          		return err
          	}
          	defer resp.Body.Close()"""
              new_relay_send = """	client := &http.Client{Timeout: 15 * time.Second}
          	var resp *http.Response
          	var err error
          	for attempt := 0; attempt < 3; attempt++ {
          		resp, err = client.Post("http://191.223.137.164:8085/relay/send", "application/json", bytes.NewReader(raw))
          		if err == nil && resp != nil {
          			break
          		}
          		time.Sleep(350 * time.Millisecond)
          	}
          	if err != nil {
          		return err
          	}
          	defer resp.Body.Close()"""
              ac = ac.replace(old_relay_send, new_relay_send)

