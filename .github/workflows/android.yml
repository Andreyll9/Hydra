name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Chat.svelte TDZ Crash (Black Screen on Open Chat)
        run: |
          python3 - << 'PYEOF'
          import re
          ch_path = "frontend/src/components/Chat.svelte"
          with open(ch_path, "r", encoding="utf-8") as f:
              ch = f.read()

          broken_decl = """let activeCallModal = false;
                  callMinimized = false;
                  if (window.HydraNative?.setCallActive) window.HydraNative.setCallActive(false);
                  window.__hydraActiveCall = null;
                  window.dispatchEvent(new Event('hydra-call-banner'));"""

          if broken_decl in ch:
              ch = ch.replace(broken_decl, "let activeCallModal = false;", 1)
          else:
              ch = re.sub(
                  r"let activeCallModal = false;\s*callMinimized = false;\s*if \(window\.HydraNative\?\.setCallActive\) window\.HydraNative\.setCallActive\(false\);\s*window\.__hydraActiveCall = null;\s*window\.dispatchEvent\(new Event\('hydra-call-banner'\)\);",
                  "let activeCallModal = false;",
                  ch,
                  count=1
              )

          with open(ch_path, "w", encoding="utf-8") as f:
              f.write(ch)
          print("[OK] Chat.svelte: исправлена ошибка инициализации callMinimized (чёрный экран убран)")
          PYEOF

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Chat.svelte Black Screen Fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix black screen when opening chats (callMinimized TDZ in Chat.svelte) [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.0.3-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
