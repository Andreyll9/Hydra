name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Hydra v3.4.0 (Coturn Calls, Native Android Camera, Multi-Select Chats & Delete for Both)
        run: |
          cat << 'PYEOF' > fix_v340.py
          import os, re

          # 0. Обновляем версию до 3.4.0-hydra
          gr_path = "android/app/build.gradle"
          if os.path.exists(gr_path):
              with open(gr_path, "r", encoding="utf-8") as f:
                  gr = f.read()
              gr = re.sub(r'versionName\s+"[^"]+"', 'versionName "3.4.0-hydra"', gr)
              gr = re.sub(r'versionCode\s+\d+', 'versionCode 340', gr)
              with open(gr_path, "w", encoding="utf-8") as f:
                  f.write(gr)

          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          txt = f.read()
                      if "AppVersion:" in txt:
                          txt = re.sub(r'AppVersion:\s*"[^"]+"', 'AppVersion: "3.4.0-hydra"', txt)
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(txt)

          # 1. Go (appcore.go + messages.go): поддержка команды [HYDRA_DEL_CHAT]: (удалить диалог у обоих)
          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()
              if "[HYDRA_DEL_CHAT]:" not in ac:
                  ac = ac.replace(
                      'if strings.HasPrefix(msg.Content, "[HYDRA_DEL_MSG]:") {',
                      '''if strings.HasPrefix(msg.Content, "[HYDRA_DEL_CHAT]:") {
          		if a.Repo != nil && contact != nil {
          			_ = a.Repo.DeleteContact(a.Ctx, contact.ID)
          			a.Emitter.Emit("contact_updated")
          		}
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_DEL_MSG]:") {'''
                  )
              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)

          msg_path = "internal/appcore/messages.go"
          if os.path.exists(msg_path):
              with open(msg_path, "r", encoding="utf-8") as f:
                  mc = f.read()
              if '"[HYDRA_DEL_CHAT]:"' not in mc:
                  mc = mc.replace('"[HYDRA_DEL_MSG]:",', '"[HYDRA_DEL_MSG]:",\n\t\t"[HYDRA_DEL_CHAT]:",')
              with open(msg_path, "w", encoding="utf-8") as f:
                  f.write(mc)

          # 2. MainActivity.kt: запуск родной камеры Android (ACTION_IMAGE_CAPTURE) без блокировки отпечатком
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              if "private var pendingCameraFilePath: String?" not in kt:
                  kt = kt.replace(
                      "private var isBiometricPromptOpen = false",
                      "private var isBiometricPromptOpen = false\n    private var pendingCameraFilePath: String? = null"
                  )

              cam_launcher = """    private val nativeCameraLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  val path = pendingCameraFilePath
                  pendingCameraFilePath = null
                  if (result.resultCode == Activity.RESULT_OK && !path.isNullOrEmpty() && File(path).exists()) {
                      val safePath = JSONObject.quote(path)
                      runOnUiThread {
                          webView.evaluateJavascript("if(window.__onNativeCameraPhoto) window.__onNativeCameraPhoto($safePath);", null)
                      }
                  }
              }

              private val filePickerLauncher ="""
              if "nativeCameraLauncher" not in kt:
                  kt = kt.replace("private val filePickerLauncher =", cam_launcher, 1)

              cam_bridge_fn = """        @JavascriptInterface
                  fun openNativeCamera() {
                      runOnUiThread {
                          try {
                              val tempDir = File(filesDir, "tmp_uploads")
                              if (!tempDir.exists()) tempDir.mkdirs()
                              val photoFile = File(tempDir, "cam_${System.currentTimeMillis()}.jpg")
                              pendingCameraFilePath = photoFile.absolutePath
                              val photoUri = androidx.core.content.FileProvider.getUriForFile(
                                  this@MainActivity,
                                  "com.teleghost.app.fileprovider",
                                  photoFile
                              )
                              val intent = Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE).apply {
                                  putExtra(android.provider.MediaStore.EXTRA_OUTPUT, photoUri)
                                  addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION or Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              }
                              isOpeningSystemPicker = true
                              webView.evaluateJavascript("window.__hydraSkipLock = true;", null)
                              nativeCameraLauncher.launch(intent)
                          } catch (e: Exception) {
                              pushNativeLog("CAM-ERR", "Ошибка запуска родной камеры: ${e.message}")
                          }
                      }
                  }

                  @JavascriptInterface
                  fun setCallActive("""
              if "fun openNativeCamera()" not in kt:
                  kt = kt.replace("@JavascriptInterface\n        fun setCallActive(", cam_bridge_fn, 1)

              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 2. MainActivity.kt: добавлен запуск родной камеры телефона")

          # 3. Chat.svelte: Coturn TURN-сервер в WebRTC + вызов родной камеры в шторке вложений
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              old_ice = "{ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }"
              new_ice = "{ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:rtbeta.duckdns.org:3478' }, { urls: ['turn:rtbeta.duckdns.org:3478?transport=udp', 'turn:rtbeta.duckdns.org:3478?transport=tcp'], username: 'hydra', credential: 'HydraTurn2026!' }] }"
              ch = ch.replace(old_ice, new_ice)

              # Обработчик фото от родной камеры Android (вставляем строго перед async function openAttachSheet)
              native_cam_js = """
              function triggerSystemCameraForChat() {
                  closeAttachSheet();
                  if (window.HydraNative && typeof window.HydraNative.openNativeCamera === 'function') {
                      window.__onNativeCameraPhoto = async (filePath) => {
                          if (!filePath || !selectedContact) return;
                          isUploadingMedia = true;
                          uploadingLabel = 'Шифрование фото E2EE...';
                          try {
                              await AppActions.SendFileMessage(selectedContact.ID, '', '', [filePath], false);
                              dispatch('refresh');
                          } catch (e) {
                              alert('Ошибка отправки фото: ' + e);
                          } finally {
                              isUploadingMedia = false;
                          }
                      };
                      window.HydraNative.openNativeCamera();
                  } else {
                      openInAppPhotoCamera(false);
                  }
              }
              """
              if "function triggerSystemCameraForChat()" not in ch:
                  ch = ch.replace("async function openAttachSheet()", native_cam_js + "\n    async function openAttachSheet()", 1)
                  ch = ch.replace(
                      "on:click={() => { closeAttachSheet(); openInAppPhotoCamera(false); }}",
                      "on:click={triggerSystemCameraForChat}"
                  )

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 3. Chat.svelte: Coturn TURN подключён, камера в шторке открывает родную камеру телефона")

          # 4. Sidebar.svelte:
          # - родная камера для Сторис
          # - мультивыбор контактов/групп/каналов + модалка "Удалить только у меня" / "Удалить у обоих"
          sb_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sb_path):
              with open(sb_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              multiselect_js = """
              let isSelectChatsMode = false;
              let selectedChatIds = [];
              let deleteChatsModalTargets = []; // массив объектов контактов для удаления

              function toggleChatSelection(contactId) {
                  if (selectedChatIds.includes(contactId)) {
                      selectedChatIds = selectedChatIds.filter(id => id !== contactId);
                  } else {
                      selectedChatIds = [...selectedChatIds, contactId];
                  }
                  if (selectedChatIds.length === 0) isSelectChatsMode = false;
              }

              function openDeleteSelectedChatsModal() {
                  const targets = (contacts || []).filter(c => selectedChatIds.includes(c.ID));
                  if (targets.length > 0) deleteChatsModalTargets = targets;
              }

              async function executeDeleteChats(forBoth = false) {
                  const targets = [...deleteChatsModalTargets];
                  deleteChatsModalTargets = [];
                  isSelectChatsMode = false;
                  selectedChatIds = [];
                  for (const c of targets) {
                      const isGroupOrChan = String(c.Nickname || '').startsWith('👥') || String(c.Nickname || '').startsWith('📢');
                      if (forBoth && !isGroupOrChan && !c.IsFavorites) {
                          await AppActions.SendText(c.ID, '[HYDRA_DEL_CHAT]:1', '').catch(() => {});
                      }
                      await AppActions.DeleteContact(c.ID).catch(() => {});
                  }
                  contacts = (contacts || []).filter(c => !targets.some(t => t.ID === c.ID));
              }

              function openNativeCameraForStory() {
                  if (window.HydraNative && typeof window.HydraNative.openNativeCamera === 'function') {
                      window.__onNativeCameraPhoto = async (filePath) => {
                          if (!filePath) return;
                          try {
                              const b64 = await AppActions.GetFileBase64(filePath);
                              if (b64) {
                                  newStoryImage = 'data:image/jpeg;base64,' + b64;
                                  newStoryVideo = '';
                              }
                          } catch (e) {}
                      };
                      window.HydraNative.openNativeCamera();
                  } else {
                      toggleStoryCamera(false);
                  }
              }

              if (typeof window !== 'undefined') {
                  window.__openDeleteChatConfirmModal = (contactObj) => {
                      if (contactObj) deleteChatsModalTargets = [contactObj];
                  };
              }
              """
              if "let isSelectChatsMode =" not in sb:
                  sb = sb.replace("let longPressTimer;", "let longPressTimer;\n" + multiselect_js, 1)

              # Кнопка мультивыбора ☑️ в мобильной шапке рядом с зелёной точкой
              if "isSelectChatsMode = !isSelectChatsMode" not in sb:
                  sb = sb.replace(
                      '<div class="mobile-network-dot"',
                      '<button type="button" on:click={() => { isSelectChatsMode = !isSelectChatsMode; selectedChatIds = []; }} style="background: {isSelectChatsMode ? \'#1D4ED8\' : \'rgba(255,255,255,0.08)\'}; color: #fff; border: none; border-radius: 10px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer;">{isSelectChatsMode ? "Готово" : "☑️"}</button>\n            <div class="mobile-network-dot"',
                      1
                  )

              # Панель массового удаления под шапкой
              multi_bar = """        {#if isSelectChatsMode && selectedChatIds.length > 0}
                      <div style="background: #1E3A8A; color: #fff; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 700; flex-shrink: 0;">
                          <span>Выбрано чатов: {selectedChatIds.length}</span>
                          <button type="button" on:click={openDeleteSelectedChatsModal} style="background: #EF4444; color: #fff; border: none; border-radius: 100px; padding: 5px 14px; font-size: 12px; font-weight: 800; cursor: pointer;">🗑️ Удалить</button>
                      </div>
                  {/if}
                  <!-- Mobile Search -->"""
              if "openDeleteSelectedChatsModal" in sb and "Выбрано чатов:" not in sb:
                  sb = sb.replace("<!-- Mobile Search -->", multi_bar, 1)

              # Клик по контакту в мобильном списке: либо выбор, либо открытие чата
              sb = sb.replace(
                  'on:click={() => onSelectContact(contact)}\n                    on:contextmenu|preventDefault={(e) => onContextMenu(e, contact)}\n                    on:touchstart={(e) => handleTouchStart(contact, \'contact\', e)}\n                    on:touchend={handleTouchEnd}\n                    on:touchmove={handleTouchEnd}\n                    tabindex="0"',
                  'style={selectedChatIds.includes(contact.ID) ? "background: rgba(59,130,246,0.22); border: 1px solid #3B82F6;" : ""}\n                    on:click={() => isSelectChatsMode ? toggleChatSelection(contact.ID) : onSelectContact(contact)}\n                    on:contextmenu|preventDefault={(e) => onContextMenu(e, contact)}\n                    on:touchstart={(e) => handleTouchStart(contact, \'contact\', e)}\n                    on:touchend={handleTouchEnd}\n                    on:touchmove={handleTouchEnd}\n                    tabindex="0"'
              )

              # Кнопка родной камеры в создании Сторис
              sb = sb.replace(
                  'on:click={() => toggleStoryCamera(false)}',
                  'on:click={openNativeCameraForStory}'
              )

              # Модалка подтверждения удаления диалога (У меня / У обоих)
              del_modal_html = """
          {#if deleteChatsModalTargets.length > 0}
              <div style="position: fixed; inset: 0; background: rgba(8,9,14,0.9); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px;">
                  <div style="background: #1A1C20; border: 1px solid rgba(239,68,68,0.4); border-radius: 24px; padding: 20px; width: 100%; max-width: 350px;">
                      <h3 style="margin: 0 0 8px; color: #fff; font-size: 17px;">🗑️ Удалить {deleteChatsModalTargets.length === 1 ? `«${deleteChatsModalTargets[0].Nickname}»` : `выбранные (${deleteChatsModalTargets.length})`}?</h3>
                      <p style="font-size: 12px; color: #9CA3AF; margin: 0 0 16px;">Выберите способ удаления переписки:</p>
                      <div style="display: flex; flex-direction: column; gap: 8px;">
                          <button type="button" on:click={() => executeDeleteChats(false)} style="width: 100%; padding: 12px; border-radius: 14px; background: #28292D; color: #fff; border: none; font-weight: 700; font-size: 13px; cursor: pointer;">🗑️ Удалить только у меня</button>
                          {#if deleteChatsModalTargets.some(c => !String(c.Nickname || '').startsWith('👥') && !String(c.Nickname || '').startsWith('📢'))}
                              <button type="button" on:click={() => executeDeleteChats(true)} style="width: 100%; padding: 12px; border-radius: 14px; background: #EF4444; color: #fff; border: none; font-weight: 800; font-size: 13px; cursor: pointer;">🔥 Удалить у обоих</button>
                          {/if}
                          <button type="button" on:click={() => deleteChatsModalTargets = []} style="width: 100%; padding: 10px; border-radius: 14px; background: transparent; color: #9CA3AF; border: none; font-size: 13px; cursor: pointer;">Отмена</button>
                      </div>
                  </div>
              </div>
          {/if}
          """
              if "deleteChatsModalTargets.length > 0" not in sb:
                  sb = sb.replace("<style>", del_modal_html + "\n<style>", 1)

              with open(sb_path, "w", encoding="utf-8") as f:
                  f.write(sb)
              print("[OK] 4. Sidebar.svelte: мультивыбор чатов, удаление у обоих и родная камера для Сторис готовы")

          # 5. App.svelte: контекстное меню "Удалить контакт" открывает модалку "У меня / У обоих"
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()
              ap = re.sub(
                  r'<div class="context-item danger" on:click=\{async \(\) => \{[\s\S]*?Удалить контакт</div>',
                  '''<div class="context-item danger" on:click={() => {
                          const target = contextMenu.contact;
                          contextMenu.show = false;
                          if (target && window.__openDeleteChatConfirmModal) {
                              window.__openDeleteChatConfirmModal(target);
                          }
                      }}>Удалить диалог</div>''',
                  ap,
                  count=1
              )
              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 5. App.svelte: удаление диалога подключено к выбору 'У меня / У обоих'")
          PYEOF
          python3 fix_v340.py
          rm -f fix_v340.py
          gofmt -w internal/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.4.0 Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.4.0: Coturn TURN calls, native Android camera, multi-select chats & delete dialog for both [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.4.0-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
