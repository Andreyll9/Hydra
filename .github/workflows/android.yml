name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean Audit & Synchronization of Go Core and Svelte Components (v2.9.5-hydra)
        run: |
          cat << 'PYEOF' > clean_audit_v295.py
          import os, re, shutil

          # 0. Гарантируем фирменную иконку щита Гидры (logo.png)
          real_hydra_logo = "frontend/src/assets/images/logo.png"
          if os.path.exists(real_hydra_logo):
              for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      dst = f"android/app/src/main/res/{mip}/{fname}"
                      os.makedirs(os.path.dirname(dst), exist_ok=True)
                      shutil.copyfile(real_hydra_logo, dst)

          # 1. internal/network/messenger/messenger.go:
          ms_path = "internal/network/messenger/messenger.go"
          if os.path.exists(ms_path):
              with open(ms_path, "r", encoding="utf-8") as f:
                  ms = f.read()
              ms = ms.replace("len(textMsg.Content) > 4096", "len(textMsg.Content) > 15*1024*1024")
              with open(ms_path, "w", encoding="utf-8") as f:
                  f.write(ms)
              print("[OK] 1. messenger.go: лимит сообщения 15 МБ проверен")

          # 2. internal/appcore/messages.go:
          msg_path = "internal/appcore/messages.go"
          if os.path.exists(msg_path):
              with open(msg_path, "r", encoding="utf-8") as f:
                  mc = f.read()

              dup_block = """	// Технические пакеты WebRTC (CALL_ANSWER / CALL_ICE / GROUP_INVITE) не сохраняем как текстовые пузыри в истории чата
          	if strings.HasPrefix(text, "[HYDRA_CALL_ANSWER]:") || strings.HasPrefix(text, "[HYDRA_CALL_ICE]:") || strings.HasPrefix(text, "[HYDRA_GROUP_INVITE]:") {
          		return nil
          	}
          	if strings.HasPrefix(text, "[HYDRA_CALL_ANSWER]:") || strings.HasPrefix(text, "[HYDRA_CALL_ICE]:") || strings.HasPrefix(text, "[HYDRA_GROUP_INVITE]:") || strings.HasPrefix(text, "[HYDRA_DEL_MSG]:") || strings.HasPrefix(text, "[HYDRA_READ_ACK]:") || strings.HasPrefix(text, "[HYDRA_STORY_SYNC]:") || strings.HasPrefix(text, "[HYDRA_REACT]:") {
          		return nil
          	}"""

              clean_filter_block = """	// Технические пакеты (WebRTC, синхронизация историй, реакций, удалений и участников групп) не сохраняем как пузыри в чате
          	for _, prefix := range []string{
          		"[HYDRA_CALL_ANSWER]:",
          		"[HYDRA_CALL_ICE]:",
          		"[HYDRA_GROUP_INVITE]:",
          		"[HYDRA_GROUP_MEMBERS]:",
          		"[HYDRA_DEL_MSG]:",
          		"[HYDRA_READ_ACK]:",
          		"[HYDRA_STORY_SYNC]:",
          		"[HYDRA_REACT]:",
          	} {
          		if strings.HasPrefix(text, prefix) {
          			return nil
          		}
          	}"""

              mc = mc.replace(dup_block, clean_filter_block)
              with open(msg_path, "w", encoding="utf-8") as f:
                  f.write(mc)
              print("[OK] 2. messages.go: очищены дубли фильтрации технических пакетов!")

          # 3. internal/appcore/appcore.go:
          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              old_group_invite_block = """	msg.ChatID = contact.ChatID

          	if strings.HasPrefix(msg.Content, "[HYDRA_GROUP_INVITE]:") {
          		parts := strings.SplitN(strings.TrimPrefix(msg.Content, "[HYDRA_GROUP_INVITE]:"), "|", 2)
          		if len(parts) == 2 {
          			_, _ = a.AddContact(parts[0], parts[1])
          			msg.Content = "🎟️ Вас добавили в «" + parts[0] + "»"
          		}
          	}"""

              new_all_signals_block = """	msg.ChatID = contact.ChatID

          	if strings.HasPrefix(msg.Content, "[HYDRA_DEL_MSG]:") {
          		targetMsgID := strings.TrimSpace(strings.TrimPrefix(msg.Content, "[HYDRA_DEL_MSG]:"))
          		if targetMsgID != "" && a.Repo != nil {
          			_ = a.Repo.DeleteMessage(a.Ctx, targetMsgID)
          			a.Emitter.Emit("remote_message_deleted", targetMsgID)
          		}
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_READ_ACK]:") {
          		a.Emitter.Emit("remote_chat_read", contact.ChatID)
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_REACT]:") {
          		a.Emitter.Emit("remote_reaction", strings.TrimPrefix(msg.Content, "[HYDRA_REACT]:"))
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_STORY_SYNC]:") {
          		storyJson := strings.TrimPrefix(msg.Content, "[HYDRA_STORY_SYNC]:")
          		a.Emitter.Emit("remote_story_received", map[string]interface{}{
          			"author": contact.Nickname,
          			"pub":    senderPubKey,
          			"data":   storyJson,
          		})
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_GROUP_MEMBERS]:") {
          		a.Emitter.Emit("remote_group_members", strings.TrimPrefix(msg.Content, "[HYDRA_GROUP_MEMBERS]:"))
          		return
          	}
          	if strings.HasPrefix(msg.Content, "[HYDRA_GROUP_INVITE]:") {
          		parts := strings.SplitN(strings.TrimPrefix(msg.Content, "[HYDRA_GROUP_INVITE]:"), "|", 3)
          		if len(parts) >= 2 {
          			grpInfo, _ := a.AddContact(parts[0], parts[1])
          			if len(parts) == 3 && grpInfo != nil {
          				a.Emitter.Emit("remote_group_members", grpInfo.ID+"|"+parts[2])
          			}
          			msg.Content = "🎟️ Вас добавили в «" + parts[0] + "»"
          		}
          	}"""

              ac = ac.replace(old_group_invite_block, new_all_signals_block)

              ac = ac.replace(
                  """							if len(seenIDs) > 1000 {
          								seenIDs = make(map[string]bool)
          							}
          							if len(seenIDs) > 1000 {
          								seenIDs = make(map[string]bool)
          							}""",
                  """							if len(seenIDs) > 1000 {
          								seenIDs = make(map[string]bool)
          							}"""
              )

              old_poll_end = """				resp.Body.Close()
          			}
          		}
          		time.Sleep(2 * time.Second)"""

              new_poll_end = """				resp.Body.Close()
          			}
          			if contactsList, errC := a.Repo.ListContacts(a.Ctx); errC == nil {
          				for _, grp := range contactsList {
          					if strings.HasPrefix(grp.I2PAddress, "SFlEUkFfUk9PTV") {
          						gResp, gErr := client.Get("http://191.223.137.164:8085/relay/poll?pub=" + url.QueryEscape(grp.I2PAddress))
          						if gErr == nil && gResp != nil {
          							if gResp.StatusCode == http.StatusOK {
          								var gItems []map[string]interface{}
          								if json.NewDecoder(gResp.Body).Decode(&gItems) == nil {
          									for _, item := range gItems {
          										mID, _ := item["id"].(string)
          										fromPub, _ := item["from"].(string)
          										fromNick, _ := item["from_nick"].(string)
          										content, _ := item["content"].(string)
          										if mID == "" || fromPub == myPub || seenIDs[mID] {
          											continue
          										}
          										seenIDs[mID] = true
          										displayContent := content
          										if fromNick != "" && !strings.HasPrefix(content, "[HYDRA_") {
          											displayContent = "**" + fromNick + ":** " + content
          										}
          										gMsg := &core.Message{
          											ID:          mID,
          											ChatID:      grp.ChatID,
          											SenderID:    grp.PublicKey,
          											SenderAddr:  grp.I2PAddress,
          											Content:     displayContent,
          											ContentType: "text",
          											Status:      core.MessageStatusDelivered,
          											IsOutgoing:  false,
          											Timestamp:   time.Now().UnixMilli(),
          											CreatedAt:   time.Now(),
          											UpdatedAt:   time.Now(),
          										}
          										a.OnMessageReceived(gMsg, grp.PublicKey, grp.I2PAddress)
          									}
          								}
          							}
          							gResp.Body.Close()
          						}
          					}
          				}
          			}
          		}
          		time.Sleep(2 * time.Second)"""

              ac = ac.replace(old_poll_end, new_poll_end)

              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] 3. appcore.go: добавлена синхронизация Историй, реакций, удалений и опрос очередей Групп/Каналов!")

          # 4. frontend/src/components/Sidebar.svelte:
          sb_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sb_path):
              with open(sb_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              old_pub_st = """        localStorage.setItem('hydra_stories_v1', JSON.stringify(hydraStories));
                  if (window.__addHydraLog) window.__addHydraLog('STORY-PUB', 'Опубликована новая история на 24 часа');"""

              new_pub_st = """        localStorage.setItem('hydra_stories_v1', JSON.stringify(hydraStories));
                  const publishedStory = hydraStories[0];
                  (contacts || []).forEach(c => {
                      if (c && c.ID && !c.IsFavorites && !String(c.Nickname || '').startsWith('👥') && !String(c.Nickname || '').startsWith('📢')) {
                          AppActions.SendText(c.ID, '[HYDRA_STORY_SYNC]:' + JSON.stringify(publishedStory), '').catch(() => {});
                      }
                  });
                  if (window.__addHydraLog) window.__addHydraLog('STORY-PUB', 'Опубликована и разослана контактам новая История на 24ч');"""

              sb = sb.replace(old_pub_st, new_pub_st)

              remote_story_hook = """
              EventsOn('remote_story_received', (payload) => {
                  if (!payload || !payload.data) return;
                  try {
                      const stObj = JSON.parse(payload.data);
                      stObj.author = payload.author || stObj.author || 'Контакт';
                      loadHydraStories();
                      if (!hydraStories.some(s => s.id === stObj.id)) {
                          hydraStories = [stObj, ...hydraStories];
                          localStorage.setItem('hydra_stories_v1', JSON.stringify(hydraStories));
                      }
                  } catch (e) {}
              });
              """
              if "remote_story_received" not in sb:
                  sb = sb.replace("loadHydraStories();", "loadHydraStories();\n" + remote_story_hook, 1)

              with open(sb_path, "w", encoding="utf-8") as f:
                  f.write(sb)
              print("[OK] 4. Sidebar.svelte: включена сетевая отправка и приём Историй между телефонами!")

          # 5. frontend/src/components/Auth.svelte:
          au_path = "frontend/src/components/Auth.svelte"
          if os.path.exists(au_path):
              with open(au_path, "r", encoding="utf-8") as f:
                  au = f.read()

              old_create_tile = """            <div 
                          class="profile-item add-profile" 
                          role="button"
                          tabindex="0"
                          on:click={startCreateProfile}
                          on:keydown={(e) => (e.key === 'Enter' || e.key === ' ') && startCreateProfile()}
                      >
                        <div class="plus-icon">+</div>
                        <div class="add-text">Создать</div>
                      </div>"""

              new_create_tile = """            {#if allProfiles.length === 0}
                        <div 
                            class="profile-item add-profile" 
                            role="button"
                            tabindex="0"
                            on:click={startCreateProfile}
                            on:keydown={(e) => (e.key === 'Enter' || e.key === ' ') && startCreateProfile()}
                        >
                          <div class="plus-icon">+</div>
                          <div class="add-text">Создать</div>
                        </div>
                      {/if}"""

              if "{#if allProfiles.length === 0}" not in au:
                  au = au.replace(old_create_tile, new_create_tile)

              with open(au_path, "w", encoding="utf-8") as f:
                  f.write(au)
              print("[OK] 5. Auth.svelte: кнопка '+ Создать' на главном экране скрыта, если профиль уже создан!")

          # 6. frontend/src/components/Settings.svelte (БЕЗ лишнего закрывающего </div>!):
          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()

              st = st.replace("AppActions.CopyToClipboard(", "AppActions.ClipboardSet(")

              priv_vars_js = """
              let groupInviteFriendsOnly = localStorage.getItem('hydra_group_friends_only') === '1';
              let flagSecureEnabled = localStorage.getItem('hydra_flag_secure') === '1';
              function toggleGroupInviteFriendsOnly() {
                  groupInviteFriendsOnly = !groupInviteFriendsOnly;
                  localStorage.setItem('hydra_group_friends_only', groupInviteFriendsOnly ? '1' : '0');
              }
              function toggleFlagSecureSetting() {
                  flagSecureEnabled = !flagSecureEnabled;
                  localStorage.setItem('hydra_flag_secure', flagSecureEnabled ? '1' : '0');
                  if (window.HydraNative && typeof window.HydraNative.setScreenshotProtection === 'function') {
                      window.HydraNative.setScreenshotProtection(flagSecureEnabled);
                  }
              }
              """
              if "let groupInviteFriendsOnly =" not in st:
                  st = st.replace("let hideLastSeenEnabled =", priv_vars_js + "\n    let hideLastSeenEnabled =", 1)

              target_card_anchor = """        <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">🕒 Скрывать точное время входа</div>"""

              balanced_priv_cards = """        <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">👥 Кто может добавлять меня в группы</div>
                              <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">{groupInviteFriendsOnly ? 'Только мои контакты (друзья)' : 'Все пользователи Hydra'}</div>
                          </div>
                          <input type="checkbox" checked={groupInviteFriendsOnly} on:change={toggleGroupInviteFriendsOnly} style="width: 22px; height: 22px; accent-color: #1D4ED8; flex-shrink: 0;" />
                      </div>
                  </div>

                  <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">🔒 Запрет скриншотов и записи экрана</div>
                              <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">Аппаратная защита окна приложения (FLAG_SECURE)</div>
                          </div>
                          <input type="checkbox" checked={flagSecureEnabled} on:change={toggleFlagSecureSetting} style="width: 22px; height: 22px; accent-color: #1D4ED8; flex-shrink: 0;" />
                      </div>
                  </div>

          """ + target_card_anchor

              if "Кто может добавлять меня в группы" not in st:
                  st = st.replace(target_card_anchor, balanced_priv_cards, 1)

              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] 6. Settings.svelte: все теги сбалансированы, ClipboardSet исправлен, тумблеры добавлены!")

          # 7. frontend/src/components/Chat.svelte:
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              ch = ch.replace(
                  """    function cycleDisappearingTimer() {
                  toggleAndSaveDisappearingTimer();
                  return;
                  if (disappearingTimer === 0) disappearingTimer = 60;
                  else if (disappearingTimer === 60) disappearingTimer = 3600;
                  else disappearingTimer = 0;
              }""",
                  """    function cycleDisappearingTimer() {
                  toggleAndSaveDisappearingTimer();
              }"""
              )

              old_invite_fn = """    async function inviteContactToGroup(targetContact) {
                  if (!selectedContact || !targetContact) return;
                  const invitePayload = `[HYDRA_GROUP_INVITE]:${selectedContact.Nickname}|${selectedContact.I2PAddress}`;
                  try {
                      await AppActions.SendText(targetContact.ID, invitePayload, '');
                      if (!currentGroupMembers.includes(targetContact.Nickname)) {
                          currentGroupMembers = [...currentGroupMembers, targetContact.Nickname];
                          localStorage.setItem('hydra_group_members_' + selectedContact.ID, JSON.stringify(currentGroupMembers));
                      }
                      alert(`✅ Пользователь ${targetContact.Nickname} добавлен в «${selectedContact.Nickname}»!`);
                  } catch (e) {
                      alert('Ошибка отправки приглашения: ' + e);
                  }
              }"""

              new_invite_fn = """    async function inviteContactToGroup(targetContact) {
                  if (!selectedContact || !targetContact) return;
                  if (!currentGroupMembers.includes(targetContact.Nickname)) {
                      currentGroupMembers = [...currentGroupMembers, targetContact.Nickname];
                      localStorage.setItem('hydra_group_members_' + selectedContact.ID, JSON.stringify(currentGroupMembers));
                  }
                  const membersStr = currentGroupMembers.join(', ');
                  const invitePayload = `[HYDRA_GROUP_INVITE]:${selectedContact.Nickname}|${selectedContact.I2PAddress}|${membersStr}`;
                  try {
                      await AppActions.SendText(targetContact.ID, invitePayload, '');
                      alert(`✅ Пользователь ${targetContact.Nickname} добавлен в «${selectedContact.Nickname}»!`);
                  } catch (e) {
                      alert('Ошибка отправки приглашения: ' + e);
                  }
              }"""
              ch = ch.replace(old_invite_fn, new_invite_fn)

              remote_grp_hook = """
              EventsOn('remote_group_members', (raw) => {
                  const [gId, membersCsv] = String(raw || '').split('|');
                  if (gId && membersCsv) {
                      const arr = membersCsv.split(',').map(s => s.trim()).filter(Boolean);
                      localStorage.setItem('hydra_group_members_' + gId, JSON.stringify(arr));
                      if (selectedContact && selectedContact.ID === gId) {
                          currentGroupMembers = arr;
                      }
                  }
              });
              """
              if "remote_group_members" not in ch:
                  ch = ch.replace("EventsOn('remote_reaction',", remote_grp_hook + "\n    EventsOn('remote_reaction',", 1)

              ch = ch.replace(
                  "if (c.startsWith('[HYDRA_CALL_RING]:')) {",
                  """if (c.startsWith('[HYDRA_CALL_RING]:')) {
                      const bUntil = Number(localStorage.getItem('hydra_block_until_' + (sig.contact_id || selectedContact?.ID)) || 0);
                      if (bUntil > Date.now()) return;"""
              )

              old_contact_row = """                    {#each allExistingContactsForGroup as c}
                                  <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #121316; border-radius: 12px;">
                                      <span style="font-size: 13px; color: #E5E7EB; font-weight: 600;">{c.Nickname}</span>
                                      <button type="button" on:click={() => inviteContactToGroup(c)} style="background: #1E3A8A; color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); border-radius: 100px; padding: 5px 12px; font-size: 11px; font-weight: 700;">+ Добавить</button>
                                  </div>
                              {/each}"""

              new_contact_row = """                    {#each allExistingContactsForGroup as c}
                                  <div style="display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: #121316; border-radius: 12px;">
                                      <span style="font-size: 13px; color: #E5E7EB; font-weight: 600;">{c.Nickname}</span>
                                      {#if currentGroupMembers.includes(c.Nickname)}
                                          <span style="color: #10B981; font-size: 12px; font-weight: 800; padding: 4px 10px;">✅ Добавлен</span>
                                      {:else}
                                          <button type="button" on:click={() => inviteContactToGroup(c)} style="background: #1E3A8A; color: #60A5FA; border: 1px solid rgba(59,130,246,0.3); border-radius: 100px; padding: 5px 12px; font-size: 11px; font-weight: 700; cursor: pointer;">+ Добавить</button>
                                      {/if}
                                  </div>
                              {/each}"""
              ch = ch.replace(old_contact_row, new_contact_row)

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 7. Chat.svelte: очищен мёртвый код, синхронизированы участники групп и проверка блокировки при звонке!")
          PYEOF
          python3 clean_audit_v295.py
          rm -f clean_audit_v295.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Audited Hydra v2.9.5 Build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Release Hydra v2.9.5: Clean audited Go core & Svelte components, Group relay polling, Story sync & 2-profile limit [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
