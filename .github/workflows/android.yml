name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply All 8 Fixes Safely Without Breaking Braces in messages.go
        run: |
          cat << 'PYEOF' > fix_all_safe.py
          import os, re

          # 1. MainActivity.kt: пропуск блокировки при открытии Галереи + сохранение логов в файл Downloads
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              if "private var isOpeningSystemPicker = false" not in kt:
                  kt = kt.replace(
                      "private var webViewFileCallback: ValueCallback<Array<Uri>>? = null",
                      "private var webViewFileCallback: ValueCallback<Array<Uri>>? = null\n    private var isOpeningSystemPicker = false"
                  )

              save_logs_kt = """
                  @JavascriptInterface
                  fun saveLogsToDownloads(logText: String): String {
                      return try {
                          val filename = "hydra_log_${System.currentTimeMillis()}.txt"
                          val resolver = applicationContext.contentResolver
                          val cv = android.content.ContentValues().apply {
                              put(android.provider.MediaStore.MediaColumns.DISPLAY_NAME, filename)
                              put(android.provider.MediaStore.MediaColumns.MIME_TYPE, "text/plain")
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                                  put(android.provider.MediaStore.MediaColumns.RELATIVE_PATH, android.os.Environment.DIRECTORY_DOWNLOADS)
                              }
                          }
                          val uri = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              resolver.insert(android.provider.MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv)
                          } else {
                              resolver.insert(android.provider.MediaStore.Files.getContentUri("external"), cv)
                          }
                          if (uri != null) {
                              resolver.openOutputStream(uri)?.use { it.write(logText.toByteArray(Charsets.UTF_8)) }
                              runOnUiThread {
                                  android.widget.Toast.makeText(this@MainActivity, "✅ Лог сохранён в Загрузки: $filename", android.widget.Toast.LENGTH_LONG).show()
                              }
                              pushNativeLog("LOG-FILE", "Сохранено в Downloads/$filename")
                              filename
                          } else "error"
                      } catch (e: Exception) {
                          pushNativeLog("LOG-ERR", "Ошибка записи файла: ${e.message}")
                          "error"
                      }
                  }
              """
              if "fun saveLogsToDownloads(" not in kt:
                  kt = kt.replace("inner class HydraNativeBridge {", "inner class HydraNativeBridge {\n" + save_logs_kt, 1)

              kt = kt.replace("filePickerLauncher.launch(intent)", "isOpeningSystemPicker = true\n                filePickerLauncher.launch(intent)")
              kt = kt.replace(
                  'webViewFileChooserLauncher.launch(Intent.createChooser(intent, "Выберите изображение или QR-код"))',
                  'isOpeningSystemPicker = true\n                        webViewFileChooserLauncher.launch(Intent.createChooser(intent, "Выберите изображение или QR-код"))'
              )

              old_pr = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  pushNativeLog("LIFECYCLE", "Приложение развёрнуто (onResume) — проверка безопасности и биометрии")
                  webView.evaluateJavascript("if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
              }

              override fun onPause() {
                  pushNativeLog("LIFECYCLE", "Приложение свёрнуто (onPause) — мгновенная блокировка сессии!")
                  webView.evaluateJavascript("if(window.__lockHydraNow) window.__lockHydraNow();", null)
                  webView.onPause()
                  super.onPause()
              }"""

              new_pr = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  if (isOpeningSystemPicker) {
                      isOpeningSystemPicker = false
                      pushNativeLog("LIFECYCLE", "Возврат из Галереи (без блокировки)")
                      return
                  }
                  pushNativeLog("LIFECYCLE", "Приложение развёрнуто (onResume)")
                  webView.evaluateJavascript("if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
              }

              override fun onPause() {
                  if (!isOpeningSystemPicker) {
                      pushNativeLog("LIFECYCLE", "Приложение свёрнуто (onPause) — блокировка!")
                      webView.evaluateJavascript("if(window.__lockHydraNow) window.__lockHydraNow();", null)
                  }
                  webView.onPause()
                  super.onPause()
              }"""
              kt = kt.replace(old_pr, new_pr)
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 1. MainActivity.kt обновлён")

          # 2. Сетевой движок Go (internal/appcore/messages.go и contacts.go) БЕЗ слома скобок!
          #    Вместо удаления блоков if/else просто подставляем PublicKey = I2PAddress ДО проверки!
          for root, _, files in os.walk("internal"):
              for fn in files:
                  if not fn.endswith(".go"):
                      continue
                  fp = os.path.join(root, fn)
                  with open(fp, "r", encoding="utf-8") as f:
                      gc = f.read()
                  orig = gc

                  # Безопасная однострочная подстановка: если PublicKey пуст, сразу копируем в него I2PAddress ПЕРЕД проверкой!
                  gc = gc.replace(
                      'if contact.PublicKey == "" {',
                      'if contact.PublicKey == "" && contact.I2PAddress != "" { contact.PublicKey = contact.I2PAddress }\n\tif contact.PublicKey == "" {'
                  )
                  gc = gc.replace(
                      'if c.PublicKey == "" {',
                      'if c.PublicKey == "" && c.I2PAddress != "" { c.PublicKey = c.I2PAddress }\n\tif c.PublicKey == "" {'
                  )
                  # И сокращаем ожидание с 60 секунд до 2 секунд на случай резервного пути
                  gc = gc.replace("60 * time.Second", "2 * time.Second")

                  if "func (a *AppCore) AddContact(" in gc:
                      gc = gc.replace('PublicKey:  "",', 'PublicKey:  cleanDest,')
                      gc = re.sub(r'(I2PAddress:\s*([a-zA-Z0-9_]+),\s*\n\s*PublicKey:\s*)""', r'\1\2', gc)

                  if gc != orig:
                      with open(fp, "w", encoding="utf-8") as f:
                          f.write(gc)
                      print("[OK] 2. Безопасно обновлён сетевой модуль:", fp)

          # 3. App.svelte: чиним ReferenceError: isAuthenticated is not defined
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()
              ap = ap.replace("if (isAuthenticated) {\n                isAuthenticated = false;", "if (typeof isLoggedIn !== 'undefined' && isLoggedIn) {\n                isLoggedIn = false;")
              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 3. App.svelte обновлён")

          # 4. Settings.svelte: кнопка "💾 В файл (.txt)" + выравнивание отступов
          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()
              if "function saveSettingsLogsToFile()" not in st:
                  save_js = """
              function saveSettingsLogsToFile() {
                  const text = (settingsLogLines || []).join('\\n');
                  if (!text) return alert('Журнал пуст');
                  if (window.HydraNative && typeof window.HydraNative.saveLogsToDownloads === 'function') {
                      window.HydraNative.saveLogsToDownloads(text);
                  }
              }
              """
                  st = st.replace("function copySettingsLogs() {", save_js + "\n    function copySettingsLogs() {", 1)
              st = st.replace(
                  '<button type="button" on:click={copySettingsLogs} style="background: #8AB4F8; color: #062E6F; border: none; border-radius: 100px; padding: 5px 12px; font-size: 11px; font-weight: 700;">📋 Копировать всё</button>',
                  '<button type="button" on:click={saveSettingsLogsToFile} style="background: #4CAF50; color: #fff; border: none; border-radius: 100px; padding: 6px 12px; font-size: 11px; font-weight: 700;">💾 В файл (.txt)</button>\n                                            <button type="button" on:click={copySettingsLogs} style="background: #8AB4F8; color: #062E6F; border: none; border-radius: 100px; padding: 6px 12px; font-size: 11px; font-weight: 700;">📋 Копировать</button>'
              )
              st = st.replace(
                  '.settings-content-area { flex: 1; padding: 40px; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; }',
                  '.settings-content-area { flex: 1; padding: 24px 16px 90px; overflow-y: auto; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box; }'
              )
              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] 4. Settings.svelte обновлён")

          # 5. Sidebar.svelte: убираем горизонтальный скролл и сокращаем длинные ключи в именах контактов
          sb_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sb_path):
              with open(sb_path, "r", encoding="utf-8") as f:
                  sb = f.read()
              if "function formatContactDisplayName(" not in sb:
                  fmt_js = """
              function formatContactDisplayName(name) {
                  if (!name) return 'Неизвестный';
                  const s = String(name).trim();
                  if (s.length > 22 && !s.includes(' ')) return '👤 Контакт (' + s.slice(0, 6) + '…' + s.slice(-4) + ')';
                  return s;
              }
              """
                  sb = sb.replace("</script>", fmt_js + "\n</script>", 1)
              sb = sb.replace("{contact.Nickname}", "{formatContactDisplayName(contact.Nickname)}")
              css_fix = """
              .mobile-sidebar, .contacts-list, .mobile-contacts { max-width: 100vw !important; overflow-x: hidden !important; box-sizing: border-box !important; }
              .contact-item { max-width: calc(100% - 16px) !important; overflow: hidden !important; box-sizing: border-box !important; }
              .contact-name { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; max-width: 210px !important; }
              """
              if "max-width: 210px !important;" not in sb:
                  sb = sb.replace("</style>", css_fix + "\n</style>", 1)
              with open(sb_path, "w", encoding="utf-8") as f:
                  f.write(sb)
              print("[OK] 5. Sidebar.svelte обновлён")

          # 6. Modals.svelte: живая камера для QR-сканера + резолв @ника при добавлении контакта
          md_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(md_path):
              with open(md_path, "r", encoding="utf-8") as f:
                  md = f.read()
              old_add = "const handleAddContact = () => {\n        onAddContact();\n    };"
              new_add = """const handleAddContact = async () => {
                  const rawAddr = (addContactAddress || '').trim();
                  if (rawAddr.startsWith('@') || (rawAddr.length >= 3 && rawAddr.length <= 24 && !rawAddr.includes('/'))) {
                      const cleanNick = rawAddr.replace(/^@/, '').toLowerCase();
                      if (!addContactName.trim()) addContactName = '@' + cleanNick;
                      try {
                          const r = await fetch('http://191.223.137.164:8085/nick/resolve?nick=' + encodeURIComponent(cleanNick));
                          if (r.ok) {
                              const d = await r.json();
                              if (d && d.pub_key) addContactAddress = d.pub_key;
                          }
                      } catch (e) {}
                  } else if (!addContactName.trim() || addContactName.trim().length > 22) {
                      addContactName = 'Контакт ' + rawAddr.slice(0, 6);
                  }
                  onAddContact();
              };"""
              md = md.replace(old_add, new_add)

              i1 = md.find("<!-- Add Contact Modal -->")
              i2 = md.find("<!-- Show Seed Modal -->", i1) if i1 != -1 else -1
              if i1 != -1 and i2 != -1:
                  new_modal = """<!-- Add Contact Modal -->
          {#if showAddContact}
          <div class="modal-backdrop animate-fade-in" role="button" tabindex="0" on:click|self={() => { stopLiveQRScanner(); onCancelAddContact(); }} on:keydown={(e) => e.key === 'Escape' && onCancelAddContact()}>
              <div class="modal-content animate-slide-down" style="max-width: 440px;">
                  <div class="modal-header">
                      <h3>Добавить контакт</h3>
                      <button class="btn-icon" on:click={() => { stopLiveQRScanner(); onCancelAddContact(); }}><div class="icon-svg">{@html Icons.X}</div></button>
                  </div>
                  <div class="modal-body">
                      <div class="form-group">
                          <label class="form-label">Имя или @никнейм друга
                              <input type="text" bind:value={addContactName} class="input-field" placeholder="Напр: @fity или Андрей" />
                          </label>
                      </div>
                      <div class="form-group" style="margin-top: 14px;">
                          <label class="form-label">ID ключ Hydra или @никнейм
                              <textarea bind:value={addContactAddress} class="input-field" rows="2" placeholder="Вставьте @никнейм или отсканируйте QR-код..."></textarea>
                          </label>
                      </div>
                      <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">
                          <div style="display: flex; gap: 8px;">
                              <button type="button" on:click={startLiveQRScanner} style="flex: 1; padding: 12px; border-radius: 100px; background: {isLiveScanningQR ? '#ff4757' : '#8AB4F8'}; color: {isLiveScanningQR ? '#fff' : '#062E6F'}; border: none; font-weight: 800; font-size: 12px; cursor: pointer;">
                                  {isLiveScanningQR ? '⏹ Выключить камеру' : '📷 Сканировать QR камерой'}
                              </button>
                              <label style="padding: 12px 14px; border-radius: 100px; background: #28292D; color: #8AB4F8; border: 1px solid rgba(138,180,248,0.35); font-weight: 700; font-size: 12px; cursor: pointer; display: flex; align-items: center;">
                                  🖼 Галерея
                                  <input type="file" accept="image/*" style="display: none;" on:change={handleScanQRFile} />
                              </label>
                          </div>
                          {#if qrStatusMsg}
                              <div style="font-size: 12px; color: #8AB4F8; text-align: center; font-weight: 600;">{qrStatusMsg}</div>
                          {/if}
                          {#if isLiveScanningQR}
                              <div style="position: relative; width: 230px; height: 230px; margin: 6px auto; border-radius: 22px; overflow: hidden; border: 3px solid #8AB4F8; background: #000;">
                                  <video bind:this={qrVideoEl} autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
                                  <div style="position: absolute; inset: 30px; border: 2px dashed #8AB4F8; border-radius: 16px; pointer-events: none;"></div>
                              </div>
                          {/if}
                      </div>
                  </div>
                  <div class="modal-footer">
                      <button class="btn-small btn-glass" on:click={() => { stopLiveQRScanner(); onCancelAddContact(); }}>Отмена</button>
                      <button class="btn-small btn-primary clickable-btn" on:click={() => { stopLiveQRScanner(); handleAddContact(); }}>Добавить</button>
                  </div>
              </div>
          </div>
          {/if}
          """
                  md = md[:i1] + new_modal + md[i2:]
              with open(md_path, "w", encoding="utf-8") as f:
                  f.write(md)
              print("[OK] 6. Modals.svelte обновлён")

          # 7. Chat.svelte: идеально круглые видео-кружки как в Telegram
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()
              old_c = """{:else if msg.Content && msg.Content.startsWith('[HYDRA_CIRCLE]:')}
                              <div style="padding: 4px 0; display: flex; flex-direction: column; align-items: center;">
                                  <video controls playsinline src={msg.Content.slice('[HYDRA_CIRCLE]:'.length)} style="width: 200px; height: 200px; border-radius: 50%; object-fit: cover; border: 3px solid #8AB4F8; background: #000;"></video>
                                  <span style="font-size: 11px; opacity: 0.75; margin-top: 4px;">📹 Видео-кружок E2EE</span>
                              </div>"""
              new_c = """{:else if msg.Content && msg.Content.startsWith('[HYDRA_CIRCLE]:')}
                              <div style="padding: 4px; display: flex; flex-direction: column; align-items: center;">
                                  <div style="width: 210px; height: 210px; border-radius: 50% !important; overflow: hidden !important; clip-path: circle(50% at 50% 50%) !important; -webkit-clip-path: circle(50% at 50% 50%) !important; border: 3px solid #8AB4F8; background: #000; position: relative; display: flex; align-items: center; justify-content: center;">
                                      <video playsinline loop src={msg.Content.slice('[HYDRA_CIRCLE]:'.length)} on:click|stopPropagation={(e) => { const v = e.currentTarget; if (v.paused) v.play(); else v.pause(); }} style="width: 100% !important; height: 100% !important; object-fit: cover !important; border-radius: 50% !important; cursor: pointer;"></video>
                                  </div>
                                  <span style="font-size: 11px; opacity: 0.85; margin-top: 6px;">📹 Видео-кружок (нажмите для пуска/паузы)</span>
                              </div>"""
              ch = ch.replace(old_c, new_c)
              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 7. Chat.svelte обновлён")
          PYEOF
          python3 fix_all_safe.py
          rm -f fix_all_safe.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Fixes to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Safely fix handshake timeout in messages.go, save logs to file, skip lock on gallery, live QR camera & round video circles [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
