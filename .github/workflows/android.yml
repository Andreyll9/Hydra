                      </p>

                      {#if !myWifiSubnetIp}
                          <div style="padding: 16px; border-radius: 16px; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #FCA5A5; font-size: 13px; text-align: center; margin-bottom: 14px;">
