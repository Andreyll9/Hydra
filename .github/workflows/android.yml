name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Live Camera QR/Stories, Instant onPause Lock, Startup Visualizer & Settings Logger
        run: |
          cat << 'PYEOF' > apply_stage5_fixes.py
          import os, re

          # 1. MainActivity.kt:
          #    - В onPause() вызываем мгновенную блокировку приложения window.__lockHydraNow()!
          #    - В onResume() обновляем статус разрешений и автоматически запрашиваем сканер отпечатка пальца!
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              old_lifecycle = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
              }

              override fun onPause() {
                  webView.onPause()
                  super.onPause()
              }"""

              new_lifecycle = """    override fun onResume() {
                  super.onResume()
                  webView.onResume()
                  mobile.Mobile.setPlatformBridge(this)
                  pushNativeLog("LIFECYCLE", "Приложение развёрнуто (onResume) — проверка безопасности и биометрии")
                  webView.evaluateJavascript("if(window.__onHydraAppResume) window.__onHydraAppResume();", null)
              }

              override fun onPause() {
                  pushNativeLog("LIFECYCLE", "Приложение свёрнуто (onPause) — мгновенная блокировка сессии!")
                  webView.evaluateJavascript("if(window.__lockHydraNow) window.__lockHydraNow();", null)
                  webView.onPause()
                  super.onPause()
              }"""

              if "window.__lockHydraNow" not in kt:
                  kt = kt.replace(old_lifecycle, new_lifecycle)
                  with open(kt_path, "w", encoding="utf-8") as f:
                      f.write(kt)
                  print("[OK] MainActivity.kt: мгновенная блокировка при сворачивании (onPause) и авто-проверка при разворачивании (onResume)")

          # 2. frontend/index.html:
          #    - Убираем плавающую кнопку #hydra-debug-btn с экрана (теперь консоль живёт в Настройки -> Сеть и Сервер!)
          #    - Исправляем вывод 'null' в логах на '✅ Выполнено успешно (OK)'
          index_html_path = "frontend/index.html"
          if os.path.exists(index_html_path):
              with open(index_html_path, "r", encoding="utf-8") as f:
                  idx_html = f.read()

              idx_html = re.sub(r'<!-- HYDRA_LOGGER_START -->[\s\S]*?<!-- HYDRA_LOGGER_END -->', '', idx_html)

              clean_logger_html = """<!-- HYDRA_LOGGER_START -->
          <style>
            html, body, #app {
              position: fixed !important;
              inset: 0 !important;
              width: 100% !important;
              height: 100% !important;
              max-height: 100% !important;
              margin: 0 !important;
              padding: 0 !important;
              overflow: hidden !important;
              overscroll-behavior: none !important;
            }
          </style>
          <script>
            (function() {
              if (window.__hydraGlobalLoggerReady) return;
              window.__hydraGlobalLoggerReady = true;
              window.__hydraLogList = [];

              window.__addHydraLog = function(tag, msg) {
                var d = new Date();
                var t = d.toTimeString().split(' ')[0] + '.' + String(d.getMilliseconds()).padStart(3, '0');
                var line = '[' + t + '] [' + tag + '] ' + msg;
                window.__hydraLogList.unshift(line);
                if (window.__hydraLogList.length > 500) window.__hydraLogList.pop();
                window.dispatchEvent(new CustomEvent('hydra-log-updated'));
              };

              document.addEventListener('click', function(e) {
                var t = e.target;
                if (!t) return;
                var el = t.closest ? (t.closest('button, a, input, label, select, [role="button"]') || t) : t;
                var txt = (el.innerText || el.placeholder || el.value || el.className || '').toString().replace(/\\s+/g, ' ').trim().slice(0, 50);
                window.__addHydraLog('UI-CLICK', '<' + (el.tagName || 'EL') + '> "' + txt + '"');
              }, true);

              var origFetch = window.fetch.bind(window);
              window.fetch = async function(url, opts) {
                var u = String(url);
                if (u.indexOf('/api/') !== -1 && u.indexOf('/api/events') === -1 && u.indexOf('AppendDebugLog') === -1 && u.indexOf('GetNetworkStatus') === -1) {
                  var mName = u.split('/api/')[1];
                  var bodyStr = '';
                  try { bodyStr = (opts && opts.body ? String(opts.body) : '').slice(0, 300); } catch(e){}
                  var t0 = Date.now();
                  window.__addHydraLog('RPC-REQ', mName + ' -> ' + (bodyStr || '{}'));
                  try {
                    var resp = await origFetch(url, opts);
                    var clone = resp.clone();
                    var data = await clone.json().catch(function(){ return {}; });
                    var dt = Date.now() - t0;
                    if (!resp.ok || data.error) {
                      var errMsg = data.error || resp.statusText || ('HTTP ' + resp.status);
                      window.__addHydraLog('RPC-ERR', mName + ' (' + dt + ' мс) ❌ ОШИБКА: ' + errMsg);
                      return new Response(JSON.stringify({ result: null, error: errMsg }), {
                        status: 200,
                        headers: { 'Content-Type': 'application/json' }
                      });
                    } else {
                      var resFormatted = '✅ Выполнено успешно (OK)';
                      if (data.result !== null && data.result !== undefined && data.result !== '') {
                        try { resFormatted = JSON.stringify(data.result).slice(0, 400); } catch(e){}
                      }
                      window.__addHydraLog('RPC-OK', mName + ' (' + dt + ' мс) -> ' + resFormatted);
                    }
                    return resp;
                  } catch (err) {
                    window.__addHydraLog('RPC-ERR', mName + ' ❌ СБОЙ СЕТИ: ' + err);
                    throw err;
                  }
                }
                return origFetch(url, opts);
              };

              window.addEventListener('error', function(e) {
                window.__addHydraLog('JS-ERR', e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
              });
              window.addEventListener('unhandledrejection', function(e) {
                window.__addHydraLog('PROMISE-ERR', String(e.reason));
              });
            })();
          </script>
          <!-- HYDRA_LOGGER_END -->"""

              idx_html = idx_html.replace("</body>", clean_logger_html + "\n</body>", 1)
              with open(index_html_path, "w", encoding="utf-8") as f:
                  f.write(idx_html)
              print("[OK] frontend/index.html: убрана плавающая кнопка, исправлен вывод null на '✅ Выполнено успешно (OK)'")

          # 3. App.svelte:
          #    - Подключаем мгновенную блокировку window.__lockHydraNow() при сворачивании приложения (onPause / visibilitychange / blur)!
          app_svelte = "frontend/src/App.svelte"
          if os.path.exists(app_svelte):
              with open(app_svelte, "r", encoding="utf-8") as f:
                  ap = f.read()

              # Удаляем старую плавающую кнопку из App.svelte, если она там была
              ap = re.sub(r'<!-- Плавающая кнопка открытия подробных логов -->[\s\S]*?(?=<style>)', '', ap)

              lock_hook_js = """
              if (typeof window !== 'undefined') {
                  window.__lockHydraNow = () => {
                      if (isAuthenticated) {
                          isAuthenticated = false;
                          showSettings = false;
                          if (window.__addHydraLog) window.__addHydraLog('SECURITY-LOCK', '🔒 Приложение свёрнуто — сессия мгновенно заблокирована!');
                      }
                  };
                  document.addEventListener('visibilitychange', () => {
                      if (document.visibilityState === 'hidden') {
                          window.__lockHydraNow();
                      }
                  });
              }
              """
              if "window.__lockHydraNow =" not in ap:
                  ap = ap.replace("onMount(", lock_hook_js + "\n    onMount(", 1)
                  with open(app_svelte, "w", encoding="utf-8") as f:
                      f.write(ap)
                  print("[OK] App.svelte: подключена мгновенная блокировка сессии при сворачивании (__lockHydraNow)")

          # 4. Auth.svelte:
          #    - Делаем красивую и работающую визуализацию проверки разрешений (Камера, Микрофон, Биометрия) и связи с VPS (мс) НА ВСЕХ ЭКРАНАХ ВХОДА сразу при запуске!
          #    - При разворачивании приложения автоматически запускаем проверку и вызываем сканер отпечатка, если выбран профиль
          auth_path = "frontend/src/components/Auth.svelte"
          if os.path.exists(auth_path):
              with open(auth_path, "r", encoding="utf-8") as f:
                  au = f.read()

              # Находим функцию checkDevicePermissionsAndBio и расширяем её живым пингом сервера + автозапуском в onMount
              a1_marker = "let systemPermStatus = null;"
              a2_marker = "</script>"
              idx1 = au.find(a1_marker)
              idx2 = au.find(a2_marker, idx1) if idx1 != -1 else -1

              if idx1 != -1 and idx2 != -1:
                  new_auth_monitor = """let systemPermStatus = {
                  device: 'Android Device',
                  camera: false,
                  microphone: false,
                  biometricBound: false,
                  serverOnline: false,
                  serverPingMs: 0,
                  checkingServer: true
              };
              let bioPromptStatus = '';

              if (typeof window !== 'undefined') {
                  window.__onBiometricAuthResult = async (success, decryptedPin, message) => {
                      if (success && decryptedPin) {
                          bioPromptStatus = '✅ Отпечаток распознан аппаратно! Выполняется вход...';
                          pinInput = decryptedPin;
                          await handleUnlock();
                      } else {
                          bioPromptStatus = message ? ('ℹ️ ' + message) : '';
                      }
                  };
                  window.__onHydraAppResume = () => {
                      runStartupDiagnostics(selectedProfile?.id || (allProfiles[0]?.id) || 'default');
                      if (authScreen === 'pin' && selectedProfile) {
                          setTimeout(() => triggerBiometricUnlock(), 250);
                      }
                  };
              }

              async function runStartupDiagnostics(profId) {
                  const targetProf = profId || selectedProfile?.id || (allProfiles[0]?.id) || 'default';
                  if (window.HydraNative && typeof window.HydraNative.checkSystemStatus === 'function') {
                      try {
                          const raw = window.HydraNative.checkSystemStatus(targetProf);
                          const parsed = JSON.parse(raw);
                          systemPermStatus = { ...systemPermStatus, ...parsed };
                      } catch (e) {
                          if (window.__addHydraLog) window.__addHydraLog('SYS-CHECK-ERR', String(e));
                      }
                  }
                  systemPermStatus.checkingServer = true;
                  const t0 = Date.now();
                  try {
                      const resp = await fetch('http://191.223.137.164:8085/health?pub=startup', { cache: 'no-store' });
                      const data = await resp.json();
                      const rtt = Date.now() - t0;
                      systemPermStatus.serverOnline = (data && data.status === 'ok');
                      systemPermStatus.serverPingMs = rtt;
                      if (window.__addHydraLog) window.__addHydraLog('STARTUP-NET', `Связь с узлом Hydra: ОНЛАЙН (${rtt} мс)`);
                  } catch (e) {
                      systemPermStatus.serverOnline = false;
                      systemPermStatus.serverPingMs = 0;
                      if (window.__addHydraLog) window.__addHydraLog('STARTUP-NET', 'Узел Hydra недоступен при старте');
                  } finally {
                      systemPermStatus.checkingServer = false;
                      systemPermStatus = { ...systemPermStatus };
                  }
              }

              async function triggerBiometricUnlock() {
                  const profId = selectedProfile?.id || (allProfiles[0]?.id) || 'default';
                  await runStartupDiagnostics(profId);
                  if (localStorage.getItem('hydra_biometric') === '0') return;
                  if (window.HydraNative && typeof window.HydraNative.authenticateBiometric === 'function') {
                      if (!systemPermStatus.biometricBound) {
                          bioPromptStatus = 'ℹ️ Отпечаток ещё не привязан (введите ПИН и привяжите его в Настройки → Приватность)';
                          return;
                      }
                      bioPromptStatus = '👆 Приложите палец к сканеру...';
                      window.HydraNative.authenticateBiometric(profId);
                  }
              }

              setTimeout(() => runStartupDiagnostics('default'), 150);
          """
                  au = au[:idx1] + new_auth_monitor + "</script>" + au[idx2 + len(a2_marker):]

              # Выносим красивую визуализацию диагностики прямо под заголовок Hydra на экране входа, чтобы она была видна ВСЕГДА при запуске!
              au = re.sub(r'\{#if systemPermStatus\}[\s\S]*?\{/if\}\s*\{#if bioPromptStatus\}[\s\S]*?\{/if\}', '', au)

              startup_visualizer_html = """
              <!-- КРАСИВАЯ ВИЗУАЛИЗАЦИЯ ДИАГНОСТИКИ РАЗРЕШЕНИЙ И СЕТИ ПРИ ЗАПУСКЕ -->
              <div style="margin: 0 auto 20px; padding: 12px 14px; border-radius: 18px; background: rgba(18, 19, 26, 0.85); border: 1px solid rgba(138, 180, 248, 0.22); text-align: left; box-shadow: 0 8px 24px rgba(0,0,0,0.35);">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                      <span style="font-size: 11px; font-weight: 800; color: #8AB4F8; letter-spacing: 0.4px; text-transform: uppercase;">🛡️ Диагностика при запуске • {systemPermStatus.device}</span>
                      <button type="button" on:click={() => runStartupDiagnostics(selectedProfile?.id || 'default')} style="background: transparent; border: none; color: #8AB4F8; font-size: 11px; cursor: pointer; padding: 0;">🔄</button>
                  </div>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px;">
                      <div style="padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 6px;">
                          <span style="width: 8px; height: 8px; border-radius: 50%; background: {systemPermStatus.serverOnline ? '#4CAF50' : (systemPermStatus.checkingServer ? '#FFC107' : '#F44336')}; display: inline-block;"></span>
                          <span style="color: #E3E3E3;">Сервер: <b>{systemPermStatus.checkingServer ? 'Пинг...' : (systemPermStatus.serverOnline ? systemPermStatus.serverPingMs + ' мс' : 'Офлайн')}</b></span>
                      </div>
                      <div style="padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 6px;">
                          <span style="width: 8px; height: 8px; border-radius: 50%; background: {systemPermStatus.biometricBound ? '#4CAF50' : '#9E9E9E'}; display: inline-block;"></span>
                          <span style="color: #E3E3E3;">Отпечаток: <b>{systemPermStatus.biometricBound ? 'Активен' : 'Не задан'}</b></span>
                      </div>
                      <div style="padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 6px;">
                          <span style="width: 8px; height: 8px; border-radius: 50%; background: {systemPermStatus.camera ? '#4CAF50' : '#F44336'}; display: inline-block;"></span>
                          <span style="color: #E3E3E3;">Камера: <b>{systemPermStatus.camera ? 'ОК' : 'Нет'}</b></span>
                      </div>
                      <div style="padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.03); display: flex; align-items: center; gap: 6px;">
                          <span style="width: 8px; height: 8px; border-radius: 50%; background: {systemPermStatus.microphone ? '#4CAF50' : '#F44336'}; display: inline-block;"></span>
                          <span style="color: #E3E3E3;">Микрофон: <b>{systemPermStatus.microphone ? 'ОК' : 'Нет'}</b></span>
                      </div>
                  </div>
                  {#if !systemPermStatus.camera || !systemPermStatus.microphone}
                      <button type="button" on:click={() => { window.HydraNative?.requestMissingPermissions(); setTimeout(() => runStartupDiagnostics(selectedProfile?.id || 'default'), 1500); }} style="margin-top: 8px; width: 100%; background: #8AB4F8; color: #062E6F; border: none; border-radius: 100px; padding: 6px; font-size: 11px; font-weight: 700; cursor: pointer;">
                          🔓 Разрешить доступ к Камере и Микрофону
                      </button>
                  {/if}
                  {#if bioPromptStatus}
                      <div style="margin-top: 8px; font-size: 11px; color: #8AB4F8; text-align: center; font-weight: 600;">{bioPromptStatus}</div>
                  {/if}
              </div>
              """
              if "Диагностика при запуске" not in au:
                  au = au.replace('</h1>', '</h1>\n' + startup_visualizer_html, 1)

              with open(auth_path, "w", encoding="utf-8") as f:
                  f.write(au)
              print("[OK] Auth.svelte: добавлена визуальная панель диагностики разрешений и связи при запуске")

          # 5. Settings.svelte:
          #    Подключаем живой журнал логов прямо к переключателю "Логирование в файл — Локальная диагностика сокета" под выбором протокола шифрования!
          settings_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(settings_path):
              with open(settings_path, "r", encoding="utf-8") as f:
                  st = f.read()

              settings_log_js = """
              let settingsLogLines = typeof window !== 'undefined' ? (window.__hydraLogList || []) : [];
              if (typeof window !== 'undefined') {
                  window.addEventListener('hydra-log-updated', () => {
                      settingsLogLines = [...(window.__hydraLogList || [])];
                  });
              }
              function refreshSettingsLogs() {
                  settingsLogLines = [...(window.__hydraLogList || [])];
              }
              function clearSettingsLogs() {
                  if (typeof window !== 'undefined') window.__hydraLogList = [];
                  settingsLogLines = [];
              }
              function copySettingsLogs() {
                  const text = (settingsLogLines || []).join('\\n');
                  AppActions.ClipboardSet(text);
                  alert('✅ Скопировано записей журнала: ' + settingsLogLines.length);
              }
              """
              if "let settingsLogLines =" not in st:
                  st = st.replace("</script>", settings_log_js + "\n</script>", 1)

              # Вставляем панель логов прямо под карточку "Логирование в файл (Локальная диагностика сокета)" во вкладке Сеть и Сервер
              old_log_toggle = """                            <div class="setting-item flex-row bg-box">
                                          <div>
                                              <span class="label">Логирование в файл</span>
                                              <p class="hint">Локальная диагностика сокета</p>
                                          </div>
                                          <input type="checkbox" bind:checked={routerSettings.logToFile} />
                                      </div>"""

              new_log_toggle_and_viewer = """                            <div class="setting-item flex-row bg-box" on:click={() => { routerSettings.logToFile = !routerSettings.logToFile; refreshSettingsLogs(); }} style="cursor: pointer;">
                                          <div>
                                              <span class="label" style="font-weight: 700; color: #E3E3E3;">🐞 Логирование и диагностика сокета</span>
                                              <p class="hint" style="margin: 2px 0 0;">Нажмите, чтобы открыть живой системный журнал ({settingsLogLines.length} записей)</p>
                                          </div>
                                          <input type="checkbox" bind:checked={routerSettings.logToFile} on:change={refreshSettingsLogs} on:click|stopPropagation style="width: 20px; height: 20px; accent-color: #8AB4F8;" />
                                      </div>

                                      {#if routerSettings.logToFile}
                                          <div style="margin-top: 10px; background: #09090D; border: 1px solid rgba(138,180,248,0.3); border-radius: 16px; padding: 12px;">
                                              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; flex-wrap: wrap;">
                                                  <span style="font-size: 12px; font-weight: 800; color: #8AB4F8;">🐞 Живой системный журнал ({settingsLogLines.length})</span>
                                                  <div style="display: flex; gap: 6px;">
                                                      <button type="button" on:click={refreshSettingsLogs} style="background: #28292D; color: #E3E3E3; border: none; border-radius: 100px; padding: 5px 10px; font-size: 11px;">🔄 Обновить</button>
                                                      <button type="button" on:click={copySettingsLogs} style="background: #8AB4F8; color: #062E6F; border: none; border-radius: 100px; padding: 5px 12px; font-size: 11px; font-weight: 700;">📋 Копировать всё</button>
                                                      <button type="button" on:click={clearSettingsLogs} style="background: rgba(255,71,87,0.2); color: #ff6b6b; border: none; border-radius: 100px; padding: 5px 10px; font-size: 11px;">Очистить</button>
                                                  </div>
                                              </div>
                                              <div style="max-height: 260px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.45; padding-right: 4px;">
                                                  {#if settingsLogLines.length === 0}
                                                      <div style="color: #9AA0A6; padding: 8px 0;">Журнал пуст. Выполните любое действие для записи...</div>
                                                  {/if}
                                                  {#each settingsLogLines as line}
                                                      <div style="padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); word-break: break-all; color: {line.includes('ERR') || line.includes('ОШИБКА') ? '#ff6b6b' : (line.includes('RPC-OK') || line.includes('BIO-OK') ? '#69db7c' : (line.includes('CLICK') ? '#ffd43b' : '#E3E3E3'))};">
                                                          {line}
                                                      </div>
                                                  {/each}
                                              </div>
                                          </div>
                                      {/if}"""

              if "Живой системный журнал" not in st:
                  st = st.replace(old_log_toggle, new_log_toggle_and_viewer, 1)
                  with open(settings_path, "w", encoding="utf-8") as f:
                      f.write(st)
                  print("[OK] Settings.svelte: живая консоль логов встроена под выбором протокола шифрования")

          # 6. Modals.svelte:
          #    Встраиваем ЖИВУЮ КАМЕРУ для сканирования QR-кода (getUserMedia + video + jsQR в реальном времени) прямо внутри окна "Добавить контакт"!
          modals_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(modals_path):
              with open(modals_path, "r", encoding="utf-8") as f:
                  md = f.read()

              m_start = "async function handleScanQRFile(e)"
              m_end = "</script>"
              idx1 = md.find(m_start)
              idx2 = md.find(m_end, idx1) if idx1 != -1 else -1

              if idx1 != -1 and idx2 != -1:
                  live_qr_js = """let isLiveScanningQR = false;
              let qrVideoStream = null;
              let qrScanTimer = null;
              let qrVideoEl = null;
              let qrStatusMsg = '';

              async function startLiveQRScanner() {
                  if (isLiveScanningQR) {
                      stopLiveQRScanner();
                      return;
                  }
                  qrStatusMsg = '⏳ Запуск камеры для сканирования QR...';
                  if (window.__addHydraLog) window.__addHydraLog('QR-CAM', 'Открытие прямой камеры для сканирования QR-кода...');
                  try {
                      if (window.HydraNative?.requestMissingPermissions) {
                          window.HydraNative.requestMissingPermissions();
                      }
                      qrVideoStream = await navigator.mediaDevices.getUserMedia({
                          video: { facingMode: { ideal: 'environment' }, width: { ideal: 640 }, height: { ideal: 640 } },
                          audio: false
                      });
                      isLiveScanningQR = true;
                      qrStatusMsg = '🎯 Наведите камеру на QR-код друга...';
                      setTimeout(() => {
                          if (qrVideoEl && qrVideoStream) {
                              qrVideoEl.srcObject = qrVideoStream;
                              qrVideoEl.play().catch(() => {});
                          }
                      }, 100);

                      const canvas = document.createElement('canvas');
                      const ctx = canvas.getContext('2d');
                      qrScanTimer = setInterval(() => {
                          if (!qrVideoEl || qrVideoEl.readyState !== qrVideoEl.HAVE_ENOUGH_DATA) return;
                          canvas.width = qrVideoEl.videoWidth || 480;
                          canvas.height = qrVideoEl.videoHeight || 480;
                          ctx.drawImage(qrVideoEl, 0, 0, canvas.width, canvas.height);
                          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                          const code = jsQR(imageData.data, imageData.width, imageData.height);
                          if (code && code.data) {
                              addContactAddress = code.data.trim();
                              if (!addContactName.trim()) addContactName = 'Контакт ' + addContactAddress.slice(0, 6);
                              qrStatusMsg = '✅ QR-код успешно считан камерой!';
                              if (window.__addHydraLog) window.__addHydraLog('QR-CAM-OK', 'Считан QR с живой камеры: ' + addContactAddress);
                              stopLiveQRScanner();
                          }
                      }, 220);
                  } catch (err) {
                      qrStatusMsg = '❌ Не удалось открыть камеру: ' + err;
                      if (window.__addHydraLog) window.__addHydraLog('QR-CAM-ERR', String(err));
                  }
              }

              function stopLiveQRScanner() {
                  if (qrScanTimer) {
                      clearInterval(qrScanTimer);
                      qrScanTimer = null;
                  }
                  if (qrVideoStream) {
                      qrVideoStream.getTracks().forEach(t => t.stop());
                      qrVideoStream = null;
                  }
                  isLiveScanningQR = false;
              }

              $: if (!showAddContact && isLiveScanningQR) {
