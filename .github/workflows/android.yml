              }
              """
              if "function clearCurrentChatHistory()" not in ch:
                  ch = ch.replace("</script>", chat_menu_js + "\n</script>", 1)

              # Заменяем статичный текст "В сети / Оффлайн" в шапке чата на умный getContactPresenceText(selectedContact, messages)
              ch = re.sub(
                  r"\{\(messages \|\| \[\]\)\.some\(m => !m\.IsOutgoing && m\.SenderID === selectedContact\?\.PublicKey && \(Date\.now\(\) - m\.Timestamp < 300000\)\) \? 'В сети' : 'Оффлайн'\}",
