name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix unused log in contacts.go, Bump Version to 2.5.0-hydra & Apply Dark Blue + Dark Grey Theme
        run: |
          cat << 'PYEOF' > apply_darkblue_and_fix.py
          import os, re

          # 1. Чиним ошибку компиляции Go: убираем неиспользуемый "log" в internal/appcore/contacts.go
          c_path = "internal/appcore/contacts.go"
          if os.path.exists(c_path):
              with open(c_path, "r", encoding="utf-8") as f:
                  cc = f.read()
              cc = cc.replace('\t"log"\n', '')
              with open(c_path, "w", encoding="utf-8") as f:
                  f.write(cc)
              print("[OK] 1. internal/appcore/contacts.go: удалён неиспользуемый импорт 'log'")

          # 2. Обновляем версию до 2.5.0-hydra в Go-ядре и в android/app/build.gradle
          for root, _, files in os.walk("internal"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          gc = f.read()
                      orig = gc
                      gc = gc.replace('"2.0.0-hydra"', '"2.5.0-hydra"')
                      gc = gc.replace('"1.0.2-beta"', '"2.5.0-hydra"')
                      if gc != orig:
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(gc)
                          print("[OK] 2a. Версия в Go обновлена до 2.5.0-hydra:", fp)

          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = re.sub(r'versionCode\s+\d+', 'versionCode 25', bg)
              bg = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.5.0-hydra"', bg)
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(bg)
              print("[OK] 2b. android/app/build.gradle: версия обновлена до 2.5.0-hydra (versionCode 25)")

          # 3. Заменяем ВЕСЬ фиолетовый цвет во всём фронтенде на строгую ТЁМНО-СИНЮЮ + ТЁМНО-СЕРУЮ тему!
          purple_to_darkblue = [
              # Основные фиолетовые HEX-коды -> Тёмно-синие
              ("#6366f1", "#1D4ED8"),
              ("#6c5ce7", "#1E40AF"),
              ("#5a4fcf", "#1E3A8A"),
              ("#a29bfe", "#60A5FA"),
              ("#a78bfa", "#3B82F6"),
              ("#1a1a2e", "#16181D"),
              ("#1e1e2e", "#1A1C20"),
              ("#11111b", "#141619"),
              ("#0c0c14", "#121316"),
              # Фиолетовые RGBA -> Тёмно-синие RGBA
              ("rgba(99, 102, 241,", "rgba(29, 78, 216,"),
              ("rgba(99,102,241,", "rgba(29,78,216,"),
              ("rgba(108, 92, 231,", "rgba(30, 64, 175,"),
              ("rgba(162, 155, 254,", "rgba(59, 130, 246,"),
              # Обновление запасной строки версии в Settings.svelte
              ("'1.0.2-beta'", "'2.5.0-hydra'"),
          ]

          for root, _, files in os.walk("frontend/src"):
              for fn in files:
                  if fn.endswith((".svelte", ".js", ".css")):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          content = f.read()
                      orig = content
                      for old_val, new_val in purple_to_darkblue:
                          content = content.replace(old_val, new_val)

                      # Если это utils.js — меняем градиенты аватарок с фиолетовых на благородные тёмно-синие и графитовые
                      if fn == "utils.js":
                          content = re.sub(
                              r"#667eea|#764ba2|#6B73FF|#000DFF|#8E2DE2|#4A00E0|#c471f5|#fa71cd",
                              "#1E3A8A",
                              content
                          )

                      if content != orig:
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(content)
                          print("[OK] 3. Перекрашен в тёмно-синий + тёмно-серый:", fp)

          # 4. Дополнительно закрепляем глобальную Тёмно-синюю + Тёмно-серую палитру в App.svelte
          app_svelte_path = "frontend/src/App.svelte"
          if os.path.exists(app_svelte_path):
              with open(app_svelte_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              darkblue_theme_override = """
              :global(:root) {
                  --bg-primary: #121316 !important;
                  --bg-secondary: #1A1C20 !important;
                  --bg-tertiary: #22252A !important;
                  --bg-input: #141619 !important;
                  --accent: #1D4ED8 !important;
                  --text-primary: #E5E7EB !important;
                  --text-secondary: #9CA3AF !important;
                  --border: rgba(59, 130, 246, 0.14) !important;
              }
              :global(body), :global(.app-container), :global(.login-screen), :global(.content-area) {
                  background: #121316 !important;
                  color: #E5E7EB !important;
              }
              :global(.sidebar), :global(.glass-panel), :global(.settings-card), :global(.modal-content) {
                  background: #1A1C20 !important;
                  border: 1px solid rgba(59, 130, 246, 0.14) !important;
                  border-radius: 24px !important;
              }
              :global(.btn-primary), :global(.btn-primary-premium) {
                  background: linear-gradient(135deg, #1E3A8A, #1D4ED8) !important;
                  color: #FFFFFF !important;
                  border: 1px solid rgba(96, 165, 250, 0.3) !important;
                  border-radius: 100px !important;
                  font-weight: 700 !important;
              }
              :global(.message.outgoing .message-bubble:not(.circle-only-bubble)) {
                  background: linear-gradient(135deg, #172554, #1E3A8A) !important;
                  border: 1px solid rgba(59, 130, 246, 0.25) !important;
                  color: #F3F4F6 !important;
              }
              """
              ap = ap.replace("</style>", darkblue_theme_override + "\n</style>", 1)
              with open(app_svelte_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 4. App.svelte: закреплена глобальная тёмно-синяя + тёмно-серая тема")
          PYEOF
          python3 apply_darkblue_and_fix.py
          rm -f apply_darkblue_and_fix.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Dark Blue Theme, Version 2.5.0 & contacts.go Fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix unused log in contacts.go, bump version to 2.5.0-hydra & apply Dark Blue + Dark Grey theme [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
