name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Call Bubble Fix, QR Auto-Nick Resolve, Image Zoom/Share, Working Disappearing Timer & Security Hardening
        run: |
          cat << 'PYEOF' > apply_security_and_ux.py
          import os, re, shutil

          # 1. БЕЗОПАСНОСТЬ (AndroidManifest.xml):
          #    Ставим android:allowBackup="false", чтобы через ADB нельзя было слить базу чатов и ключи!
          mf_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(mf_path):
              with open(mf_path, "r", encoding="utf-8") as f:
                  mf = f.read()
              mf = mf.replace('android:allowBackup="true"', 'android:allowBackup="false"')
              with open(mf_path, "w", encoding="utf-8") as f:
                  f.write(mf)
              print("[OK] 1. AndroidManifest.xml: включена защита от ADB-бэкапа (allowBackup=false)")

          # 2. БЕЗОПАСНОСТЬ (mobile/mobile.go):
          #    - Защищаем локальный сервер 127.0.0.1:8080 от внешних сайтов (блокируем чужие Origin в CORS, чтобы ни один сайт в браузере не мог обратиться к API приложения!)
          mob_path = "mobile/mobile.go"
          if os.path.exists(mob_path):
              with open(mob_path, "r", encoding="utf-8") as f:
                  mb = f.read()

              old_cors = 'w.Header().Set("Access-Control-Allow-Origin", "*")'
              new_cors = '''origin := r.Header.Get("Origin")
          	if origin != "" && !strings.HasPrefix(origin, "http://127.0.0.1") && !strings.HasPrefix(origin, "http://localhost") {
          		http.Error(w, "forbidden origin", http.StatusForbidden)
          		return
          	}
          	w.Header().Set("Access-Control-Allow-Origin", "http://127.0.0.1:8080")'''
              mb = mb.replace(old_cors, new_cors)
              with open(mob_path, "w", encoding="utf-8") as f:
                  f.write(mb)
              print("[OK] 2. mobile/mobile.go: закрыт доступ к API 127.0.0.1:8080 для сторонних браузерных вкладок (Anti-CSRF/Session Hijack)")

          # 3. БЕЗОПАСНОСТЬ + ПРЕВЬЮ ВЫЗОВОВ (frontend/src/utils.js):
          #    - В formatPreviewText добавляем [HYDRA_CALL_ANSWER] и скрываем метки таймера [HYDRA_TTL:...]
          #    - В parseMarkdown блокируем опасные ссылки javascript: / data: / vbscript: (Anti-XSS)
          ut_path = "frontend/src/utils.js"
          if os.path.exists(ut_path):
              with open(ut_path, "r", encoding="utf-8") as f:
                  ut = f.read()
              ut = ut.replace(
                  "const s = String(raw).trim();",
                  "const s = String(raw).replace(/^\\[HYDRA_TTL:\\d+\\]/, '').trim();"
              )
              ut = ut.replace(
                  "html = html.replace(/\\[([^\\]]+)\\]\\(([^)]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>');",
                  "html = html.replace(/\\[([^\\]]+)\\]\\((https?:\\/\\/[^)]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>');"
              )
              with open(ut_path, "w", encoding="utf-8") as f:
                  f.write(ut)
              print("[OK] 3. utils.js: добавлена защита от XSS-ссылок и очистка меток таймера")

          # 4. ЧИНИМ ГИГАНТСКИЙ КОД ПРИ ЗВОНКЕ (internal/appcore/messages.go и appcore.go):
          #    - В SendText: если отправляется технический пакет [HYDRA_CALL_ANSWER]: или [HYDRA_CALL_ICE]: — отправляем его по сети собеседнику, но НЕ сохраняем в базу чата и НЕ выводим пузырь на экран!
          #    - В StartVPSRelayLoop: ограничиваем размер карты seenIDs (до 1000 записей), чтобы исключить утечку памяти!
          msg_path = "internal/appcore/messages.go"
          if os.path.exists(msg_path):
              with open(msg_path, "r", encoding="utf-8") as f:
                  mc = f.read()

              old_save_out = """	if err := a.Repo.SaveMessage(a.Ctx, msg); err != nil {
          		log.Printf("[AppCore] Failed to save message: %v", err)
          	}"""

              new_save_out = """	// Технические пакеты WebRTC (CALL_ANSWER / CALL_ICE / GROUP_INVITE) не сохраняем как текстовые пузыри в истории чата
          	if strings.HasPrefix(text, "[HYDRA_CALL_ANSWER]:") || strings.HasPrefix(text, "[HYDRA_CALL_ICE]:") || strings.HasPrefix(text, "[HYDRA_GROUP_INVITE]:") {
          		return nil
          	}
          	if err := a.Repo.SaveMessage(a.Ctx, msg); err != nil {
          		log.Printf("[AppCore] Failed to save message: %v", err)
          	}"""
              mc = mc.replace(old_save_out, new_save_out, 1)
              with open(msg_path, "w", encoding="utf-8") as f:
                  f.write(mc)
              print("[OK] 4a. messages.go: пакеты [HYDRA_CALL_ANSWER] больше не сохраняются в чат как синие простыни кода!")

          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()
              # Защита от утечки памяти в seenIDs
              ac = ac.replace(
                  "seenIDs[mID] = true",
                  "if len(seenIDs) > 1000 { seenIDs = make(map[string]bool) }\n\t\t\t\t\t\t\tseenIDs[mID] = true"
              )
              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)

          # 5. АВТО-РЕГИСТРАЦИЯ ИМЕНИ ПРОФИЛЯ («Дима») НА СЕРВЕРЕ ПРИ ВХОДЕ (internal/appcore/auth.go):
          #    Чтобы когда создаёшь профиль «Дима», он никогда не записывался как «User», а сразу закреплял имя «дима» за твоим ключом на VPS!
          au_go_path = "internal/appcore/auth.go"
          if os.path.exists(au_go_path):
              with open(au_go_path, "r", encoding="utf-8") as f:
                  ag = f.read()
              ag = ag.replace(
                  "go a.ConnectToI2P()",
                  """go func() {
          		a.ConnectToI2P()
          		if a.Repo != nil {
          			if u, _ := a.Repo.GetMyProfile(a.Ctx); u != nil && u.Nickname != "" && u.Nickname != "User" {
          				_ = a.UpdateMyProfile(u.Nickname, u.Bio, u.Avatar)
          			}
          		}
          	}()"""
              )
              with open(au_go_path, "w", encoding="utf-8") as f:
                  f.write(ag)
              print("[OK] 5. auth.go: имя профиля (например, Дима) автоматически синхронизируется с VPS при входе, заменяя 'User'!")

          # 6. АВТО-ОПРЕДЕЛЕНИЕ НИКА ПО QR-КОДУ (frontend/src/components/Modals.svelte) + РОВНАЯ КНОПКА МАСТЕР-КЛЮЧА (Auth.svelte):
          #    Когда сканируешь QR-код (камерой или из галереи), сразу запрашиваем у VPS никнейм владельца этого ключа (/nick/resolve?pub=...) и ставим его вместо 'Контакт tezLHu'!
          md_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(md_path):
              with open(md_path, "r", encoding="utf-8") as f:
                  md = f.read()

              old_qr_cam_hit = """                if (code && code.data) {
                              addContactAddress = code.data.trim();
                              if (!addContactName.trim()) addContactName = 'Контакт ' + addContactAddress.slice(0, 6);
                              qrStatusMsg = '✅ QR-код успешно считан камерой!';"""

              new_qr_cam_hit = """                if (code && code.data) {
                              addContactAddress = code.data.trim();
                              qrStatusMsg = '⏳ QR считан! Поиск @никнейма на сервере...';
                              stopLiveQRScanner();
                              fetch('http://191.223.137.164:8085/nick/resolve?pub=' + encodeURIComponent(addContactAddress))
                                  .then(r => r.ok ? r.json() : null)
                                  .then(d => {
                                      if (d && d.nickname) {
                                          addContactName = '@' + d.nickname.replace(/^@/, '');
                                          qrStatusMsg = '✅ Найдено имя пользователя: ' + addContactName;
                                      } else {
                                          if (!addContactName.trim() || addContactName.startsWith('Контакт ')) addContactName = 'Пользователь Hydra';
                                          qrStatusMsg = '✅ QR-код считан! Введите имя друга выше.';
                                      }
                                  })
                                  .catch(() => {
                                      if (!addContactName.trim()) addContactName = 'Пользователь Hydra';
                                      qrStatusMsg = '✅ QR-код успешно считан!';
                                  });"""
              md = md.replace(old_qr_cam_hit, new_qr_cam_hit)

              old_qr_file_hit = """            if (code && code.data) {
                          addContactAddress = code.data.trim();
                          if (!addContactName.trim()) addContactName = 'Контакт ' + addContactAddress.slice(0, 6);
                          qrStatusMsg = '✅ QR-код распознан из картинки!';"""

              new_qr_file_hit = """            if (code && code.data) {
                          addContactAddress = code.data.trim();
                          qrStatusMsg = '⏳ Поиск @никнейма владельца QR...';
                          fetch('http://191.223.137.164:8085/nick/resolve?pub=' + encodeURIComponent(addContactAddress))
                              .then(r => r.ok ? r.json() : null)
                              .then(d => {
                                  if (d && d.nickname) {
                                      addContactName = '@' + d.nickname.replace(/^@/, '');
                                      qrStatusMsg = '✅ Найдено имя: ' + addContactName;
                                  } else {
                                      if (!addContactName.trim() || addContactName.startsWith('Контакт ')) addContactName = 'Пользователь Hydra';
                                      qrStatusMsg = '✅ QR-код распознан из картинки!';
                                  }
                              }).catch(() => {});"""
              md = md.replace(old_qr_file_hit, new_qr_file_hit)

              with open(md_path, "w", encoding="utf-8") as f:
                  f.write(md)
              print("[OK] 6a. Modals.svelte: после сканирования QR-кода автоматически подтягивается @никнейм с сервера вместо 'Контакт tezLHu'!")

          # Выравниваем кнопку "Я сохранил(а) Мастер-ключ HYDRA-KEY" в Auth.svelte (Скриншот 5)
          au_svelte_path = "frontend/src/components/Auth.svelte"
          if os.path.exists(au_svelte_path):
              with open(au_svelte_path, "r", encoding="utf-8") as f:
                  aus = f.read()
              aus = aus.replace(
                  'style="height: 52px; font-size: 16px; border-radius: 16px;">\n        Я сохранил(а) Мастер-ключ HYDRA-KEY\n      </button>',
                  'style="min-height: 50px; height: auto; padding: 14px 20px; font-size: 15px; line-height: 1.3; border-radius: 100px; display: flex; align-items: center; justify-content: center; text-align: center;">\n        ✅ Я сохранил(а) Мастер-ключ\n      </button>'
              )
              with open(au_svelte_path, "w", encoding="utf-8") as f:
                  f.write(aus)
              print("[OK] 6b. Auth.svelte: кнопка сохранения Мастер-ключа идеально выровнена!")

          # 7. ПОЛНОЭКРАННЫЙ ПРОСМОТР ФОТО С ЗУМОМ И КНОПКАМИ "ПОДЕЛИТЬСЯ / ОТКРЫТЬ С ПОМОЩЬЮ" И "СОХРАНИТЬ" (frontend/src/App.svelte):
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              if "let previewImagePath = '';" not in ap:
                  ap = ap.replace("let previewImage = null;", "let previewImage = null;\n  let previewImagePath = '';\n  let previewZoom = 1;", 1)

              ap = ap.replace(
                  'onPreviewImage: async (path) => {\n          const base64 = await AppActions.GetFileBase64(path);\n          previewImage = "data:image/jpeg;base64," + base64;\n      },',
                  'onPreviewImage: async (path) => {\n          previewImagePath = path;\n          previewZoom = 1;\n          const base64 = await AppActions.GetFileBase64(path);\n          previewImage = "data:image/jpeg;base64," + base64;\n      },'
              )

              old_preview_html = """    {#if previewImage}
              <div class="fullscreen-preview" on:click={() => previewImage = null}>
                  <img src={previewImage} alt="Preview" />
              </div>
          {/if}"""

              new_preview_html = """    {#if previewImage}
              <div class="fullscreen-preview" style="display: flex; flex-direction: column; justify-content: space-between; background: rgba(8,10,15,0.96); backdrop-filter: blur(16px);">
                  <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 16px 20px; padding-top: calc(16px + env(safe-area-inset-top, 12px)); box-sizing: border-box; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);">
                      <div style="display: flex; gap: 10px;">
                          <button type="button" on:click={() => previewZoom = previewZoom >= 3 ? 1 : +(previewZoom + 0.75).toFixed(2)} style="background: #1A1C20; color: #60A5FA; border: 1px solid rgba(59,130,246,0.35); border-radius: 100px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
                              🔍 {previewZoom}x
                          </button>
                          {#if previewImagePath}
                              <button type="button" on:click={async () => {
                                  try { await AppActions.ShareFile(previewImagePath); } catch (e) { showToast('Ошибка открытия: ' + e, 'error'); }
                              }} style="background: #1D4ED8; color: #fff; border: none; border-radius: 100px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
                                  📤 Поделиться / Открыть в...
                              </button>
                              <button type="button" on:click={async () => {
                                  const fname = previewImagePath.split('/').pop() || ('hydra_photo_' + Date.now() + '.jpg');
                                  await chatHandlers.onSaveFile(previewImagePath, fname);
                              }} style="background: #1A1C20; color: #E5E7EB; border: 1px solid rgba(255,255,255,0.15); border-radius: 100px; padding: 8px 14px; font-size: 12px; font-weight: 700; cursor: pointer;">
                                  📥 В Галерею
                              </button>
                          {/if}
                      </div>
                      <button type="button" on:click={() => { previewImage = null; previewZoom = 1; }} style="background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 50%; width: 38px; height: 38px; font-size: 16px; cursor: pointer;">✕</button>
                  </div>

                  <div style="flex: 1; width: 100%; overflow: auto; display: flex; align-items: center; justify-content: center; touch-action: pan-x pan-y pinch-zoom;" on:dblclick={() => previewZoom = previewZoom > 1 ? 1 : 2.5}>
                      <img
                          src={previewImage}
                          alt="Preview"
                          style="max-width: 95%; max-height: 82vh; object-fit: contain; transform: scale({previewZoom}); transform-origin: center center; transition: transform 0.2s ease; cursor: zoom-in;"
                      />
                  </div>

                  <div style="padding: 12px; text-align: center; color: #9CA3AF; font-size: 11px;">
                      Двойное нажатие на фото или кнопка 🔍 для увеличения • 📤 чтобы поделиться или открыть в другом приложении
                  </div>
              </div>
          {/if}"""

              ap = ap.replace(old_preview_html, new_preview_html)
              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 7. App.svelte: добавлен зум фотографий (🔍 1x..3x и двойной тап) + кнопки '📤 Поделиться / Открыть в...' и '📥 В Галерею'!")

          # 8. РАБОТАЮЩИЙ ТАЙМЕР ИСЧЕЗАЮЩИХ СООБЩЕНИЙ (⏱ Выкл / 1м / 1ч) + ФИЛЬТР CALL_ANSWER В Chat.svelte:
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              # Запускаем интервал автоудаления сообщений при включённом таймере disappearingTimer (60 сек = 1м, 3600 сек = 1ч)!
              ttl_engine_js = """
              // Автоматическое удаление сообщений по таймеру (⏱ 1м / 1ч)
              let ttlCleanupTimer = null;
              $: if (selectedContact) {
                  const savedTtl = localStorage.getItem('hydra_ttl_' + selectedContact.ID);
                  if (savedTtl !== null) disappearingTimer = Number(savedTtl);
              }
              function toggleAndSaveDisappearingTimer() {
                  if (disappearingTimer === 0) disappearingTimer = 60;
                  else if (disappearingTimer === 60) disappearingTimer = 3600;
                  else disappearingTimer = 0;
                  if (selectedContact) {
                      localStorage.setItem('hydra_ttl_' + selectedContact.ID, String(disappearingTimer));
                  }
              }
              if (typeof window !== 'undefined') {
                  setInterval(async () => {
                      if (!disappearingTimer || disappearingTimer <= 0 || !messages || messages.length === 0) return;
                      const nowMs = Date.now();
                      const maxAgeMs = disappearingTimer * 1000;
                      let deletedAny = false;
                      for (const m of messages) {
                          if (m.Timestamp && (nowMs - m.Timestamp >= maxAgeMs)) {
                              await AppActions.DeleteMessage(m.ID).catch(() => {});
                              deletedAny = true;
                          }
                      }
                      if (deletedAny) {
                          messages = messages.filter(m => !(m.Timestamp && (nowMs - m.Timestamp >= maxAgeMs)));
                          dispatch('refresh');
                      }
                  }, 3000);
              }
              """
              if "function toggleAndSaveDisappearingTimer()" not in ch:
                  ch = ch.replace("function cycleDisappearingTimer() {", ttl_engine_js + "\n    function cycleDisappearingTimer() {\n        toggleAndSaveDisappearingTimer();\n        return;", 1)

              # В шаблоне Chat.svelte перехватываем также [HYDRA_CALL_ANSWER]: и [HYDRA_CALL_ICE]:, чтобы они НИКОГДА не рисовались синими простынями Base64!
              ch = ch.replace(
                  "{:else if msg.Content && (msg.Content.startsWith('[HYDRA_CALL_RING]:') || msg.Content.startsWith('[HYDRA_CALL_MISSED]:') || msg.Content.startsWith('[HYDRA_CALL_END]:'))}",
                  "{:else if msg.Content && (msg.Content.startsWith('[HYDRA_CALL_RING]:') || msg.Content.startsWith('[HYDRA_CALL_ANSWER]:') || msg.Content.startsWith('[HYDRA_CALL_ICE]:') || msg.Content.startsWith('[HYDRA_CALL_MISSED]:') || msg.Content.startsWith('[HYDRA_CALL_END]:'))}"
              )

              # Если в базе с прошлых тестов уже застряло сообщение с [HYDRA_CALL_ANSWER]: — рисуем его аккуратной плашкой "🟢 Вызов принят" вместо Base64!
              ch = ch.replace(
                  "{msg.Content.startsWith('[HYDRA_CALL_RING]:') ? (msg.IsOutgoing ? 'Исходящий вызов' : 'Входящий вызов') : (msg.Content.startsWith('[HYDRA_CALL_MISSED]:') ? 'Пропущенный вызов' : 'Аудиозвонок завершён')}",
                  "{msg.Content.startsWith('[HYDRA_CALL_RING]:') ? (msg.IsOutgoing ? 'Исходящий вызов' : 'Входящий вызов') : (msg.Content.startsWith('[HYDRA_CALL_ANSWER]:') ? '🟢 Вызов принят (E2EE)' : (msg.Content.startsWith('[HYDRA_CALL_MISSED]:') ? 'Пропущенный вызов' : 'Аудиозвонок завершён'))}"
              )

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 8. Chat.svelte: включён реальный таймер автоудаления сообщений (⏱ 1м / 1ч) и скрыт код [HYDRA_CALL_ANSWER]!")

          # 9. В MainActivity.kt сбрасываем AudioManager.MODE_NORMAL при закрытии/паузе, чтобы системное английское уведомление Android 'A call is in progress' сразу пропадало после звонка!
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()
              if "AudioManager" not in kt:
                  kt = kt.replace(
                      "override fun onPause() {",
                      """override fun onPause() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                      if (am.mode != android.media.AudioManager.MODE_NORMAL) {
                          am.mode = android.media.AudioManager.MODE_NORMAL
                      }
                  } catch (_: Exception) {}"""
                  )
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 9. MainActivity.kt: авто-сброс режима AudioManager после завершения WebRTC-звонка")
          PYEOF
          python3 apply_security_and_ux.py
          rm -f apply_security_and_ux.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Security Hardening & UX Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Fix CALL_ANSWER bubble code, auto-resolve QR nickname, add Image Zoom & Share, enable TTL timer & harden API/XSS security [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
