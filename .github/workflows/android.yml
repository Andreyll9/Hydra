                          <button type="button" on:click={() => showNearbyWifiModal = false} style="background: #28292D; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer;">✕</button>
                      </div>
                      <p style="font-size: 12px; color: #9CA3AF; margin: 0 0 14px;">
