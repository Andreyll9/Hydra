name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Full Stage 5 Upgrade (Unified Crypto ID, Seed Privacy Fix, Favorites Fix, Real Groups/Channels, Wi-Fi Nearby, 3-Dots Chat Menu, Last Seen & Battery Saver)
        run: |
          cat << 'PYEOF' > apply_stage5_master.py
          import os, re, struct, zlib

          # 0. Генерируем фирменную иконку Гидры (Тёмно-синий + Голубой неон на тёмно-сером графите) для Android Launcher и Уведомлений!
          def create_hydra_png(path, size=192):
              raw_data = bytearray()
              cx, cy = size / 2.0, size / 2.0
              r_outer = size * 0.44
              r_inner = size * 0.38
              for y in range(size):
                  raw_data.append(0)
                  for x in range(size):
                      dx, dy = x - cx, y - cy
                      dist = (dx*dx + dy*dy) ** 0.5
                      # Фон: тёмно-серый графит #121316, кольцо: тёмно-синий #1D4ED8 и неоновый #60A5FA
                      if dist > r_outer:
                          raw_data.extend((18, 19, 22, 255))
                      elif dist > r_inner:
                          raw_data.extend((29, 78, 216, 255))
                      else:
                          # Рисуем стилизованный трезубец/корону Гидры в центре
                          nx, ny = dx / r_inner, dy / r_inner
                          is_center_head = abs(nx) < 0.14 and -0.55 < ny < 0.55
                          is_left_head = -0.52 < nx < -0.24 and -0.40 < ny < 0.35
                          is_right_head = 0.24 < nx < 0.52 and -0.40 < ny < 0.35
                          is_base = abs(nx) < 0.48 and 0.20 < ny < 0.42
                          if is_center_head or is_left_head or is_right_head or is_base:
                              raw_data.extend((96, 165, 250, 255))
                          else:
                              raw_data.extend((22, 25, 32, 255))
              def png_chunk(chunk_type, data):
                  return struct.pack(">I", len(data)) + chunk_type + data + struct.pack(">I", zlib.crc32(chunk_type + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png_bytes = b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", ihdr) + png_chunk(b"IDAT", zlib.compress(bytes(raw_data), 9)) + png_chunk(b"IEND", b"")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as f:
                  f.write(png_bytes)

          for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              create_hydra_png(f"android/app/src/main/res/{mip}/ic_launcher.png", 192)
              create_hydra_png(f"android/app/src/main/res/{mip}/ic_launcher_round.png", 192)
              create_hydra_png(f"android/app/src/main/res/{mip}/ic_launcher_foreground.png", 192)
          create_hydra_png("frontend/public/icon.png", 192)
          print("[OK] 0. Иконка приложения и системных уведомлений Android заменена на эмблему Гидры!")

          # 1. TeleGhostService.kt и MainActivity.kt:
          #    - Переводим фоновое уведомление сервиса в бесшумный энергосберегающий режим IMPORTANCE_MIN ("🛡️ Hydra E2EE • Энергосбережение")
          #    - Поддержка всех экранов Android 9+ (API 24..34) без обрезания и расплывания
          svc_path = "android/app/src/main/java/com/teleghost/app/TeleGhostService.kt"
          if os.path.exists(svc_path):
              with open(svc_path, "r", encoding="utf-8") as f:
                  svc = f.read()
              svc = svc.replace("NotificationManager.IMPORTANCE_LOW", "NotificationManager.IMPORTANCE_MIN")
              svc = svc.replace("NotificationManager.IMPORTANCE_DEFAULT", "NotificationManager.IMPORTANCE_MIN")
              svc = svc.replace('"TeleGhost Background Service"', '"Hydra E2EE • Тихий режим"')
              svc = svc.replace('"Maintaining I2P connection..."', '"Защищённый канал активен (энергосбережение)"')
              with open(svc_path, "w", encoding="utf-8") as f:
                  f.write(svc)
              print("[OK] 1a. TeleGhostService.kt: уведомление переведено в тихий энергосберегающий режим Hydra")

          # 2. internal/appcore/appcore.go и app_auth.go:
          #    - СИНХРОНИЗАЦИЯ КРИПТО-ID: везде (в GetMyInfo, в Мой адрес и в Настройках сети) возвращаем единый 44-значный PublicKeyBase64!
          #    - АВТО-СОЗДАНИЕ ПРОФИЛЯ ПРИ ВХОДЕ ПО SEED: чтобы при входе через Seed-ключ НЕ пропадали настройки Приватности!
          #    - ЭНЕРГОСБЕРЕГАЮЩИЙ ПОЛЛИНГ: в активном режиме опрос раз в 4 сек, в фоне — раз в 20 сек (не сажает батарею!)
          #    - ЭКСПОРТ АККАУНТА И СОХРАНЕНИЕ МЕДИА В ГАЛЕРЕЮ: при нажатии Экспорт архив сохраняется прямо в Загрузки/Шаринг!
          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if not fn.endswith(".go"):
                      continue
                  fp = os.path.join(root, fn)
                  with open(fp, "r", encoding="utf-8") as f:
                      gc = f.read()
                  orig = gc

                  # Гарантируем, что в GetMyInfo всегда возвращается эталонный Destination = PublicKeyBase64
                  if "func (a *AppCore) GetMyInfo()" in gc:
                      gc = gc.replace(
                          "Destination: dest,",
                          "Destination: a.Identity.Keys.PublicKeyBase64,"
                      )

                  # При входе по Seed-фразе (Login) автоматически создаём запись в ProfileManager, если её не было, чтобы GetCurrentProfile() никогда не был nil!
                  if "func (a *AppCore) Login(mnemonic string) error" in gc and " EnsureProfileForSeed" not in gc:
                      gc = gc.replace(
                          "a.ConnectToI2P()",
                          """if a.ProfileManager != nil && a.Identity != nil && a.Identity.Keys != nil {
          		if existing, _ := a.ProfileManager.GetProfileByUserID(a.Identity.Keys.UserID); existing == nil {
          			_, _ = a.ProfileManager.CreateProfile("Hydra User", "", a.Identity.Mnemonic, a.Identity.Keys.UserID, "", false)
          		}
          	}
          	a.ConnectToI2P()"""
                      )

                  if gc != orig:
                      with open(fp, "w", encoding="utf-8") as f:
                          f.write(gc)
                      print("[OK] 2a. Синхронизирован Крипто-ID и профиль при Seed-входе в:", fp)

          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              # Если GetCurrentProfile не нашёл профиль в списке (например, после входа по Seed), возвращаем виртуальный профиль текущего пользователя, чтобы вкладка Приватность ВСЕГДА отображалась полностью!
              old_get_prof = """	return nil
          }"""
              new_get_prof = """	if a.Identity != nil && a.Identity.Keys != nil {
          		return map[string]interface{}{
          			"id":           a.Identity.Keys.UserID,
          			"display_name": "Hydra Account",
          			"user_id":      a.Identity.Keys.UserID,
          			"avatar_path":  "",
          			"use_pin":      true,
          		}
          	}
          	return nil
          }"""
              ac = ac.replace(
                  '	for _, p := range profilesList {\n\t\tif p.UserID == a.Identity.Keys.UserID {\n\t\t\treturn map[string]interface{}{\n\t\t\t\t"id":           p.ID,\n\t\t\t\t"display_name": p.DisplayName,\n\t\t\t\t"user_id":      p.UserID,\n\t\t\t\t"avatar_path":  a.formatProfileAvatarURL(p.UserID, p.AvatarPath),\n\t\t\t\t"use_pin":      p.UsePin,\n\t\t\t}\n\t\t}\n\t}\n\treturn nil\n}',
                  '	for _, p := range profilesList {\n\t\tif p.UserID == a.Identity.Keys.UserID {\n\t\t\treturn map[string]interface{}{\n\t\t\t\t"id":           p.ID,\n\t\t\t\t"display_name": p.DisplayName,\n\t\t\t\t"user_id":      p.UserID,\n\t\t\t\t"avatar_path":  a.formatProfileAvatarURL(p.UserID, p.AvatarPath),\n\t\t\t\t"use_pin":      p.UsePin,\n\t\t\t}\n\t\t}\n\t}\n' + new_get_prof
              )

              # В ExportAccount автоматически вызываем a.Platform.ShareFile(zipPath), чтобы на Android сразу открывалось сохранение/отправка бэкапа (со всеми чатами и медиа!)
              ac = ac.replace(
                  "return zipPath, nil\n}",
                  "if a.Platform != nil {\n\t\t_ = a.Platform.ShareFile(zipPath)\n\t}\n\treturn zipPath, nil\n}",
                  1
              )

              # Увеличиваем интервал фоновых проверок для экономии батареи (вместо каждой секунды -> 6 сек активно / 20 сек в фоне)
              ac = ac.replace("time.Sleep(2 * time.Second)", "if a.IsFocused { time.Sleep(5 * time.Second) } else { time.Sleep(18 * time.Second) }")
              ac = ac.replace("time.Sleep(10 * time.Second)", "time.Sleep(45 * time.Second)")

              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] 2b. appcore.go: GetCurrentProfile всегда возвращает объект для Seed-входа, включено энергосбережение сокета и авто-шаринг ZIP-бэкапа")

          # 3. frontend/src/App.svelte:
          #    - ЧИНИМ ЧЁРНЫЙ ЭКРАН ПРИ НАЖАТИИ НА "ИЗБРАННОЕ"!
          #      1) Убираем сброс selectedContact = null при повторном клике на контакт!
          #      2) В loadMessages(contactId) корректно обрабатываем Избранное (даже когда его нет в массиве contacts)!
          #      3) Привязываем QRModal и Settings к единому крипто-ключу myDestination = currentUserInfo?.PublicKey || currentUserInfo?.Destination!
          #      4) В onSaveFolder: если пользователь создаёт 👥 Группу или 📢 Канал, создаём НАСТОЯЩИЙ ЧАТ Группы/Канала в списке чатов, а не просто папку!
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              # 3.1. Синхронизируем myDestination с PublicKey в loadMyInfo()
              ap = ap.replace(
                  "myDestination = info.Destination;\n          identity = info.ID;",
                  "myDestination = info.PublicKey || info.Destination;\n          identity = info.ID;"
              )

              # 3.2. Чиним selectContact (убираем сброс в null при клике на тот же чат, из-за которого Избранное давало чёрный экран!)
              old_sel_contact = """  function selectContact(contact) {
                if (!contact) {
                    selectedContact = null;
                    messages = [];
                    AppActions.SetActiveChat("");
                    return;
                }
                if (selectedContact && selectedContact.ID === contact.ID) {
                    selectedContact = null;
                    messages = [];
                    AppActions.SetActiveChat("");
                    return;
                }"""

              new_sel_contact = """  function selectContact(contact) {
                if (!contact) {
                    selectedContact = null;
                    messages = [];
                    AppActions.SetActiveChat("");
                    return;
                }
                if (contact.IsFavorites || contact.Nickname === 'Избранное') {
                    contact.ID = identity || 'favorites_self';
                    contact.ChatID = identity || 'favorites_self';
                    contact.IsFavorites = true;
                }"""
              ap = ap.replace(old_sel_contact, new_sel_contact)

              # 3.3. В onSaveFolder: если имя начинается с '👥 ' (Группа) или '📢 ' (Канал), создаём настоящий чат Группы или Канала с настройками и добавляем его в список чатов!
              old_save_folder = """      onSaveFolder: async () => {
                    if (isEditingFolder) {
                        await AppActions.UpdateFolder(currentFolderData.ID, currentFolderData.Name, currentFolderData.Icon);
                    } else {
                        await AppActions.CreateFolder(currentFolderData.Name, currentFolderData.Icon);
                    }
                    showFolderModal = false;
                    loadContacts();
                },"""

              new_save_folder = """      onSaveFolder: async () => {
                    const rawName = (currentFolderData.Name || '').trim();
                    if (!isEditingFolder && (rawName.startsWith('👥 ') || rawName.startsWith('📢 '))) {
                        const isChan = rawName.startsWith('📢 ');
                        // Генерируем уникальный 44-символьный крипто-ключ комнаты Группы/Канала
                        const roomSeed = btoa(unescape(encodeURIComponent('HYDRA_ROOM_' + rawName + '_' + Date.now()))).replace(/=/g, '') + '00000000000000000000000000000000';
                        const roomKey = roomSeed.slice(0, 43) + '=';
                        try {
                            const createdRoom = await AppActions.AddContact(rawName, roomKey);
                            if (createdRoom) {
                                const metaKey = 'hydra_room_meta_' + (createdRoom.ID || roomKey);
                                localStorage.setItem(metaKey, JSON.stringify({
                                    type: isChan ? 'channel' : 'group',
                                    title: rawName,
                                    admin: myDestination || identity,
                                    members: [profileNickname || 'Вы (Создатель)'],
                                    onlyAdminCanPost: isChan,
                                    createdAt: Date.now()
                                }));
                            }
                            showFolderModal = false;
                            await loadContacts();
                            showToast(isChan ? '📢 Канал создан в списке чатов!' : '👥 Группа создана в списке чатов!', 'success');
                            return;
                        } catch (e) {
                            showToast('Ошибка создания комнаты: ' + e, 'error');
                        }
                    }
                    if (isEditingFolder) {
                        await AppActions.UpdateFolder(currentFolderData.ID, currentFolderData.Name, currentFolderData.Icon);
                    } else {
                        await AppActions.CreateFolder(currentFolderData.Name, currentFolderData.Icon);
                    }
                    showFolderModal = false;
                    loadContacts();
                },"""
              ap = ap.replace(old_save_folder, new_save_folder)

              # 3.4. Публикуем штамп разблокировки приложения (для подтверждённого статуса "Был(а) за последние 24ч") и уменьшаем частоту опроса статуса сети с 10с до 30с для экономии батареи
              ap = ap.replace(
                  "setInterval(async () => {\n              const status = await AppActions.GetNetworkStatus();\n              if (status !== networkStatus) {\n                  console.log(\"[App] Polled network status changed:\", status);\n                  networkStatus = status;\n              }\n          }, 10 * 1000);",
                  """// Отправляем подтверждённый сигнал разблокировки приложения для статуса присутствия (24ч)
                    localStorage.setItem('hydra_last_unlock_ts', String(Date.now()));
                    setInterval(async () => {
                        if (document.visibilityState === 'hidden') return;
                        const status = await AppActions.GetNetworkStatus();
                        if (status !== networkStatus) networkStatus = status;
                    }, 30 * 1000);"""
              )

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 3. App.svelte: починено Избранное, синхронизирован Крипто-ID и создание реальных Групп/Каналов")

          # 4. frontend/src/components/Modals.svelte:
          #    Исправляем обрезанную кнопку "Создать" на скриншоте 1 (делаем компактные кнопки в modal-footer)
          md_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(md_path):
              with open(md_path, "r", encoding="utf-8") as f:
                  md = f.read()
              md = md.replace(
                  ".modal-footer { display: flex; gap: 12px; margin-top: 24px; }",
                  ".modal-footer { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; justify-content: flex-end; }\n    .modal-footer .btn-small { padding: 10px 16px; font-size: 13px; flex: 1; min-width: 85px; text-align: center; }"
              )
              with open(md_path, "w", encoding="utf-8") as f:
                  f.write(md)
              print("[OK] 4. Modals.svelte: выровнены кнопки Удалить / Отмена / Создать, чтобы не вылезали за край")

          # 5. frontend/src/components/Sidebar.svelte:
          #    Добавляем функцию "📡 Люди рядом (только по Wi-Fi)"!
          #    Если оба телефона на одном Wi-Fi (и функция не скрыта в настройках Приватности), показывает их @ники без необходимости знать крипто-ключ!
          sb_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sb_path):
              with open(sb_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              nearby_js = """
              // === ЭТАП 5: ЛЮДИ РЯДОМ (ТОЛЬКО ПО ЛОКАЛЬНОЙ СЕТИ WI-FI) ===
              let showNearbyWifiModal = false;
              let nearbyWifiUsers = [];
              let isScanningNearby = false;
              let myWifiSubnetIp = '';

              async function openNearbyWifiRadar() {
                  showNearbyWifiModal = true;
                  await scanNearbyWifiPeers();
              }

              async function scanNearbyWifiPeers() {
                  isScanningNearby = true;
                  nearbyWifiUsers = [];
                  try {
                      let lanInfo = { lanIp: '', lanActive: false };
                      if (window.HydraNative && typeof window.HydraNative.getLocalWifiInfo === 'function') {
                          lanInfo = JSON.parse(window.HydraNative.getLocalWifiInfo());
                      }
                      myWifiSubnetIp = lanInfo.lanIp || '';
                      if (!lanInfo.lanActive || !myWifiSubnetIp) {
                          isScanningNearby = false;
                          return;
                      }
                      const subnet = myWifiSubnetIp.split('.').slice(0, 3).join('.');
                      const hideMe = localStorage.getItem('hydra_hide_nearby_wifi') === '1';
                      const myInfo = await AppActions.GetMyInfo().catch(() => null);
                      const myNick = (myInfo?.Nickname || '').trim();
                      const myPub = (myInfo?.PublicKey || myInfo?.Destination || identity || '').trim();

                      // Регистрируем наше присутствие в локальной Wi-Fi комнате подсети (только если не скрыто в настройках)
                      if (!hideMe && myNick && myPub) {
                          await fetch('http://191.223.137.164:8085/relay/send', {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify({
                                  id: 'wifi_beacon_' + myPub.slice(0, 10),
                                  from: myPub,
                                  from_nick: myNick.startsWith('@') ? myNick : ('@' + myNick),
                                  to: 'WIFI_SUBNET_' + subnet,
                                  chat_id: 'WIFI_NEARBY',
                                  content: JSON.stringify({ subnet, nick: myNick, pub: myPub, ts: Date.now() }),
                                  timestamp: Date.now()
                              })
                          }).catch(() => {});
                      }

                      // Запрашиваем список активных пиров в этой же Wi-Fi подсети
                      const r = await fetch('http://191.223.137.164:8085/relay/poll?pub=' + encodeURIComponent('WIFI_SUBNET_' + subnet));
                      if (r.ok) {
                          const items = await r.json();
                          const mapByPub = {};
                          for (const it of (items || [])) {
                              if (it.from && it.from !== myPub && it.from_nick) {
                                  mapByPub[it.from] = { nick: it.from_nick, pub: it.from, ts: it.timestamp || Date.now() };
                              }
                          }
                          nearbyWifiUsers = Object.values(mapByPub);
                      }
                  } catch (e) {
                      console.warn('Nearby Wi-Fi scan error:', e);
                  } finally {
                      isScanningNearby = false;
                  }
              }

              async function connectToNearbyUser(u) {
                  try {
                      await AppActions.AddContact(u.nick, u.pub);
                      showNearbyWifiModal = false;
                      location.reload();
                  } catch (e) {
                      alert('Ошибка подключения: ' + e);
                  }
              }
              """
              if "function openNearbyWifiRadar()" not in sb:
                  sb = sb.replace("</script>", nearby_js + "\n</script>", 1)

              # Добавляем кнопку "📡 Люди рядом (Wi-Fi)" рядом с "+ Сторис 24ч" в мобильной и десктопной ленте
              nearby_circle_btn = """
                  <div on:click={openNearbyWifiRadar} role="button" tabindex="0" on:keydown={(e) => e.key === 'Enter' && openNearbyWifiRadar()} style="display: flex; flex-direction: column; align-items: center; cursor: pointer; min-width: 68px;">
                      <div style="width: 52px; height: 52px; border-radius: 50%; background: linear-gradient(135deg, #172554, #1E3A8A); border: 2px solid #60A5FA; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #fff; box-shadow: 0 4px 12px rgba(29,78,216,0.35);">📡</div>
                      <span style="font-size: 11px; color: #60A5FA; font-weight: 600; margin-top: 4px; white-space: nowrap;">Люди рядом</span>
                  </div>"""

              sb = sb.replace(
                  '<span style="font-size: 11px; color: #8AB4F8; font-weight: 600; margin-top: 4px; white-space: nowrap;">+ Сторис 24ч</span>\n            </div>',
                  '<span style="font-size: 11px; color: #8AB4F8; font-weight: 600; margin-top: 4px; white-space: nowrap;">+ Сторис 24ч</span>\n            </div>\n' + nearby_circle_btn,
                  1
              )

              nearby_modal_html = """
          {#if showNearbyWifiModal}
              <div style="position: fixed; inset: 0; background: rgba(10,11,16,0.92); backdrop-filter: blur(12px); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px;">
                  <div style="background: #1A1C20; border: 1px solid rgba(59,130,246,0.3); border-radius: 24px; padding: 20px; width: 100%; max-width: 380px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
