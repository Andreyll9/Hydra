name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sync App with Hydra Relay v2.5 & Apply All Stage 5 Features Safely
        run: |
          cat << 'PYEOF' > sync_relay_v25.py
          import os, re, struct, zlib

          # 0. Генерируем фирменную иконку Гидры (Тёмно-синий + Голубой неон на тёмно-сером графите) для Android и Уведомлений
          def create_hydra_png(path, size=192):
              raw_data = bytearray()
              cx, cy = size / 2.0, size / 2.0
              r_outer = size * 0.44
              r_inner = size * 0.38
              for y in range(size):
                  raw_data.append(0)
                  for x in range(size):
                      dx, dy = x - cx, y - cy
                      dist = (dx*dx + dy*dy) ** 0.5
                      if dist > r_outer:
                          raw_data.extend((18, 19, 22, 255))
                      elif dist > r_inner:
                          raw_data.extend((29, 78, 216, 255))
                      else:
                          nx, ny = dx / r_inner, dy / r_inner
                          is_center = abs(nx) < 0.14 and -0.55 < ny < 0.55
                          is_left = -0.52 < nx < -0.24 and -0.40 < ny < 0.35
                          is_right = 0.24 < nx < 0.52 and -0.40 < ny < 0.35
                          is_base = abs(nx) < 0.48 and 0.20 < ny < 0.42
                          if is_center or is_left or is_right or is_base:
                              raw_data.extend((96, 165, 250, 255))
                          else:
                              raw_data.extend((22, 25, 32, 255))
              def png_chunk(chunk_type, data):
                  return struct.pack(">I", len(data)) + chunk_type + data + struct.pack(">I", zlib.crc32(chunk_type + data) & 0xffffffff)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png_bytes = b"\x89PNG\r\n\x1a\n" + png_chunk(b"IHDR", ihdr) + png_chunk(b"IDAT", zlib.compress(bytes(raw_data), 9)) + png_chunk(b"IEND", b"")
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "wb") as f:
                  f.write(png_bytes)

          for mip in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
              create_hydra_png(f"android/app/src/main/res/{mip}/ic_launcher.png", 192)
              create_hydra_png(f"android/app/src/main/res/{mip}/ic_launcher_round.png", 192)
              create_hydra_png(f"android/app/src/main/res/{mip}/ic_launcher_foreground.png", 192)
          create_hydra_png("frontend/public/icon.png", 192)
          print("[OK] 0. Иконка Гидры сгенерирована")

          # 1. TeleGhostService.kt: тихое энергосберегающее уведомление с иконкой Гидры
          svc_path = "android/app/src/main/java/com/teleghost/app/TeleGhostService.kt"
          if os.path.exists(svc_path):
              with open(svc_path, "r", encoding="utf-8") as f:
                  svc = f.read()
              svc = svc.replace("NotificationManager.IMPORTANCE_LOW", "NotificationManager.IMPORTANCE_MIN")
              svc = svc.replace("NotificationManager.IMPORTANCE_DEFAULT", "NotificationManager.IMPORTANCE_MIN")
              svc = svc.replace('"TeleGhost Background Service"', '"Hydra E2EE • Тихий режим"')
              svc = svc.replace('"Maintaining I2P connection..."', '"Защищённый канал активен (энергосбережение)"')
              with open(svc_path, "w", encoding="utf-8") as f:
                  f.write(svc)
              print("[OK] 1. TeleGhostService.kt переведён в тихий режим")

          # 2. internal/appcore/contacts.go:
          #    - Чистый код без неиспользуемого "log"
          #    - Автоматическое определение @ника по ключу через /nick/resolve?pub=... на твоём обновлённом VPS!
          contacts_go = '''package appcore

          import (
          	"encoding/json"
          	"fmt"
          	"io"
          	"net/http"
          	"net/url"
          	"strings"
          	"time"

          	"teleghost/internal/core"
          	"teleghost/internal/core/identity"

          	"github.com/google/uuid"
          )

          func resolveNickByPubFromVPS(pub string) string {
          	pub = strings.TrimSpace(pub)
          	if len(pub) < 32 {
          		return ""
          	}
          	client := &http.Client{Timeout: 3 * time.Second}
          	resp, err := client.Get("http://191.223.137.164:8085/nick/resolve?pub=" + url.QueryEscape(pub))
          	if err != nil || resp == nil {
          		return ""
          	}
          	defer resp.Body.Close()
          	if resp.StatusCode == http.StatusOK {
          		body, _ := io.ReadAll(resp.Body)
          		var res map[string]string
          		if json.Unmarshal(body, &res) == nil && res["nickname"] != "" {
          			n := strings.TrimPrefix(res["nickname"], "@")
          			return "@" + n
          		}
          	}
          	return ""
          }

          func (a *AppCore) GetContacts() ([]*ContactInfo, error) {
          	if a.Repo == nil {
          		return []*ContactInfo{}, nil
          	}
          	contacts, err := a.Repo.ListContactsWithLastMessage(a.Ctx)
          	if err != nil {
          		return nil, err
          	}
          	result := make([]*ContactInfo, len(contacts))
          	for i, c := range contacts {
          		updated := false
          		if c.PublicKey == "" && len(c.I2PAddress) >= 32 {
          			c.PublicKey = c.I2PAddress
          			updated = true
          		}
          		if c.ChatID == "" && a.Identity != nil && a.Identity.Keys != nil && c.PublicKey != "" {
          			c.ChatID = identity.CalculateChatID(a.Identity.Keys.PublicKeyBase64, c.PublicKey)
          			updated = true
          		}
          		if (len(c.Nickname) > 28 && !strings.Contains(c.Nickname, " ")) || strings.HasPrefix(c.Nickname, "Unknown") || strings.HasPrefix(c.Nickname, "Контакт ") {
          			if resolved := resolveNickByPubFromVPS(c.I2PAddress); resolved != "" {
          				c.Nickname = resolved
          				updated = true
          			}
          		}
          		if updated {
          			_ = a.Repo.SaveContact(a.Ctx, c)
          		}
          		info := &ContactInfo{
          			ID:          c.ID,
          			Nickname:    c.Nickname,
          			Bio:         c.Bio,
          			Avatar:      a.formatAvatarURL(c.Avatar),
          			I2PAddress:  c.I2PAddress,
          			PublicKey:   c.PublicKey,
          			ChatID:      c.ChatID,
          			IsBlocked:   c.IsBlocked,
          			IsVerified:  c.IsVerified,
          			UnreadCount: c.UnreadCount,
          		}
          		if c.LastMessage != "" {
          			info.LastMessage = c.LastMessage
          			tm := c.LastMessageTime
          			info.LastMessageTime = &tm
          		}
          		result[i] = info
          	}
          	return result, nil
          }

          func (a *AppCore) AddContact(name, destination string) (*ContactInfo, error) {
          	if a.Repo == nil || a.Identity == nil || a.Identity.Keys == nil {
          		return nil, fmt.Errorf("not logged in")
          	}
          	name = strings.TrimSpace(name)
          	destination = strings.TrimSpace(destination)

          	if strings.HasPrefix(destination, "@") || (len(destination) >= 3 && len(destination) < 32 && !strings.Contains(destination, "/")) {
          		cleanNick := strings.ToLower(strings.TrimPrefix(destination, "@"))
          		client := &http.Client{Timeout: 8 * time.Second}
          		resp, err := client.Get("http://191.223.137.164:8085/nick/resolve?nick=" + url.QueryEscape(cleanNick))
          		if err != nil {
          			return nil, fmt.Errorf("нет связи с сервером никнеймов: %v", err)
          		}
          		defer resp.Body.Close()
          		if resp.StatusCode != http.StatusOK {
          			return nil, fmt.Errorf("пользователь @%s не найден на сервере", cleanNick)
          		}
          		body, _ := io.ReadAll(resp.Body)
          		var res map[string]string
          		if json.Unmarshal(body, &res) == nil && res["pub_key"] != "" {
          			destination = strings.TrimSpace(res["pub_key"])
          			if name == "" || strings.HasPrefix(name, "Контакт ") || len(name) > 28 {
          				name = "@" + cleanNick
          			}
          		}
          	}

          	if len(destination) < 32 {
          		return nil, fmt.Errorf("некорректный ID ключ Hydra (введите @никнейм или отсканируйте QR-код)")
          	}

          	if name == "" || (len(name) > 28 && !strings.Contains(name, " ")) || strings.HasPrefix(name, "Контакт ") {
          		if resolved := resolveNickByPubFromVPS(destination); resolved != "" {
          			name = resolved
          		} else if name == "" || len(name) > 28 {
          			name = "Контакт " + destination[:6]
          		}
          	}

          	myPub := a.Identity.Keys.PublicKeyBase64
          	chatID := identity.CalculateChatID(myPub, destination)

          	if existing, _ := a.Repo.GetContactByPublicKey(a.Ctx, destination); existing != nil {
          		existing.Nickname = name
          		existing.I2PAddress = destination
          		existing.PublicKey = destination
          		existing.ChatID = chatID
          		_ = a.Repo.SaveContact(a.Ctx, existing)
          		a.Emitter.Emit("contact_updated")
          		return &ContactInfo{
          			ID:         existing.ID,
          			Nickname:   existing.Nickname,
          			I2PAddress: existing.I2PAddress,
          			PublicKey:  existing.PublicKey,
          			ChatID:     existing.ChatID,
          		}, nil
          	}

          	contact := &core.Contact{
          		ID:         uuid.New().String(),
          		Nickname:   name,
          		I2PAddress: destination,
          		PublicKey:  destination,
          		ChatID:     chatID,
          		AddedAt:    time.Now(),
          		UpdatedAt:  time.Now(),
          	}
          	if err := a.Repo.SaveContact(a.Ctx, contact); err != nil {
          		return nil, err
          	}
          	if a.Messenger != nil {
          		go func(dst string) { _ = a.Messenger.SendHandshake(dst) }(destination)
          	}
          	a.Emitter.Emit("contact_updated")
          	return &ContactInfo{
          		ID:         contact.ID,
          		Nickname:   contact.Nickname,
          		I2PAddress: contact.I2PAddress,
          		PublicKey:  contact.PublicKey,
          		ChatID:     contact.ChatID,
          	}, nil
          }

          func (a *AppCore) AddContactFromClipboard(name string) (*ContactInfo, error) {
          	data, err := a.Platform.ClipboardGet()
          	if err != nil {
          		return nil, fmt.Errorf("clipboard error: %w", err)
          	}
          	if data == "" {
          		return nil, fmt.Errorf("clipboard is empty")
          	}
          	return a.AddContact(name, data)
          }

          func (a *AppCore) DeleteContact(id string) error {
          	if a.Repo == nil {
          		return fmt.Errorf("not logged in")
          	}
          	err := a.Repo.DeleteContact(a.Ctx, id)
          	if err == nil {
          		a.Emitter.Emit("contact_updated")
          	}
          	return err
          }
          '''
          with open("internal/appcore/contacts.go", "w", encoding="utf-8") as f:
              f.write(contacts_go)
          print("[OK] 2. contacts.go записан")

          # 3. internal/appcore/messages.go и appcore.go:
          msg_path = "internal/appcore/messages.go"
          if os.path.exists(msg_path):
              with open(msg_path, "r", encoding="utf-8") as f:
                  mc = f.read()

              old_send_block = """	if contactID != a.Identity.Keys.UserID {
          		if err := a.Messenger.SendTextMessageWithID(contact.I2PAddress, contact.ChatID, msgID, text, replyToID); err != nil {
          			log.Printf("[AppCore] SendTextMessage error to %s: %v", contact.Nickname, err)
          			return fmt.Errorf("send failed: %w", err)
          		}
          	}"""

              new_send_block = """	if contactID != a.Identity.Keys.UserID {
          		if relayErr := a.SendViaVPSRelay(contact.I2PAddress, contact.ChatID, msgID, text, replyToID); relayErr != nil {
          			log.Printf("[AppCore] VPS Relay error to %s: %v, trying fallback messenger...", contact.Nickname, relayErr)
          			if a.Messenger != nil {
          				if err := a.Messenger.SendTextMessageWithID(contact.I2PAddress, contact.ChatID, msgID, text, replyToID); err != nil {
          					return fmt.Errorf("ошибка отправки: %w", relayErr)
          				}
          			} else {
          				return fmt.Errorf("нет связи с релеем: %w", relayErr)
          			}
          		}
          	}"""
              mc = mc.replace(old_send_block, new_send_block)
              with open(msg_path, "w", encoding="utf-8") as f:
                  f.write(mc)
              print("[OK] 3. messages.go обновлён")

          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          gc = f.read()
                      orig = gc
                      gc = gc.replace('"2.0.0-hydra"', '"2.5.0-hydra"')
                      gc = gc.replace('"1.0.2-beta"', '"2.5.0-hydra"')
                      if "func (a *AppCore) GetMyInfo()" in gc:
                          gc = gc.replace("Destination: dest,", "Destination: a.Identity.Keys.PublicKeyBase64,")
                      if gc != orig:
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(gc)

          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()
              if '"net/url"' not in ac:
                  ac = ac.replace('"net/http"', '"net/http"\n\t"net/url"', 1)

              ac = ac.replace(
                  '	if err := a.Messenger.Start(a.Ctx); err != nil {\n\t\ta.SetNetworkStatus(StatusError)\n\t\treturn\n\t}',
                  '	if err := a.Messenger.Start(a.Ctx); err != nil {\n\t\tlog.Printf("[AppCore] Using Direct VPS Relay v2.5 (191.223.137.164:8085)")\n\t}\n\ta.SetNetworkStatus(StatusOnline)\n\tgo a.StartVPSRelayLoop()'
              )

              ac = ac.replace(
                  '	for _, p := range profilesList {\n\t\tif p.UserID == a.Identity.Keys.UserID {\n\t\t\treturn map[string]interface{}{\n\t\t\t\t"id":           p.ID,\n\t\t\t\t"display_name": p.DisplayName,\n\t\t\t\t"user_id":      p.UserID,\n\t\t\t\t"avatar_path":  a.formatProfileAvatarURL(p.UserID, p.AvatarPath),\n\t\t\t\t"use_pin":      p.UsePin,\n\t\t\t}\n\t\t}\n\t}\n\treturn nil\n}',
                  '	for _, p := range profilesList {\n\t\tif p.UserID == a.Identity.Keys.UserID {\n\t\t\treturn map[string]interface{}{\n\t\t\t\t"id":           p.ID,\n\t\t\t\t"display_name": p.DisplayName,\n\t\t\t\t"user_id":      p.UserID,\n\t\t\t\t"avatar_path":  a.formatProfileAvatarURL(p.UserID, p.AvatarPath),\n\t\t\t\t"use_pin":      p.UsePin,\n\t\t\t}\n\t\t}\n\t}\n\tif a.Identity != nil && a.Identity.Keys != nil {\n\t\treturn map[string]interface{}{\n\t\t\t"id":           a.Identity.Keys.UserID,\n\t\t\t"display_name": "Hydra Account",\n\t\t\t"user_id":      a.Identity.Keys.UserID,\n\t\t\t"avatar_path":  "",\n\t\t\t"use_pin":      true,\n\t\t}\n\t}\n\treturn nil\n}'
              )

              ac = ac.replace(
                  "return zipPath, nil\n}",
                  "if a.Platform != nil {\n\t\t_ = a.Platform.ShareFile(zipPath)\n\t}\n\treturn zipPath, nil\n}",
                  1
              )

              vps_relay_methods = '''
          func (a *AppCore) SendViaVPSRelay(toPub, chatID, msgID, text, replyToID string) error {
          	if a.Identity == nil || a.Identity.Keys == nil {
          		return fmt.Errorf("no identity")
          	}
          	myPub := a.Identity.Keys.PublicKeyBase64
          	myNick := ""
          	if u, _ := a.Repo.GetMyProfile(a.Ctx); u != nil {
          		myNick = u.Nickname
          	}
          	env := map[string]interface{}{
          		"id":          msgID,
          		"from":        myPub,
          		"from_nick":   myNick,
          		"to":          strings.TrimSpace(toPub),
          		"chat_id":     chatID,
          		"content":     text,
          		"reply_to_id": replyToID,
          		"timestamp":   time.Now().UnixMilli(),
          	}
          	raw, _ := json.Marshal(env)
          	client := &http.Client{Timeout: 8 * time.Second}
          	resp, err := client.Post("http://191.223.137.164:8085/relay/send", "application/json", bytes.NewReader(raw))
          	if err != nil {
          		return err
          	}
          	defer resp.Body.Close()
          	if resp.StatusCode != http.StatusOK {
          		return fmt.Errorf("relay status %d", resp.StatusCode)
          	}
          	return nil
          }

          func (a *AppCore) StartVPSRelayLoop() {
          	seenIDs := make(map[string]bool)
          	client := &http.Client{Timeout: 8 * time.Second}
          	for {
          		select {
          		case <-a.Ctx.Done():
          			return
          		default:
          		}
          		if a.Identity != nil && a.Identity.Keys != nil && a.Repo != nil {
          			myPub := a.Identity.Keys.PublicKeyBase64
          			resp, err := client.Get("http://191.223.137.164:8085/relay/poll?pub=" + url.QueryEscape(myPub))
          			if err == nil && resp != nil {
          				if resp.StatusCode == http.StatusOK {
          					var items []map[string]interface{}
          					if json.NewDecoder(resp.Body).Decode(&items) == nil {
          						for _, item := range items {
          							mID, _ := item["id"].(string)
          							fromPub, _ := item["from"].(string)
          							fromNick, _ := item["from_nick"].(string)
          							content, _ := item["content"].(string)
          							replyTo, _ := item["reply_to_id"].(string)
          							if mID == "" || fromPub == "" || seenIDs[mID] {
          								continue
          							}
          							seenIDs[mID] = true
          							if existing, _ := a.Repo.GetMessage(a.Ctx, mID); existing != nil {
          								continue
          							}
          							msg := &core.Message{
          								ID:          mID,
          								SenderID:    fromPub,
          								SenderAddr:  fromPub,
          								Content:     content,
          								ContentType: "text",
          								Status:      core.MessageStatusDelivered,
          								IsOutgoing:  false,
          								Timestamp:   time.Now().UnixMilli(),
          								CreatedAt:   time.Now(),
          								UpdatedAt:   time.Now(),
          							}
          							if replyTo != "" {
          								msg.ReplyToID = &replyTo
          							}
          							a.OnMessageReceived(msg, fromPub, fromPub)
          							if fromNick != "" {
          								if c, _ := a.Repo.GetContactByPublicKey(a.Ctx, fromPub); c != nil {
          									if strings.HasPrefix(c.Nickname, "Unknown") || len(c.Nickname) > 28 {
          										c.Nickname = fromNick
          										_ = a.Repo.SaveContact(a.Ctx, c)
          										a.Emitter.Emit("contact_updated")
          									}
          								}
          							}
          						}
          					}
          				}
          				resp.Body.Close()
          			}
          		}
          		if a.IsFocused {
          			time.Sleep(3 * time.Second)
          		} else {
          			time.Sleep(15 * time.Second)
          		}
          	}
          }
          '''
              if "func (a *AppCore) SendViaVPSRelay(" not in ac:
                  ac += "\n" + vps_relay_methods
              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] 4. appcore.go обновлён")

          # 4. Обновляем версию APK до 2.5.0-hydra в android/app/build.gradle
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  bg = f.read()
              bg = re.sub(r'versionCode\s+\d+', 'versionCode 25', bg)
              bg = re.sub(r'versionName\s+"[^"]+"', 'versionName "2.5.0-hydra"', bg)
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(bg)

          # 5. Обновляем фронтенд (Svelte):
          hydra_svg = """<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="30" stroke="#3B82F6" stroke-width="2.5" fill="#121316"/><path d="M32 12C25 12 20 17 20 24C20 29 23 33 26 36L22 50H42L38 36C41 33 44 29 44 24C44 17 39 12 32 12Z" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(29,78,216,0.22)"/><path d="M20 26C14 24 10 19 12 13C15 15 19 18 21 22" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/><path d="M44 26C50 24 54 19 52 13C49 15 45 18 43 22" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/><circle cx="28" cy="23" r="2" fill="#60A5FA"/><circle cx="36" cy="23" r="2" fill="#60A5FA"/><path d="M27 30C29 32 35 32 37 30" stroke="#60A5FA" stroke-width="2" stroke-linecap="round"/></svg>"""

          icons_path = "frontend/src/Icons.js"
          if os.path.exists(icons_path):
              with open(icons_path, "r", encoding="utf-8") as f:
                  ic = f.read()
              ic = re.sub(r"Ghost:\s*`[\s\S]*?`", f"Ghost: `{hydra_svg}`", ic)
              with open(icons_path, "w", encoding="utf-8") as f:
                  f.write(ic)

          auth_path = "frontend/src/components/Auth.svelte"
          if os.path.exists(auth_path):
              with open(auth_path, "r", encoding="utf-8") as f:
                  au = f.read()
              au = au.replace(
                  '<img src="/icon.png" alt="Hydra" class="rounded-full shadow-lg" style="width: 80px; height: 80px; filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.4)); object-fit: cover; border: 2px solid rgba(255,255,255,0.1);" />',
