name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Security, Instant Biometric, Global Call Notif & Async Contacts Fixes (v3.1.1)
        run: |
          cat << 'PYEOF' > fix_v311.py
          import os, re

          # 1. Auth.svelte: мгновенный запуск биометрии без ожидания пинга сервера
          auth_path = "frontend/src/components/Auth.svelte"
          if os.path.exists(auth_path):
              with open(auth_path, "r", encoding="utf-8") as f:
                  au = f.read()

              old_bio = """    async function triggerBiometricUnlock() {
                  const profId = selectedProfile?.id || (allProfiles[0]?.id) || 'default';
                  await runStartupDiagnostics(profId);
                  if (localStorage.getItem('hydra_biometric') === '0') return;
                  if (window.HydraNative && typeof window.HydraNative.authenticateBiometric === 'function') {
                      if (!systemPermStatus.biometricBound) {
                          bioPromptStatus = 'ℹ️ Отпечаток ещё не привязан (введите ПИН и привяжите его в Настройки → Приватность)';
                          return;
                      }
                      bioPromptStatus = '👆 Приложите палец к сканеру...';
                      window.HydraNative.authenticateBiometric(profId);
                  }
              }"""

              new_bio = """    function triggerBiometricUnlock() {
                  const profId = selectedProfile?.id || (allProfiles[0]?.id) || 'default';
                  if (localStorage.getItem('hydra_biometric') === '0') return;
                  if (window.HydraNative && typeof window.HydraNative.checkSystemStatus === 'function') {
                      try {
                          const parsed = JSON.parse(window.HydraNative.checkSystemStatus(profId));
                          systemPermStatus = { ...systemPermStatus, ...parsed };
                      } catch (e) {}
                  }
                  if (window.HydraNative && typeof window.HydraNative.authenticateBiometric === 'function') {
                      if (!systemPermStatus.biometricBound) {
                          bioPromptStatus = 'ℹ️ Отпечаток ещё не привязан (введите ПИН и привяжите его в Настройки → Приватность)';
                          return;
                      }
                      bioPromptStatus = '👆 Приложите палец к сканеру...';
                      window.HydraNative.authenticateBiometric(profId);
                  }
                  runStartupDiagnostics(profId);
              }"""

              if old_bio in au:
                  au = au.replace(old_bio, new_bio, 1)
              else:
                  au = re.sub(
                      r"async function triggerBiometricUnlock\(\)\s*\{[\s\S]*?authenticateBiometric\(profId\);\s*\}\s*\}",
                      new_bio.strip(),
                      au,
                      count=1
                  )

              # Запускаем биометрию сразу после выбора PIN-профиля (100 мс вместо 300 мс)
              au = au.replace(
                  "setTimeout(() => { if (typeof triggerBiometricUnlock === 'function') triggerBiometricUnlock(); }, 300);\n        selectedProfile = p;",
                  "selectedProfile = p;\n        if (p.use_pin) setTimeout(() => { if (typeof triggerBiometricUnlock === 'function') triggerBiometricUnlock(); }, 100);"
              )

              with open(auth_path, "w", encoding="utf-8") as f:
                  f.write(au)
              print("[OK] 1. Auth.svelte: биометрия запускается мгновенно без ожидания сети")

          # 2. internal/network/messenger/messenger.go: обязательная подпись Ed25519 + E2EE подписей вложений
          ms_path = "internal/network/messenger/messenger.go"
          if os.path.exists(ms_path):
              with open(ms_path, "r", encoding="utf-8") as f:
                  ms = f.read()

              old_sig = """	if len(packet.Payload) > 0 && len(packet.Signature) > 0 {
          		if valid, err := identity.VerifySignatureBase64(senderPubKey, packet.Payload, packet.Signature); err != nil || !valid {
          			return
          		}
          	}"""

              new_sig = """	if len(packet.Payload) > 0 {
          		if len(packet.Signature) == 0 {
          			return
          		}
          		if valid, err := identity.VerifySignatureBase64(senderPubKey, packet.Payload, packet.Signature); err != nil || !valid {
          			return
          		}
          	}"""

              ms = ms.replace(old_sig, new_sig, 1)
              ms = ms.replace(
                  "Content:     content,\n\t\tTimestamp:   time.Now().UnixMilli(),\n\t\tMessageId:   messageID,\n\t\tAttachments: attachments,",
                  "Content:     s.identity.EncryptForPeer(destination, content),\n\t\tTimestamp:   time.Now().UnixMilli(),\n\t\tMessageId:   messageID,\n\t\tAttachments: attachments,"
              )

              with open(ms_path, "w", encoding="utf-8") as f:
                  f.write(ms)
              print("[OK] 2. messenger.go: проверка подписи Ed25519 стала обязательной, подписи вложений зашифрованы")

          # 3. internal/appcore/contacts.go: асинхронный резолв Unknown-ников без блокировки GetContacts
          ct_path = "internal/appcore/contacts.go"
          if os.path.exists(ct_path):
              with open(ct_path, "r", encoding="utf-8") as f:
                  ct = f.read()

              old_res = """		if (len(c.Nickname) > 28 && !strings.Contains(c.Nickname, " ")) || strings.HasPrefix(c.Nickname, "Unknown") || strings.HasPrefix(c.Nickname, "Контакт ") {
          			if resolved := resolveNickByPubFromVPS(c.I2PAddress); resolved != "" {
          				c.Nickname = resolved
          				updated = true
          			}
          		}"""

              new_res = """		if (len(c.Nickname) > 28 && !strings.Contains(c.Nickname, " ")) || strings.HasPrefix(c.Nickname, "Unknown") || strings.HasPrefix(c.Nickname, "Контакт ") {
          			cCopy := *c
          			go func(cc core.Contact) {
          				if resolved := resolveNickByPubFromVPS(cc.I2PAddress); resolved != "" {
          					cc.Nickname = resolved
          					if a.Repo != nil {
          						_ = a.Repo.SaveContact(a.Ctx, &cc)
          						a.Emitter.Emit("contact_updated")
          					}
          				}
          			}(cCopy)
          		}"""

              ct = ct.replace(old_res, new_res, 1)
              with open(ct_path, "w", encoding="utf-8") as f:
                  f.write(ct)
              print("[OK] 3. contacts.go: резолв ников переведён в фоновую горутину")

          # 4. App.svelte + Chat.svelte: глобальный приём/отклонение звонка из уведомления с любого экрана
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              global_call_handler = """        window.__onHydraCallNotifAction = async (senderNick, action) => {
                      if (typeof window.__onHydraChatCallAction === 'function') {
                          window.__onHydraChatCallAction(senderNick, action);
                          return;
                      }
                      const list = (contacts && contacts.length > 0) ? contacts : (await AppActions.GetContacts().catch(() => []));
                      const target = (list || []).find(c => (c.Nickname || '').toLowerCase().includes((senderNick || '').toLowerCase()));
                      if (target) {
                          window.__pendingHydraCallAction = { senderNick, action, ts: Date.now() };
                          selectContact(target);
                      }
                  };
          """
              if "__onHydraCallNotifAction" not in ap:
                  ap = ap.replace(
                      "window.__onHydraDirectReply = async",
                      global_call_handler + "\n        window.__onHydraDirectReply = async",
                      1
                  )

              global_sig_listener = """    EventsOn("hydra_call_signal", (sig) => {
                  if (sig && sig.content && String(sig.content).startsWith('[HYDRA_CALL_RING]:')) {
                      window.__lastIncomingCallOffer = { ...sig, ts: Date.now() };
                  } else if (sig && sig.content && (String(sig.content).startsWith('[HYDRA_CALL_END]:') || String(sig.content).startsWith('[HYDRA_CALL_MISSED]:'))) {
                      window.__lastIncomingCallOffer = null;
                  }
              });

              EventsOn("unread_count","""
              if "__lastIncomingCallOffer" not in ap:
                  ap = ap.replace('EventsOn("unread_count",', global_sig_listener, 1)

              with open(app_path, "w", encoding="utf-8") as f:
                  f.write(ap)
              print("[OK] 4a. App.svelte: добавлен глобальный перехват звонков и кнопок уведомлений")

          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              ch = ch.replace("window.__onHydraCallNotifAction =", "window.__onHydraChatCallAction =")

              pending_call_check = """
              $: if (selectedContact && typeof window !== 'undefined' && window.__pendingHydraCallAction) {
                  const pAct = window.__pendingHydraCallAction;
                  if (Date.now() - pAct.ts < 15000) {
                      window.__pendingHydraCallAction = null;
                      const lastSig = window.__lastIncomingCallOffer;
                      if (lastSig && lastSig.content && Date.now() - lastSig.ts < 45000 && !incomingCallOffer) {
                          incomingCallOffer = String(lastSig.content).slice('[HYDRA_CALL_RING]:'.length);
                          activeCallModal = true;
                          callConnected = false;
                      }
                      setTimeout(() => {
                          if (pAct.action === 'accept_call') acceptIncomingHydraCall();
                          else if (pAct.action === 'decline_call') endHydraCall(true);
                      }, 150);
                  } else {
                      window.__pendingHydraCallAction = null;
                  }
              }
              """
              if "__pendingHydraCallAction" not in ch:
                  ch = ch.replace(
                      "window.__onHydraChatCallAction =",
                      pending_call_check + "\n        window.__onHydraChatCallAction =",
                      1
                  )

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 4b. Chat.svelte: привязан автоприём отложенного звонка из шторки уведомлений")
          PYEOF
          python3 fix_v311.py
          rm -f fix_v311.py
          gofmt -w internal/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.1.1 Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.1.1: instant biometric unlock, mandatory Ed25519 WS verify, global call notification actions & async contact nick resolve [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.1.1-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
