name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply UI, Background Call Audio, Sticker Packs & Group Profile Fixes (v3.0.2)
        run: |
          cat << 'PYEOF' > fix_v302.py
          import os, re

          # 1. MainActivity.kt: не глушим WebView и звук в onPause(), пока активен звонок
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()

              if "private var isCallActive = false" not in kt:
                  kt = kt.replace(
                      "private var pausedAtMs: Long = 0L",
                      "private var pausedAtMs: Long = 0L\n    private var isCallActive = false"
                  )

              if "fun setCallActive(" not in kt:
                  kt = kt.replace(
                      "fun setScreenshotProtection(enabled: Boolean) {",
                      """@JavascriptInterface
                  fun setCallActive(active: Boolean) {
                      isCallActive = active
                  }

                  @JavascriptInterface
                  fun setScreenshotProtection(enabled: Boolean) {"""
                  )

              old_on_pause = """    override fun onPause() {
                  try {
                      val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                      if (am.mode != android.media.AudioManager.MODE_NORMAL) {
                          am.mode = android.media.AudioManager.MODE_NORMAL
                      }
                  } catch (_: Exception) {}
                  if (!isOpeningSystemPicker) {
                      pausedAtMs = System.currentTimeMillis()
                      webView.evaluateJavascript("if(window.__setHydraBlur) window.__setHydraBlur(true);", null)
                  }
                  webView.onPause()
                  super.onPause()
              }"""

              new_on_pause = """    override fun onPause() {
                  if (!isCallActive) {
                      try {
                          val am = getSystemService(Context.AUDIO_SERVICE) as android.media.AudioManager
                          if (am.mode != android.media.AudioManager.MODE_NORMAL) {
                              am.mode = android.media.AudioManager.MODE_NORMAL
                          }
                      } catch (_: Exception) {}
                  }
                  if (!isOpeningSystemPicker && !isCallActive) {
                      pausedAtMs = System.currentTimeMillis()
                      webView.evaluateJavascript("if(window.__setHydraBlur) window.__setHydraBlur(true);", null)
                  }
                  if (!isCallActive) {
                      webView.onPause()
                  }
                  super.onPause()
              }"""
              kt = kt.replace(old_on_pause, new_on_pause)
              with open(kt_path, "w", encoding="utf-8") as f:
                  f.write(kt)
              print("[OK] 1. MainActivity.kt: фоновый звук во время звонка защищён от паузы WebView")

          # 2. internal/appcore/appcore.go & frontend/src/utils.js: превью "🎨 Стикер" вместо base64
          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()
              if '[HYDRA_STICKER]:' not in ac:
                  ac = ac.replace(
                      '} else if strings.HasPrefix(message, "[HYDRA_VIDEO]:") {',
                      '} else if strings.HasPrefix(message, "[HYDRA_STICKER]:") {\n\t\t\tmessage = "🎨 Стикер"\n\t\t} else if strings.HasPrefix(message, "[HYDRA_VIDEO]:") {'
                  )
              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)

          ut_path = "frontend/src/utils.js"
          if os.path.exists(ut_path):
              with open(ut_path, "r", encoding="utf-8") as f:
                  ut = f.read()
              if "[HYDRA_STICKER]:" not in ut:
                  ut = ut.replace(
                      "if (s.startsWith('[HYDRA_VIDEO]:'))",
                      "if (s.startsWith('[HYDRA_STICKER]:')) return '🎨 Стикер';\n    if (s.startsWith('[HYDRA_VIDEO]:'))"
                  )
                  ut = ut.replace(
                      "if (text.startsWith('[HYDRA_VIDEO]:'))",
                      "if (text.startsWith('[HYDRA_STICKER]:')) return '🎨 Стикер';\n    if (text.startsWith('[HYDRA_VIDEO]:'))"
                  )
              with open(ut_path, "w", encoding="utf-8") as f:
                  f.write(ut)
              print("[OK] 2. Превью стикера в чатах и уведомлениях заменено на '🎨 Стикер'")

          # 3. Modals.svelte: чиним @горемне (surrogate pair) и сплющенные вкладки Фото и медиа / Файлы / Голосовые
          md_path = "frontend/src/components/Modals.svelte"
          if os.path.exists(md_path):
              with open(md_path, "r", encoding="utf-8") as f:
                  md = f.read()

              md = md.replace(".replace(/^[👥📢]\\s*/, '')", ".replace(/^(?:👥|📢)\\s*/, '')")
              md = md.replace(
                  '<div style="display: flex; gap: 8px; padding: 6px 16px; margin-bottom: 10px; overflow-x: auto;">',
                  '<div style="display: flex; gap: 8px; padding: 8px 16px; margin-bottom: 10px; overflow-x: auto; flex-shrink: 0; align-items: center;">'
              )
              md = md.replace('>Медиа</button>', '>Фото и медиа</button>')

              with open(md_path, "w", encoding="utf-8") as f:
                  f.write(md)
              print("[OK] 3. Modals.svelte: исправлен @ник группы и высота вкладок медиа")

          # 4. Sidebar.svelte: синяя полоска "Активный вызов" между шапкой Hydra и Поиском
          sb_path = "frontend/src/components/Sidebar.svelte"
          if os.path.exists(sb_path):
              with open(sb_path, "r", encoding="utf-8") as f:
                  sb = f.read()

              if "let sidebarActiveCall =" not in sb:
                  sb = sb.replace(
                      "let longPressTimer;",
                      """let longPressTimer;
              let sidebarActiveCall = typeof window !== 'undefined' ? (window.__hydraActiveCall || null) : null;
              if (typeof window !== 'undefined') {
                  window.addEventListener('hydra-call-banner', () => {
                      sidebarActiveCall = window.__hydraActiveCall || null;
                  });
              }"""
                  )

              banner_html = """        {#if sidebarActiveCall}
                      <div on:click={() => { if (sidebarActiveCall?.contact && onSelectContact) onSelectContact(sidebarActiveCall.contact); }} style="background: linear-gradient(90deg, #1D4ED8, #2563EB); color: #fff; padding: 9px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 800; cursor: pointer; flex-shrink: 0;">
                          <span>📞 Активный вызов: {sidebarActiveCall.nick || 'Hydra'}</span>
                          <span style="font-size: 11px; opacity: 0.9;">Вернуться ›</span>
                      </div>
                  {/if}
                  <!-- Mobile Search -->"""

              if "sidebarActiveCall" in sb and "📞 Активный вызов:" not in sb:
                  sb = sb.replace("<!-- Mobile Search -->", banner_html, 1)

              with open(sb_path, "w", encoding="utf-8") as f:
                  f.write(sb)
              print("[OK] 4. Sidebar.svelte: добавлена полоска активного вызова между Hydra и Поиском")

          # 5. Chat.svelte:
          # - фикс длинного ника и статуса в шапке
          # - синяя полоска "Активный вызов" строго ПОД шапкой профиля
          # - вызов HydraNative.setCallActive(true/false)
          # - разделение стикеров на паки с вкладками
          ch_path = "frontend/src/components/Chat.svelte"
          if os.path.exists(ch_path):
              with open(ch_path, "r", encoding="utf-8") as f:
                  ch = f.read()

              # Фикс переполнения ника и переноса статуса "В сети"
              ch = ch.replace(
                  '<div>\n                <div class="chat-name">{selectedContact?.Nickname || \'Unknown\'}</div>',
                  '<div style="min-width: 0; flex: 1; overflow: hidden;">\n                <div class="chat-name">{selectedContact?.Nickname || \'Unknown\'}</div>'
              )
              ch = ch.replace(
                  '.chat-status { display: flex; align-items: center; gap: 6px; }',
                  '.chat-status { display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }'
              )
              ch = ch.replace('max-width: 145px !important;', 'max-width: 100% !important;')

              # Уведомляем Android Native и Sidebar о статусе звонка
              ch = ch.replace(
                  "activeCallModal = true;\n        callConnected = false;",
                  "activeCallModal = true;\n        callMinimized = false;\n        callConnected = false;\n        if (window.HydraNative?.setCallActive) window.HydraNative.setCallActive(true);\n        window.__hydraActiveCall = { nick: selectedContact?.Nickname, contact: selectedContact };\n        window.dispatchEvent(new Event('hydra-call-banner'));"
              )
              ch = ch.replace(
                  "activeCallModal = false;",
                  "activeCallModal = false;\n        callMinimized = false;\n        if (window.HydraNative?.setCallActive) window.HydraNative.setCallActive(false);\n        window.__hydraActiveCall = null;\n        window.dispatchEvent(new Event('hydra-call-banner'));"
              )

              # Полоска "Активный вызов" строго ПОД шапкой профиля (не position: fixed!)
              ch = re.sub(
                  r'\{#if activeCallModal && callMinimized\}[\s\S]*?\{/if\}',
                  '''{#if activeCallModal && callMinimized}
              <div on:click={() => callMinimized = false} style="background: linear-gradient(90deg, #1D4ED8, #2563EB); color: #fff; padding: 9px 16px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 800; cursor: pointer; flex-shrink: 0; border-bottom: 1px solid rgba(255,255,255,0.12);">
                  <span>📞 Активный вызов: {selectedContact?.Nickname || 'Hydra'}</span>
                  <div style="display: flex; align-items: center; gap: 8px;">
                      <span style="font-size: 11px; opacity: 0.9;">Развернуть</span>
                      <button type="button" on:click|stopPropagation={() => endHydraCall(true)} style="background: #EF4444; color: #fff; border: none; border-radius: 100px; padding: 4px 10px; font-size: 11px; font-weight: 800;">📴</button>
                  </div>
              </div>
          {/if}''',
                  ch,
                  count=1
              )

              # Разделение стикеров на паки с вкладками
              pack_vars = """
              let stickerPacks = [];
              let activeStickerPackIdx = 0;
              try {
                  stickerPacks = JSON.parse(localStorage.getItem('hydra_sticker_packs_v1') || '[]');
                  if (stickerPacks.length === 0 && customStickers.length > 0) {
                      stickerPacks = [{ title: 'Мои стикеры', stickers: customStickers }];
                  }
              } catch (e) { stickerPacks = []; }
              $: visibleStickers = stickerPacks[activeStickerPackIdx]?.stickers || customStickers;
              """
              if "let stickerPacks =" not in ch:
                  ch = ch.replace("let tgStickerUrl = '';", pack_vars + "\n    let tgStickerUrl = '';", 1)

              # Сохраняем загруженный пак как отдельную вкладку
              old_merge = "const merged = [...data.stickers, ...customStickers.filter(s => !data.stickers.includes(s))].slice(0, 80);"
              new_merge = """const packTitle = data.title || 'Пак Telegram';
                      const existingIdx = stickerPacks.findIndex(p => p.title === packTitle);
                      if (existingIdx !== -1) {
                          stickerPacks[existingIdx] = { title: packTitle, stickers: data.stickers };
                          activeStickerPackIdx = existingIdx;
                      } else {
                          stickerPacks = [{ title: packTitle, stickers: data.stickers }, ...stickerPacks].slice(0, 8);
                          activeStickerPackIdx = 0;
                      }
                      try { localStorage.setItem('hydra_sticker_packs_v1', JSON.stringify(stickerPacks)); } catch (e) {}
                      const merged = [...data.stickers, ...customStickers.filter(s => !data.stickers.includes(s))].slice(0, 80);"""
              ch = ch.replace(old_merge, new_merge)

              # Добавляем полоску вкладок паков над сеткой и используем visibleStickers
              pack_tabs_ui = """{#if stickerPacks.length > 0}
                                      <div style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 6px;">
                                          {#each stickerPacks as pack, pIdx}
                                              <button type="button" on:click={() => activeStickerPackIdx = pIdx} style="padding: 4px 10px; border-radius: 100px; border: none; font-size: 11px; font-weight: 700; white-space: nowrap; cursor: pointer; background: {activeStickerPackIdx === pIdx ? '#2563EB' : '#28292D'}; color: #fff;">
                                                  {pack.title} ({pack.stickers.length})
                                              </button>
                                          {/each}
                                      </div>
                                  {/if}
                                  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 180px; overflow-y: auto;">
                                      {#each visibleStickers as stUrl}"""

              ch = ch.replace(
                  '<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-height: 180px; overflow-y: auto;">\n                                      {#each customStickers as stUrl}',
                  pack_tabs_ui
              )

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)
              print("[OK] 5. Chat.svelte: фикс шапки, полоска звонка под профилем и вкладки стикерпаков готовы")
          PYEOF
          python3 fix_v302.py
          rm -f fix_v302.py
          gofmt -w internal/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.0.2 Fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.0.2: background call audio, sticker pack tabs, sticker preview text, call bar placement & group profile fixes [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.0.2-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
