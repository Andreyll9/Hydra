name: Build Hydra Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply Hydra v3.5.0 (In-App GitHub Updater & Version Sync)
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cat << 'PYEOF' > patch_v350.py
          import os, re

          gh_repo = os.environ.get("GH_REPO", "")
          ver_num = "3.5.0"
          ver_full = "3.5.0-hydra"

          # 1. Синхронизация версии до 3.5.0-hydra
          gr_path = "android/app/build.gradle"
          if os.path.exists(gr_path):
              with open(gr_path, "r", encoding="utf-8") as f:
                  gr = f.read()
              gr = re.sub(r'versionName\s+"[^"]+"', f'versionName "{ver_full}"', gr)
              gr = re.sub(r'versionCode\s+\d+', 'versionCode 350', gr)
              with open(gr_path, "w", encoding="utf-8") as f:
                  f.write(gr)
              print(f"[OK] 1. build.gradle обновлён до {ver_full}")

          for root, _, files in os.walk("internal/appcore"):
              for fn in files:
                  if fn.endswith(".go"):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          txt = f.read()
                      if "AppVersion:" in txt:
                          txt = re.sub(r'AppVersion:\s*"[^"]+"', f'AppVersion: "{ver_full}"', txt)
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(txt)

          # 2. MainActivity.kt: метод openExternalUrl для скачивания APK через системный загрузчик
          kt_path = "android/app/src/main/java/com/teleghost/app/MainActivity.kt"
          if os.path.exists(kt_path):
              with open(kt_path, "r", encoding="utf-8") as f:
                  kt = f.read()
              if "fun openExternalUrl(" not in kt:
                  ext_url_fn = """        @JavascriptInterface
                  fun openExternalUrl(url: String) {
                      runOnUiThread {
                          try {
                              isOpeningSystemPicker = true
                              val intent = Intent(Intent.ACTION_VIEW, android.net.Uri.parse(url))
                              startActivity(intent)
                          } catch (e: Exception) {
                              pushNativeLog("UPD-ERR", "Не удалось открыть ссылку: ${e.message}")
                          }
                      }
                  }

                  @JavascriptInterface
                  fun setCallActive("""
                  kt = kt.replace("@JavascriptInterface\n        fun setCallActive(", ext_url_fn, 1)
                  with open(kt_path, "w", encoding="utf-8") as f:
                      f.write(kt)
                  print("[OK] 2. MainActivity.kt: добавлен openExternalUrl")

          # 3. Settings.svelte: кнопка "Проверить обновления" через GitHub Releases API
          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()

              st = re.sub(r"aboutInfo\.app_version \|\| '[^']+'", f"aboutInfo.app_version || '{ver_full}'", st)

              updater_js = f"""
              const HYDRA_GH_REPO = "{gh_repo}";
              const HYDRA_LOCAL_VER = "{ver_num}";
              let updateChecking = false;
              let updateStatusText = '';
              let updateDownloadUrl = '';
              let updateLatestTag = '';

              function compareSemver(a, b) {{
                  const pa = String(a).replace(/^v/i, '').split('-')[0].split('.').map(Number);
                  const pb = String(b).replace(/^v/i, '').split('-')[0].split('.').map(Number);
                  for (let i = 0; i < 3; i++) {{
                      const diff = (pa[i] || 0) - (pb[i] || 0);
                      if (diff !== 0) return diff;
                  }}
                  return 0;
              }}

              async function checkHydraUpdates() {{
                  if (!HYDRA_GH_REPO) {{
                      updateStatusText = 'Репозиторий обновлений не задан';
                      return;
                  }}
                  updateChecking = true;
                  updateStatusText = 'Проверка обновлений...';
                  updateDownloadUrl = '';
                  try {{
                      const resp = await fetch('https://api.github.com/repos/' + HYDRA_GH_REPO + '/releases/latest', {{
                          headers: {{ 'Accept': 'application/vnd.github+json' }}
                      }});
                      if (!resp.ok) throw new Error('HTTP ' + resp.status);
                      const data = await resp.json();
                      const latestTag = data.tag_name || '';
                      const apkAsset = (data.assets || []).find(a => String(a.name || '').toLowerCase().endsWith('.apk'));
                      if (latestTag && compareSemver(latestTag, HYDRA_LOCAL_VER) > 0) {{
                          updateLatestTag = latestTag;
                          updateDownloadUrl = apkAsset ? apkAsset.browser_download_url : (data.html_url || '');
                          updateStatusText = 'Доступна новая версия ' + latestTag;
                      }} else {{
                          updateStatusText = '✅ Установлена последняя версия (v' + HYDRA_LOCAL_VER + ')';
                      }}
                  }} catch (e) {{
                      updateStatusText = '⚠️ Не удалось проверить обновления (проверьте интернет)';
                  }} finally {{
                      updateChecking = false;
                  }}
              }}

              function openHydraUpdateDownload() {{
                  if (!updateDownloadUrl) return;
                  if (window.HydraNative && typeof window.HydraNative.openExternalUrl === 'function') {{
                      window.HydraNative.openExternalUrl(updateDownloadUrl);
                  }} else {{
                      window.open(updateDownloadUrl, '_blank');
                  }}
              }}
              """

              if "function checkHydraUpdates()" not in st:
                  st = st.replace("<script>", "<script>\n" + updater_js, 1)
              else:
                  st = re.sub(r'const HYDRA_GH_REPO = "[^"]*";', f'const HYDRA_GH_REPO = "{gh_repo}";', st)
                  st = re.sub(r'const HYDRA_LOCAL_VER = "[^"]*";', f'const HYDRA_LOCAL_VER = "{ver_num}";', st)

              updater_ui = """
                  <div style="margin: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
                      <button type="button" on:click={checkHydraUpdates} disabled={updateChecking} style="padding: 10px 20px; border-radius: 100px; background: #1D4ED8; color: #fff; border: none; font-size: 13px; font-weight: 700; cursor: pointer; opacity: {updateChecking ? 0.65 : 1};">
                          {updateChecking ? '⏳ Проверяем...' : '🔄 Проверить обновления'}
                      </button>
                      {#if updateStatusText}
                          <div style="font-size: 12px; color: {updateDownloadUrl ? '#34D399' : '#9CA3AF'}; font-weight: 600; text-align: center;">
                              {updateStatusText}
                          </div>
                      {/if}
                      {#if updateDownloadUrl}
                          <button type="button" on:click={openHydraUpdateDownload} style="padding: 10px 22px; border-radius: 100px; background: #10B981; color: #fff; border: none; font-size: 13px; font-weight: 800; cursor: pointer;">
                              ⬇️ Скачать {updateLatestTag} (APK)
                          </button>
                      {/if}
                  </div>
              """

              if "checkHydraUpdates" in st and "Проверить обновления" not in st:
                  st = re.sub(
                      r'(Version\s*\{aboutInfo\.app_version[^}]*\}\s*</p>)',
                      r'\1\n' + updater_ui,
                      st,
                      count=1
                  )

              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print(f"[OK] 3. Settings.svelte: добавлена кнопка обновления для {gh_repo}")
          PYEOF
          python3 patch_v350.py
          rm -f patch_v350.py

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v3.5.0 Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Hydra v3.5.0: GitHub Releases auto-publish & in-app update checker [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR (Stripped)
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -ldflags="-s -w" -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Publish GitHub Release v3.5.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" Hydra-v3.5.0.apk
          if gh release view v3.5.0 >/dev/null 2>&1; then
            gh release upload v3.5.0 Hydra-v3.5.0.apk --clobber
          else
            gh release create v3.5.0 Hydra-v3.5.0.apk \
              --title "Hydra v3.5.0" \
              --notes "Hydra v3.5.0: автоматические обновления через GitHub Releases, стабильность UI для Android 7–15, защита подписи и R8."
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-v3.5.0-Signed-APK
          path: Hydra-v3.5.0.apk
