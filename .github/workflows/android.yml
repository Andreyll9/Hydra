              old_call_b = """            <button type="button" on:click={startHydraCall} style="background: #8AB4F8; color: #062E6F; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 8px rgba(138,180,248,0.35);" title="Позвонить (WebRTC E2EE)">
                          📞
                      </button>
                  </div>"""
              new_call_b = """            <button type="button" on:click={startHydraCall} style="background: #1D4ED8; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0;" title="Позвонить">📞</button>
                      <div style="position: relative;">
                          <button type="button" on:click|stopPropagation={() => showChatHeaderMenu = !showChatHeaderMenu} style="background: #22252A; color: #E5E7EB; border: 1px solid rgba(59,130,246,0.25); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; cursor: pointer;">⋮</button>
                          {#if showChatHeaderMenu}
                              <div style="position: fixed; top: 62px; right: 14px; background: #1A1C20; border: 1px solid rgba(59,130,246,0.3); border-radius: 16px; padding: 6px; z-index: 99995; min-width: 210px; box-shadow: 0 12px 32px rgba(0,0,0,0.7);">
                                  <button type="button" on:click={clearCurrentChatHistory} style="width: 100%; text-align: left; padding: 10px 12px; background: transparent; color: #E5E7EB; border: none; border-radius: 10px; font-size: 13px; cursor: pointer;">🧹 Очистить историю чата</button>
                                  {#if !selectedContact?.IsFavorites && selectedContact?.Nickname !== 'Избранное'}
                                      <button type="button" on:click={deleteCurrentChatContact} style="width: 100%; text-align: left; padding: 10px 12px; background: transparent; color: #ff6b6b; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">🗑️ Удалить чат</button>
                                  {/if}
                              </div>
                          {/if}
                      </div>
                  </div>"""
              ch = ch.replace(old_call_b, new_call_b)

              hide_play_css = """
              video::-webkit-media-controls-overlay-play-button,
              video::-webkit-media-controls-start-playback-button {
                  display: none !important;
                  -webkit-appearance: none !important;
                  opacity: 0 !important;
              }
              """
              if "video::-webkit-media-controls-start-playback-button" not in ch:
                  ch = ch.replace("</style>", hide_play_css + "\n</style>", 1)

              with open(ch_path, "w", encoding="utf-8") as f:
                  f.write(ch)

          # 7. Settings.svelte (БЕЗ ДУБЛИРОВАНИЯ let isRecordingLogs!)
          st_path = "frontend/src/components/Settings.svelte"
          if os.path.exists(st_path):
              with open(st_path, "r", encoding="utf-8") as f:
                  st = f.read()

              st = st.replace(".destination-details summary::before { content: '🌐'; font-size: 14px; }", ".destination-details summary::before { content: none; display: none; }")
              st = st.replace('<img src="/icon.png" alt="Hydra" style="width: 100%; height: 100%; object-fit: cover; border-radius: 28px;" />', hydra_svg)
              st = st.replace("{#if selectedProfile}", "{#if true}")
              st = st.replace("{#if selectedProfile.use_pin}", "{#if true}")
              st = st.replace("selectedProfile.use_pin", "selectedProfile?.use_pin")
              st = st.replace(
                  '.destination-box { \n        display: flex; align-items: flex-start; gap: 10px; padding: 20px;',
                  '.destination-box { \n        display: flex; flex-direction: column; align-items: stretch; gap: 12px; padding: 16px;'
              )

              if "let hideLastSeenEnabled =" not in st:
                  priv_only_js = """
              let hideLastSeenEnabled = localStorage.getItem('hydra_hide_last_seen') === '1';
              let hideNearbyWifiEnabled = localStorage.getItem('hydra_hide_nearby_wifi') === '1';

              function toggleHideLastSeen() {
                  hideLastSeenEnabled = !hideLastSeenEnabled;
                  localStorage.setItem('hydra_hide_last_seen', hideLastSeenEnabled ? '1' : '0');
              }
              function toggleHideNearbyWifi() {
                  hideNearbyWifiEnabled = !hideNearbyWifiEnabled;
                  localStorage.setItem('hydra_hide_nearby_wifi', hideNearbyWifiEnabled ? '1' : '0');
              }
              """
                  st = st.replace("let anonStoriesEnabled =", priv_only_js + "\n    let anonStoriesEnabled =", 1)

              if "let isRecordingLogs =" not in st:
                  rec_only_js = """
              let isRecordingLogs = typeof window !== 'undefined' ? !!window.__hydraLoggingActive : false;
              function toggleLogRecording() {
                  isRecordingLogs = !isRecordingLogs;
                  if (typeof window !== 'undefined') {
                      window.__hydraLoggingActive = isRecordingLogs;
                      localStorage.setItem('hydra_rec_logs', isRecordingLogs ? '1' : '0');
                      window.__addHydraLog('LOG-CTRL', isRecordingLogs ? '▶️ Запись логов ЗАПУЩЕНА' : '⏹ Запись логов ОСТАНОВЛЕНА');
                      refreshSettingsLogs();
                  }
              }
              """
                  st = st.replace("function handleLicenseTap() {", rec_only_js + "\n    function handleLicenseTap() {", 1)

              # На случай если в репозитории уже сохранилось 2 объявления let isRecordingLogs — оставляем строго одно!
              parts = st.split("let isRecordingLogs =")
              if len(parts) > 2:
                  st = parts[0] + "let isRecordingLogs =" + parts[1] + "isRecordingLogs =" + "isRecordingLogs =".join(parts[2:])

              extra_privacy_cards = """
                  <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">🕒 Скрывать точное время входа</div>
                              <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">Показывать собеседникам только статус «Был(а) за последние 24ч»</div>
                          </div>
                          <input type="checkbox" checked={hideLastSeenEnabled} on:change={toggleHideLastSeen} style="width: 22px; height: 22px; accent-color: #1D4ED8; flex-shrink: 0;" />
                      </div>
                  </div>

                  <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px;">
                          <div>
                              <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">📡 Невидимка в «Люди рядом» (Wi-Fi)</div>
                              <div style="font-size: 12px; color: #9CA3AF; margin-top: 4px;">Запретить другим пользователям видеть ваш @ник в локальной сети Wi-Fi</div>
                          </div>
                          <input type="checkbox" checked={hideNearbyWifiEnabled} on:change={toggleHideNearbyWifi} style="width: 22px; height: 22px; accent-color: #1D4ED8; flex-shrink: 0;" />
                      </div>
                  </div>
              """
              if "Скрывать точное время входа" not in st:
                  st = st.replace(
                      '<div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1E1F22; border-radius: 24px;">\n            <div style="display: flex; justify-content: space-between; align-items: center;">\n                <div>\n                    <div style="font-weight: 700; color: #E3E3E3; font-size: 15px;">🕵️ Анонимный просмотр историй (24ч)</div>',
                      extra_privacy_cards + '\n        <div class="settings-card" style="margin-top: 14px; padding: 16px; background: #1A1C20; border-radius: 24px;">\n            <div style="display: flex; justify-content: space-between; align-items: center;">\n                <div>\n                    <div style="font-weight: 700; color: #E5E7EB; font-size: 15px;">🕵️ Анонимный просмотр историй (24ч)</div>',
                      1
                  )

              with open(st_path, "w", encoding="utf-8") as f:
                  f.write(st)
              print("[OK] 7. Settings.svelte проверен и очищен от дубликата isRecordingLogs")

          # 8. Глобальная замена всех фиолетовых цветов на Тёмно-синий + Тёмно-серый
          purple_to_darkblue = [
              ("#6366f1", "#1D4ED8"),
              ("#6c5ce7", "#1E40AF"),
              ("#5a4fcf", "#1E3A8A"),
              ("#a29bfe", "#60A5FA"),
              ("#a78bfa", "#3B82F6"),
              ("#1a1a2e", "#16181D"),
              ("#1e1e2e", "#1A1C20"),
              ("#11111b", "#141619"),
              ("#0c0c14", "#121316"),
              ("rgba(99, 102, 241,", "rgba(29, 78, 216,"),
              ("rgba(99,102,241,", "rgba(29,78,216,"),
              ("rgba(108, 92, 231,", "rgba(30, 64, 175,"),
              ("rgba(162, 155, 254,", "rgba(59, 130, 246,"),
              ("'1.0.2-beta'", "'2.5.0-hydra'"),
          ]
          for root, _, files in os.walk("frontend/src"):
              for fn in files:
                  if fn.endswith((".svelte", ".js", ".css")):
                      fp = os.path.join(root, fn)
                      with open(fp, "r", encoding="utf-8") as f:
                          c = f.read()
                      orig = c
                      for o, n in purple_to_darkblue:
                          c = c.replace(o, n)
                      if fn == "utils.js":
                          c = re.sub(r"#667eea|#764ba2|#6B73FF|#000DFF|#8E2DE2|#4A00E0|#c471f5|#fa71cd", "#1E3A8A", c)
                      if c != orig:
                          with open(fp, "w", encoding="utf-8") as f:
                              f.write(c)

          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()
              darkblue_css = """
              :global(:root) {
                  --bg-primary: #121316 !important;
                  --bg-secondary: #1A1C20 !important;
                  --bg-tertiary: #22252A !important;
                  --bg-input: #141619 !important;
                  --accent: #1D4ED8 !important;
                  --text-primary: #E5E7EB !important;
                  --text-secondary: #9CA3AF !important;
                  --border: rgba(59, 130, 246, 0.16) !important;
              }
              :global(body), :global(.app-container), :global(.login-screen), :global(.content-area) {
                  background: #121316 !important;
                  color: #E5E7EB !important;
              }
              :global(.sidebar), :global(.glass-panel), :global(.settings-card), :global(.modal-content) {
                  background: #1A1C20 !important;
                  border: 1px solid rgba(59, 130, 246, 0.16) !important;
                  border-radius: 24px !important;
              }
              :global(.btn-primary), :global(.btn-primary-premium) {
                  background: linear-gradient(135deg, #1E3A8A, #1D4ED8) !important;
                  color: #FFFFFF !important;
                  border: 1px solid rgba(96, 165, 250, 0.3) !important;
                  border-radius: 100px !important;
                  font-weight: 700 !important;
              }
              :global(.message.outgoing .message-bubble:not(.circle-only-bubble)) {
                  background: linear-gradient(135deg, #172554, #1E3A8A) !important;
                  border: 1px solid rgba(59, 130, 246, 0.28) !important;
                  color: #F3F4F6 !important;
              }
              """
              if "--bg-primary: #121316 !important;" not in ap:
                  ap = ap.replace("</style>", darkblue_css + "\n</style>", 1)
                  with open(app_path, "w", encoding="utf-8") as f:
                      f.write(ap)
          print("[OK] 8. Вся тема переведена в Тёмно-синий + Тёмно-серый графит (v2.5.0-hydra)!")
          PYEOF
          python3 sync_relay_v25.py
          rm -f sync_relay_v25.py
          gofmt -w internal/ mobile/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit Hydra v2.5.0 Stage 5 Release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Release Hydra v2.5.0: Sync with VPS Relay v2.5, auto-resolve nicknames (@kira/@gibel/@sidr), Dark Blue theme, Wi-Fi Nearby & Stage 5 [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
