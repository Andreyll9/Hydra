              old_call_btn = """            <button type="button" on:click={startHydraCall} style="background: #8AB4F8; color: #062E6F; border: none; border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 17px; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 8px rgba(138,180,248,0.35);" title="Позвонить (WebRTC E2EE)">
                          📞
                      </button>
                  </div>"""

              new_call_and_3dots = """            <button type="button" on:click={startHydraCall} style="background: #1D4ED8; color: #fff; border: none; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; flex-shrink: 0;" title="Позвонить">
                          📞
                      </button>
                      <div style="position: relative;">
                          <button type="button" on:click|stopPropagation={() => showChatHeaderMenu = !showChatHeaderMenu} style="background: #22252A; color: #E5E7EB; border: 1px solid rgba(59,130,246,0.25); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; cursor: pointer;">
                              ⋮
                          </button>
                          {#if showChatHeaderMenu}
                              <div style="position: fixed; top: 62px; right: 14px; background: #1A1C20; border: 1px solid rgba(59,130,246,0.3); border-radius: 16px; padding: 6px; z-index: 99995; min-width: 210px; box-shadow: 0 12px 32px rgba(0,0,0,0.7);">
                                  {#if String(selectedContact?.Nickname || '').startsWith('👥') || String(selectedContact?.Nickname || '').startsWith('📢')}
                                      <button type="button" on:click={() => { showChatHeaderMenu = false; showRoomSettingsModal = true; }} style="width: 100%; text-align: left; padding: 10px 12px; background: transparent; color: #60A5FA; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer;">⚙️ Настройки Группы/Канала</button>
                                  {/if}
                                  <button type="button" on:click={clearCurrentChatHistory} style="width: 100%; text-align: left; padding: 10px 12px; background: transparent; color: #E5E7EB; border: none; border-radius: 10px; font-size: 13px; cursor: pointer;">🧹 Очистить историю чата</button>
                                  {#if !selectedContact?.IsFavorites && selectedContact?.Nickname !== 'Избранное'}
                                      <button type="button" on:click={deleteCurrentChatContact} style="width: 100%; text-align: left; padding: 10px 12px; background: transparent; color: #ff6b6b; border: none; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">🗑️ Удалить чат</button>
                                  {/if}
                              </div>
                          {/if}
                      </div>
                  </div>"""

              ch = ch.replace(old_call_btn, new_call_and_3dots)

              # Добавляем кнопку "📥 В Галерею" под видео-кружками
              ch = ch.replace(
                  '<div style="position: absolute; bottom: 10px; right: 28px; background: rgba(0,0,0,0.65); color: #8AB4F8; border-radius: 100px; padding: 2px 8px; font-size: 10px; font-weight: 700; pointer-events: none;">🔊 Нажмите для звука</div>\n                                  </div>',
                  '<div style="position: absolute; bottom: 10px; right: 28px; background: rgba(0,0,0,0.65); color: #8AB4F8; border-radius: 100px; padding: 2px 8px; font-size: 10px; font-weight: 700; pointer-events: none;">🔊 Звук</div>\n                                  </div>\n                                  <button type="button" on:click|stopPropagation={() => saveMediaDataUrlToGallery(msg.Content.slice("[HYDRA_CIRCLE]:".length), "hydra_circle")} style="margin-top: 6px; background: #1A1C20; color: #60A5FA; border: 1px solid rgba(59,130,246,0.25); border-radius: 100px; padding: 4px 10px; font-size: 11px; cursor: pointer;">📥 Сохранить в Галерею</button>'
              )

              # Модальное окно настроек Группы / Канала (как в Telegram: участники, права публикации, ссылка-ключ)
              room_modal_html = """
          {#if showRoomSettingsModal && selectedContact}
              <div style="position: fixed; inset: 0; background: rgba(10,11,16,0.9); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 16px;">
                  <div style="background: #1A1C20; border: 1px solid rgba(59,130,246,0.3); border-radius: 24px; padding: 20px; width: 100%; max-width: 380px;">
                      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                          <h3 style="margin: 0; color: #E5E7EB; font-size: 17px;">⚙️ Управление: {selectedContact.Nickname}</h3>
                          <button type="button" on:click={() => showRoomSettingsModal = false} style="background: #28292D; color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px;">✕</button>
                      </div>
                      <div style="padding: 12px; background: #121316; border-radius: 14px; margin-bottom: 12px; font-size: 12px; color: #9CA3AF;">
