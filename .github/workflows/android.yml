name: Build TeleGhost Android (VPS Signed)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Enable Real E2EE (X25519 + XChaCha20-Poly1305), Ed25519 Relay Auth & HTTPS/WSS (rtbeta.duckdns.org)
        run: |
          cat << 'PYEOF' > enable_e2ee_https.py
          import os

          # 1. Переводим все адреса сервера на HTTPS / WSS (rtbeta.duckdns.org:443)
          url_files = [
              "internal/appcore/appcore.go",
              "internal/appcore/contacts.go",
              "internal/network/messenger/messenger.go",
              "frontend/src/components/Settings.svelte",
              "frontend/src/components/Sidebar.svelte",
              "frontend/src/components/Modals.svelte",
              "frontend/src/components/Auth.svelte",
          ]
          for path in url_files:
              if os.path.exists(path):
                  with open(path, "r", encoding="utf-8") as f:
                      txt = f.read()
                  txt = txt.replace("http://191.223.137.164:8085", "https://rtbeta.duckdns.org")
                  txt = txt.replace("ws://191.223.137.164:8085/ws", "wss://rtbeta.duckdns.org/ws")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(txt)
          print("[OK] 1. Все адреса переведены на https://rtbeta.duckdns.org и wss://rtbeta.duckdns.org/ws")

          # 2. Создаём файл internal/core/identity/e2ee.go с настоящим X25519 + XChaCha20-Poly1305
          e2ee_code = '''package identity

          import (
          	"crypto/rand"
          	"crypto/sha256"
          	"crypto/sha512"
          	"encoding/base64"
          	"errors"
          	"io"
          	"math/big"
          	"strings"

          	"golang.org/x/crypto/chacha20poly1305"
          	"golang.org/x/crypto/curve25519"
          )

          const E2EEPrefix = "[HYDRA_E2EE]:"

          func ed25519PrivToX25519(edPriv []byte) []byte {
          	h := sha512.Sum512(edPriv[:32])
          	h[0] &= 248
          	h[31] &= 127
          	h[31] |= 64
          	return h[:32]
          }

          func ed25519PubToX25519(edPub []byte) ([]byte, error) {
          	if len(edPub) != 32 {
          		return nil, errors.New("invalid ed25519 pubkey length")
          	}
          	// p = 2^255 - 19
          	p := new(big.Int).Sub(new(big.Int).Lsh(big.NewInt(1), 255), big.NewInt(19))
          	yBE := make([]byte, 32)
          	for i := 0; i < 32; i++ {
          		yBE[31-i] = edPub[i]
          	}
          	yBE[0] &= 0x7f
          	y := new(big.Int).SetBytes(yBE)

          	one := big.NewInt(1)
          	num := new(big.Int).Add(one, y)
          	den := new(big.Int).Sub(one, y)
          	den.Mod(den, p)
          	denInv := new(big.Int).ModInverse(den, p)
          	if denInv == nil {
          		return nil, errors.New("invalid curve point")
          	}
          	u := new(big.Int).Mul(num, denInv)
          	u.Mod(u, p)

          	uBE := make([]byte, 32)
          	u.FillBytes(uBE)
          	uLE := make([]byte, 32)
          	for i := 0; i < 32; i++ {
          		uLE[i] = uBE[31-i]
          	}
          	return uLE, nil
          }

          func (k *Keys) deriveSharedKey(peerPubBase64 string) ([]byte, error) {
          	peerPubBase64 = strings.TrimSpace(peerPubBase64)
          	if strings.HasPrefix(peerPubBase64, "SFlEUkFfUk9PTV") {
          		sum := sha256.Sum256([]byte("HYDRA-ROOM-E2EE-V1:" + peerPubBase64))
          		return sum[:], nil
          	}
          	peerBytes, err := base64.StdEncoding.DecodeString(peerPubBase64)
          	if err != nil {
          		return nil, err
          	}
          	xPub, err := ed25519PubToX25519(peerBytes)
          	if err != nil {
          		return nil, err
          	}
          	xPriv := ed25519PrivToX25519(k.SigningPrivateKey)
          	shared, err := curve25519.X25519(xPriv, xPub)
          	if err != nil {
          		return nil, err
          	}
          	sum := sha256.Sum256(shared)
          	return sum[:], nil
          }

          // EncryptForPeer шифрует строку ключом X25519 + XChaCha20-Poly1305
          func (k *Keys) EncryptForPeer(peerPubBase64, plaintext string) string {
          	if plaintext == "" || strings.HasPrefix(plaintext, E2EEPrefix) {
          		return plaintext
          	}
          	symKey, err := k.deriveSharedKey(peerPubBase64)
          	if err != nil {
          		return plaintext
          	}
          	aead, err := chacha20poly1305.NewX(symKey)
          	if err != nil {
          		return plaintext
          	}
          	nonce := make([]byte, aead.NonceSize())
          	if _, err := io.ReadFull(rand.Reader, nonce); err != nil {
          		return plaintext
          	}
          	sealed := aead.Seal(nonce, nonce, []byte(plaintext), nil)
          	return E2EEPrefix + base64.StdEncoding.EncodeToString(sealed)
          }

          // DecryptFromPeer расшифровывает строку, если она имеет префикс [HYDRA_E2EE]:
          func (k *Keys) DecryptFromPeer(peerPubBase64, payload string) string {
          	if !strings.HasPrefix(payload, E2EEPrefix) {
          		return payload
          	}
          	raw, err := base64.StdEncoding.DecodeString(strings.TrimPrefix(payload, E2EEPrefix))
          	if err != nil {
          		return payload
          	}
          	symKey, err := k.deriveSharedKey(peerPubBase64)
          	if err != nil {
          		return payload
          	}
          	aead, err := chacha20poly1305.NewX(symKey)
          	if err != nil || len(raw) < aead.NonceSize() {
          		return payload
          	}
          	nonce, ct := raw[:aead.NonceSize()], raw[aead.NonceSize():]
          	plain, err := aead.Open(nil, nonce, ct, nil)
          	if err != nil {
          		return payload
          	}
          	return string(plain)
          }
          '''
          with open("internal/core/identity/e2ee.go", "w", encoding="utf-8") as f:
              f.write(e2ee_code)
          print("[OK] 2. Создан internal/core/identity/e2ee.go (X25519 + XChaCha20-Poly1305)")

          # 3. Включаем E2EE в messenger.go (WebSocket)
          ms_path = "internal/network/messenger/messenger.go"
          if os.path.exists(ms_path):
              with open(ms_path, "r", encoding="utf-8") as f:
                  ms = f.read()
              if "EncryptForPeer" not in ms:
                  ms = ms.replace(
                      'Content:   content,',
                      'Content:   s.identity.EncryptForPeer(destination, content),',
                      1
                  )
                  ms = ms.replace(
                      'Content:     textMsg.Content,',
                      'Content:     s.identity.DecryptFromPeer(senderPubKey, textMsg.Content),',
                      1
                  )
                  with open(ms_path, "w", encoding="utf-8") as f:
                      f.write(ms)
                  print("[OK] 3. messenger.go: включено E2EE для WebSocket")

          # 4. Включаем E2EE и подпись Ed25519 на /relay/send и /relay/poll в appcore.go
          ac_path = "internal/appcore/appcore.go"
          if os.path.exists(ac_path):
              with open(ac_path, "r", encoding="utf-8") as f:
                  ac = f.read()

              # Шифруем контент перед отправкой через HTTP-релей и подписываем запрос заголовками X-Hydra-Ts / X-Hydra-Sig
              old_send = '''	env := map[string]interface{}{
          		"id":          msgID,
          		"from":        myPub,
          		"from_nick":   myNick,
          		"to":          strings.TrimSpace(toPub),
          		"chat_id":     chatID,
          		"content":     text,
          		"reply_to_id": replyToID,
          		"timestamp":   time.Now().UnixMilli(),
          	}
          	raw, _ := json.Marshal(env)
          	client := &http.Client{Timeout: 15 * time.Second}
          	var resp *http.Response
          	var err error
          	for attempt := 0; attempt < 3; attempt++ {
          		resp, err = client.Post("https://rtbeta.duckdns.org/relay/send", "application/json", bytes.NewReader(raw))'''

              new_send = '''	encText := a.Identity.Keys.EncryptForPeer(toPub, text)
          	env := map[string]interface{}{
          		"id":          msgID,
          		"from":        myPub,
          		"from_nick":   myNick,
          		"to":          strings.TrimSpace(toPub),
          		"chat_id":     chatID,
          		"content":     encText,
          		"reply_to_id": replyToID,
          		"timestamp":   time.Now().UnixMilli(),
          	}
          	raw, _ := json.Marshal(env)
          	client := &http.Client{Timeout: 15 * time.Second}
          	var resp *http.Response
          	var err error
          	tsStr := fmt.Sprintf("%d", time.Now().UnixMilli())
          	sig := ed25519.Sign(a.Identity.Keys.SigningPrivateKey, []byte("HYDRA-RELAY:send:"+myPub+":"+tsStr))
          	sigB64 := base64.StdEncoding.EncodeToString(sig)
          	for attempt := 0; attempt < 3; attempt++ {
          		req, _ := http.NewRequest("POST", "https://rtbeta.duckdns.org/relay/send", bytes.NewReader(raw))
          		req.Header.Set("Content-Type", "application/json")
          		req.Header.Set("X-Hydra-Ts", tsStr)
          		req.Header.Set("X-Hydra-Sig", sigB64)
          		resp, err = client.Do(req)'''

              ac = ac.replace(old_send, new_send)

              # Подписываем личный /relay/poll заголовками X-Hydra-Ts / X-Hydra-Sig
              old_poll = 'resp, err := client.Get("https://rtbeta.duckdns.org/relay/poll?pub=" + url.QueryEscape(myPub))'
              new_poll = '''pTs := fmt.Sprintf("%d", time.Now().UnixMilli())
          			pSig := base64.StdEncoding.EncodeToString(ed25519.Sign(a.Identity.Keys.SigningPrivateKey, []byte("HYDRA-RELAY:poll:"+myPub+":"+pTs)))
          			pReq, _ := http.NewRequest("GET", "https://rtbeta.duckdns.org/relay/poll?pub="+url.QueryEscape(myPub), nil)
          			pReq.Header.Set("X-Hydra-Ts", pTs)
          			pReq.Header.Set("X-Hydra-Sig", pSig)
          			resp, err := client.Do(pReq)'''
              ac = ac.replace(old_poll, new_poll)

              # Расшифровываем входящие сообщения в OnMessageReceived до обработки всех префиксов
              if "DecryptFromPeer" not in ac:
                  ac = ac.replace(
                      'msg.ChatID = contact.ChatID',
                      'msg.ChatID = contact.ChatID\n\tif a.Identity != nil && a.Identity.Keys != nil {\n\t\tmsg.Content = a.Identity.Keys.DecryptFromPeer(senderPubKey, msg.Content)\n\t}'
                  )

              with open(ac_path, "w", encoding="utf-8") as f:
                  f.write(ac)
              print("[OK] 4. appcore.go: включено E2EE и Ed25519-авторизация на /relay/send и /relay/poll")
          PYEOF
          python3 enable_e2ee_https.py
          rm -f enable_e2ee_https.py
          gofmt -w internal/

      - name: Install jsQR & Build Frontend (Svelte)
        working-directory: ./frontend
        run: |
          npm install
          npm install jsqr --save
          npm run build

      - name: Commit E2EE & HTTPS/WSS Upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Security upgrade: real X25519 + XChaCha20-Poly1305 E2EE, Ed25519 relay auth & HTTPS/WSS on rtbeta.duckdns.org [skip ci]"
            git pull --rebase origin main || true
            git push || true
          fi

      - name: Prepare Android SDK & NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      - name: Clean Go Mod
        run: go mod tidy

      - name: Copy Frontend to Mobile Assets
        run: |
          mkdir -p mobile/dist
          cp -r frontend/dist/* mobile/dist/

      - name: Build Go Mobile AAR
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH=$PATH:$(go env GOPATH)/bin
          gomobile init
          mkdir -p android/app/libs
          gomobile bind -target=android -androidapi 24 -o android/app/libs/teleghost.aar ./mobile

      - name: Build Signed APK with Persistent Key
        working-directory: ./android
        run: |
          cp -f app/hydra-release-key.jks app/release-key.jks
          gradle assembleRelease --no-daemon

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-Signed-APK
          path: android/app/build/outputs/apk/release/*.apk
