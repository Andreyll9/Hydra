              ap = ap.replace("AppActions.CopyToClipboard(", "AppActions.ClipboardSet(")

              # В контекстном меню сообщения добавляем строку быстрых реакций (🔥 ❤️ 👍 😂 ⚡ 🛡️), кнопку "📌 Закрепить в чате" и двойное удаление (у меня / у всех)!
              old_msg_ctx = """    {#if messageContextMenu.show}
              <div class="menu-backdrop" on:click={() => messageContextMenu.show = false} on:touchmove|preventDefault></div>
              <div class="context-menu" style="top: {messageContextMenu.y}px; left: {messageContextMenu.x}px">
                  <div class="context-item" on:click={() => {
                      replyingTo = messageContextMenu.message;"""

              new_msg_ctx = """    {#if messageContextMenu.show}
              <div class="menu-backdrop" on:click={() => messageContextMenu.show = false} on:touchmove|preventDefault></div>
              <div class="context-menu" style="top: {messageContextMenu.y}px; left: {messageContextMenu.x}px; min-width: 210px; border-radius: 18px; padding: 8px;">
                  <div style="display: flex; justify-content: space-around; padding: 6px 4px 10px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 4px;">
                      {#each ['🔥','❤️','👍','😂','⚡','🛡️'] as reactEmoji}
                          <button type="button" on:click={() => {
                              const mId = messageContextMenu.message?.ID;
                              messageContextMenu.show = false;
                              if (mId && window.__setHydraReaction) window.__setHydraReaction(mId, reactEmoji, true);
                          }} style="background: transparent; border: none; font-size: 20px; cursor: pointer; padding: 2px;">{reactEmoji}</button>
                      {/each}
                  </div>
                  <div class="context-item" on:click={() => {
                      if (window.__pinHydraMessageInChat) window.__pinHydraMessageInChat(messageContextMenu.message);
                      messageContextMenu.show = false;
                  }}>📌 Закрепить в чате</div>
                  <div class="context-item" on:click={() => {
                      replyingTo = messageContextMenu.message;"""
              ap = ap.replace(old_msg_ctx, new_msg_ctx)

              old_del_item = """            <div class="context-item danger" on:click={() => {
                          AppActions.DeleteMessage(messageContextMenu.message.ID);
                          loadMessages(selectedContact.ID);
                          messageContextMenu.show = false;
                      }}>Удалить</div>"""
              new_del_items = """            <div class="context-item danger" on:click={() => {
                          AppActions.DeleteMessage(messageContextMenu.message.ID);
                          loadMessages(selectedContact.ID);
                          messageContextMenu.show = false;
                      }}>🗑️ Удалить у меня</div>
                      <div class="context-item danger" style="font-weight: 700;" on:click={async () => {
