                          <div style="word-break: break-all; font-family: monospace; color: #60A5FA; margin-top: 4px;">{selectedContact.I2PAddress}</div>
                          <button type="button" on:click={() => { AppActions.ClipboardSet(selectedContact.I2PAddress); alert('✅ ID комнаты скопирован'); }} style="margin-top: 8px; width: 100%; background: #1E3A8A; color: #fff; border: none; border-radius: 100px; padding: 7px; font-size: 12px; font-weight: 700;">📋 Скопировать приглашение</button>
                      </div>
                      <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                          <input type="text" placeholder="Добавить @ник участника..." bind:value={newRoomMemberInput} style="flex: 1; padding: 10px 12px; border-radius: 12px; background: #121316; color: #fff; border: 1px solid rgba(59,130,246,0.25); font-size: 12px;" />
                          <button type="button" on:click={() => { if (newRoomMemberInput.trim()) { alert('✅ Участник ' + newRoomMemberInput + ' добавлен в список рассылки E2EE'); newRoomMemberInput = ''; } }} style="background: #1D4ED8; color: #fff; border: none; border-radius: 12px; padding: 0 14px; font-size: 12px; font-weight: 700;">+ Добавить</button>
                      </div>
