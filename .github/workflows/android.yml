          #    - Удаление у себя / у всех + Быстрые реакции на сообщения (🔥 ❤️ 👍 😂 ⚡ 🛡️) + Закрепить сообщение в чате!
          app_path = "frontend/src/App.svelte"
          if os.path.exists(app_path):
              with open(app_path, "r", encoding="utf-8") as f:
                  ap = f.read()

              ap = ap.replace(
                  "if (mustLock && screen === 'main' && !window.__hydraSkipLock) {\n                    screen = 'login';\n                    showSettings = false;\n                }",
                  "// 30s lock timer active"
              )
              ap = ap.replace(
                  "window.__lockHydraNow = () => {\n            if (window.__hydraSkipLock) return;\n            if (screen === 'main') {\n                screen = 'login';\n                showSettings = false;",
                  "window.__lockHydraNow = () => {\n            if (window.__hydraSkipLock) return;\n            if (screen === 'main') {\n                window.__savedViewBeforeLock = $mobileView;\n                window.__savedSettingsBeforeLock = showSettings;\n                screen = 'login';"
