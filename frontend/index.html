<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        name="viewport" />
    <title>teleghost</title>
</head>

<body>
    <div id="app"></div>
    <script src="./src/main.js" type="module"></script>

<!-- HYDRA_LOGGER_START -->
<style>
  
  #hydra-blur-curtain {
    position: fixed;
    inset: 0;
    z-index: 2147483645;
    backdrop-filter: blur(28px) brightness(0.32);
    -webkit-backdrop-filter: blur(28px) brightness(0.32);
    background: rgba(10, 11, 16, 0.78);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #E3E3E3;
    font-family: sans-serif;
    user-select: none;
    pointer-events: none;
  }

  html, body, #app {
    position: fixed !important;
    inset: 0 !important;
    width: 100% !important;
    height: 100% !important;
    max-height: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow: hidden !important;
    overscroll-behavior: none !important;
  }
</style>
<script>
  (function() {
    if (window.__hydraGlobalLoggerReady) return;
    window.__hydraGlobalLoggerReady = true;
    window.__hydraLogList = [];

    
    window.__setHydraBlur = function(active) {
      var el = document.getElementById('hydra-blur-curtain');
      if (!el) {
        el = document.createElement('div');
        el.id = 'hydra-blur-curtain';
        el.innerHTML = '<div style="font-size:48px;margin-bottom:12px;">🛡️</div><div style="font-weight:800;font-size:18px;color:#8AB4F8;">Hydra защищена</div><div style="font-size:12px;color:#9AA0A6;margin-top:4px;">Экран скрыт матовым фильтром безопасности</div>';
        document.body.appendChild(el);
      }
      el.style.display = active ? 'flex' : 'none';
    };
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState === 'hidden') {
        window.__setHydraBlur(true);
      } else {
        setTimeout(function() { window.__setHydraBlur(false); }, 350);
      }
    });
    
    window.__addHydraLog = function(tag, msg) {
      var d = new Date();
      var t = d.toTimeString().split(' ')[0] + '.' + String(d.getMilliseconds()).padStart(3, '0');
      var line = '[' + t + '] [' + tag + '] ' + msg;
      window.__hydraLogList.unshift(line);
      if (window.__hydraLogList.length > 500) window.__hydraLogList.pop();
      window.dispatchEvent(new CustomEvent('hydra-log-updated'));
    };

    document.addEventListener('click', function(e) {
      var t = e.target;
      if (!t) return;
      var el = t.closest ? (t.closest('button, a, input, label, select, [role="button"]') || t) : t;
      var txt = (el.innerText || el.placeholder || el.value || el.className || '').toString().replace(/\s+/g, ' ').trim().slice(0, 50);
      window.__addHydraLog('UI-CLICK', '<' + (el.tagName || 'EL') + '> "' + txt + '"');
    }, true);

    var origFetch = window.fetch.bind(window);
    window.fetch = async function(url, opts) {
      var u = String(url);
      if (u.indexOf('/api/') !== -1 && u.indexOf('/api/events') === -1 && u.indexOf('AppendDebugLog') === -1 && u.indexOf('GetNetworkStatus') === -1) {
        var mName = u.split('/api/')[1];
        var bodyStr = '';
        try { bodyStr = (opts && opts.body ? String(opts.body) : '').slice(0, 300); } catch(e){}
        var t0 = Date.now();
        window.__addHydraLog('RPC-REQ', mName + ' -> ' + (bodyStr || '{}'));
        try {
          var resp = await origFetch(url, opts);
          var clone = resp.clone();
          var data = await clone.json().catch(function(){ return {}; });
          var dt = Date.now() - t0;
          if (!resp.ok || data.error) {
            var errMsg = data.error || resp.statusText || ('HTTP ' + resp.status);
            window.__addHydraLog('RPC-ERR', mName + ' (' + dt + ' мс) ❌ ОШИБКА: ' + errMsg);
            return new Response(JSON.stringify({ result: null, error: errMsg }), {
              status: 200,
              headers: { 'Content-Type': 'application/json' }
            });
          } else {
            var resFormatted = '✅ Выполнено успешно (OK)';
            if (data.result !== null && data.result !== undefined && data.result !== '') {
              try { resFormatted = JSON.stringify(data.result).slice(0, 400); } catch(e){}
            }
            window.__addHydraLog('RPC-OK', mName + ' (' + dt + ' мс) -> ' + resFormatted);
          }
          return resp;
        } catch (err) {
          window.__addHydraLog('RPC-ERR', mName + ' ❌ СБОЙ СЕТИ: ' + err);
          throw err;
        }
      }
      return origFetch(url, opts);
    };

    window.addEventListener('error', function(e) {
      window.__addHydraLog('JS-ERR', e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
    });
    window.addEventListener('unhandledrejection', function(e) {
      window.__addHydraLog('PROMISE-ERR', String(e.reason));
    });
  })();
</script>
<!-- HYDRA_LOGGER_END -->
</body>

</html>
